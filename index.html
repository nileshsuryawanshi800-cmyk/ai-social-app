<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Social</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  font-size: 22px;
  margin: 0;
}

.ai-button {
  background: #111;
  color: white;
  border: none;
  padding: 11px 15px;
  border-radius: 22px;
  font-size: 15px;
}

/* WELCOME */

.welcome {
  background: white;
  padding: 22px 18px;
  border-bottom: 1px solid #eee;
}

.welcome h2 {
  margin: 0 0 7px;
}

/* POSTS */

#posts {
  width: 100%;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* PROFILE HEADER */

.post-header {
  padding: 15px;
}

.profile-link {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  width: fit-content;
}

.post-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 28px;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-size: 18px;
  font-weight: bold;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 650px;
  object-fit: contain;
  background: #000;
  display: block;
  cursor: pointer;
}

/* CAPTION */

.post-content {
  padding: 15px;
  font-size: 17px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: pointer;
}

/* LARGE ACTION BUTTONS */

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}

.actions button {
  border: none;
  background: #f2f2f2;
  border-radius: 25px;
  padding: 13px 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.actions button:active {
  transform: scale(0.96);
}

/* DELETE */

.delete-button {
  width: calc(100% - 24px);
  margin: 0 12px 14px;
  border: 1px solid #ffdddd;
  background: #fff5f5;
  color: red;
  border-radius: 25px;
  padding: 13px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

/* COMMENTS */

.comments {
  padding: 0 15px 12px;
}

.comment {
  background: #f5f5f5;
  padding: 9px 12px;
  border-radius: 12px;
  margin-top: 7px;
}

.comment-name {
  font-weight: bold;
}

/* EMPTY */

.empty {
  text-align: center;
  padding: 40px 20px;
  color: #777;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 500;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  padding: 5px;
}

/* FULL POST VIEW */

#postViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  z-index: 2000;
  overflow-y: auto;
  padding: 20px 10px;
}

.viewer-box {
  max-width: 700px;
  margin: 45px auto 30px;
  background: white;
  border-radius: 18px;
  overflow: hidden;
}

.viewer-close {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 25px;
  z-index: 2001;
}

.viewer-profile {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  font-size: 18px;
}

.viewer-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  overflow: hidden;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.viewer-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: #000;
}

.viewer-content {
  padding: 16px;
  font-size: 17px;
  white-space: pre-wrap;
}

.viewer-info {
  padding: 14px 16px;
  border-top: 1px solid #eee;
  font-size: 15px;
}

</style>

</head>

<body>

<header>

<h1>✨ AI Social</h1>

<button
class="ai-button"
onclick="goAI()">
🤖 AI Chat
</button>

</header>


<section class="welcome">

<h2>Welcome 👋</h2>

<p>Connect, share and chat with AI.</p>

</section>


<div id="posts"></div>


<!-- FULL POST -->

<div id="postViewer">

<button
class="viewer-close"
onclick="closePost()">
✕
</button>

<div
class="viewer-box"
id="viewerBox">
</div>

</div>


<!-- NAVIGATION -->

<nav>

<button onclick="goHome()">
🏠<br>Home
</button>

<button onclick="goSearch()">
🔍<br>Search
</button>

<button onclick="goCreate()">
➕<br>Create
</button>

<button onclick="goAI()">
🤖<br>AI
</button>

<button onclick="goProfile()">
👤<br>Profile
</button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch(error) {

    return [];

  }

}


/* =========================
SAVE
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
PROFILE DATA
========================= */

function getUsername(post) {

  return (
    post.username ||
    localStorage.getItem("username") ||
    "AI Social User"
  );

}

function getProfileImage(post) {

  return (
    post.profileImage ||
    localStorage.getItem("profileImage") ||
    ""
  );

}


/* =========================
LOAD POSTS
========================= */

function loadPosts() {

  const postsBox =
    document.getElementById("posts");

  const posts =
    getPosts();

  postsBox.innerHTML = "";


  if (posts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br><br>' +
      'Tap ➕ Create to make your first post 📸' +
      '</div>';

    return;

  }


  posts.forEach(function(postData, index) {

    const post =
      document.createElement("div");

    post.className =
      "post";


    /* =========================
    HEADER
    ========================= */

    const header =
      document.createElement("div");

    header.className =
      "post-header";


    const profileLink =
      document.createElement("div");

    profileLink.className =
      "profile-link";


    profileLink.onclick =
      function(event) {

        event.stopPropagation();

        window.location.href =
          "profile.html";

      };


    const avatar =
      document.createElement("div");

    avatar.className =
      "post-avatar";


    const profileImage =
      getProfileImage(postData);


    if (profileImage) {

      const img =
        document.createElement("img");

      img.src =
        profileImage;

      avatar.appendChild(img);

    } else {

      avatar.textContent =
        "👤";

    }


    const username =
      document.createElement("div");

    username.className =
      "post-username";

    username.textContent =
      getUsername(postData);


    profileLink.appendChild(
      avatar
    );

    profileLink.appendChild(
      username
    );

    header.appendChild(
      profileLink
    );

    post.appendChild(
      header
    );


    /* =========================
    MEDIA
    ========================= */

    if (
      postData.media &&
      postData.mediaType
    ) {

      let media = null;


      if (
        postData.mediaType
          .toLowerCase()
          .startsWith("image/")
      ) {

        media =
          document.createElement("img");

        media.src =
          postData.media;

      }


      if (
        postData.mediaType
          .toLowerCase()
          .startsWith("video/")
      ) {

        media =
          document.createElement("video");

        media.src =
          postData.media;

        media.controls =
          true;

        media.playsInline =
          true;

      }


      if (media) {

        media.className =
          "post-media";


        media.onclick =
          function(event) {

            event.stopPropagation();

            openPost(postData);

          };


        post.appendChild(
          media
        );

      }

    }


    /* =========================
    CAPTION
    ========================= */

    if (postData.text) {

      const caption =
        document.createElement("div");

      caption.className =
        "post-content";

      caption.textContent =
        postData.text;


      caption.onclick =
        function(event) {

          event.stopPropagation();

          openPost(postData);

        };


      post.appendChild(
        caption
      );

    }


    /* =========================
    ACTIONS
    ========================= */

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    

/* LIKE */

const likeButton =
  document.createElement("button");

function updateLikeButton() {

  const count =
    Number(postData.likeCount) || 0;

  likeButton.textContent =
    "❤️ Like " + count;
}

updateLikeButton();

likeButton.onclick = function(event) {

  event.stopPropagation();

  postData.liked =
    postData.liked !== true;

  if (postData.liked) {

    postData.likeCount =
      (Number(postData.likeCount) || 0) + 1;

  } else {

    postData.likeCount =
      Math.max(
        0,
        (Number(postData.likeCount) || 0) - 1
      );

  }

  savePosts(posts);

  updateLikeButton();

};
  


    /* COMMENT */

    const commentButton =
      document.createElement("button");

    commentButton.textContent =
      "💬 Comment";


    commentButton.onclick =
      function(event) {

        event.stopPropagation();


        const comment =
          prompt(
            "Write your comment:"
          );


        if (
          comment === null ||
          comment.trim() === ""
        ) {

          return;

        }


        if (
          !Array.isArray(
            postData.comments
          )
        ) {

          postData.comments =
            [];

        }


        postData.comments.push(
          comment.trim()
        );


        savePosts(posts);

        loadPosts();

      };


    /* SHARE */

    const shareButton =
      document.createElement("button");

    shareButton.textContent =
      "↗️ Share";


    shareButton.onclick =
      function(event) {

        event.stopPropagation();

        sharePost(postData);

      };


    actions.appendChild(
      likeButton
    );

    actions.appendChild(
      commentButton
    );

    actions.appendChild(
      shareButton
    );


    post.appendChild(
      actions
    );


    /* =========================
    COMMENTS
    ========================= */

    const commentsBox =
      document.createElement("div");

    commentsBox.className =
      "comments";


    if (
      Array.isArray(
        postData.comments
      )
    ) {

      postData.comments.forEach(
        function(comment) {

          const item =
            document.createElement("div");

          item.className =
            "comment";


          const name =
            document.createElement("span");

          name.className =
            "comment-name";

          name.textContent =
            getUsername(postData) +
            ": ";


          item.appendChild(
            name
          );

          item.appendChild(
            document.createTextNode(
              comment
            )
          );


          commentsBox.appendChild(
            item
          );

        }
      );

    }


    post.appendChild(
      commentsBox
    );


    /* =========================
    DELETE
    ========================= */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Delete Post";


    deleteButton.onclick =
      function(event) {

        event.stopPropagation();


        if (
          !confirm(
            "Are you sure you want to delete this post?"
          )
        ) {

          return;

        }


        posts.splice(
          index,
          1
        );


        savePosts(posts);

        loadPosts();

      };


    post.appendChild(
      deleteButton
    );


    postsBox.appendChild(
      post
    );

  });

}


/* =========================
OPEN LARGE POST
========================= */

function openPost(postData) {

  const viewer =
    document.getElementById(
      "postViewer"
    );

  const box =
    document.getElementById(
      "viewerBox"
    );


  box.innerHTML = "";


  /* PROFILE */

  const profile =
    document.createElement("div");

  profile.className =
    "viewer-profile";


  const avatar =
    document.createElement("div");

  avatar.className =
    "viewer-avatar";


  const image =
    getProfileImage(postData);


  if (image) {

    const img =
      document.createElement("img");

    img.src =
      image;

    avatar.appendChild(img);

  } else {

    avatar.textContent =
      "👤";

  }


  const name =
    document.createElement("span");

  name.textContent =
    getUsername(postData);


  profile.appendChild(
    avatar
  );

  profile.appendChild(
    name
  );


  /* Clicking name in viewer */

  profile.onclick =
    function() {

      window.location.href =
        "profile.html";

    };


  profile.style.cursor =
    "pointer";


  box.appendChild(
    profile
  );


  /* MEDIA */

  if (
    postData.media &&
    postData.mediaType
  ) {

    let media = null;


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ) {

      media =
        document.createElement("img");

      media.src =
        postData.media;

    }


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ) {

      media =
        document.createElement("video");

      media.src =
        postData.media;

      media.controls =
        true;

      media.autoplay =
        true;

      media.playsInline =
        true;

    }


    if (media) {

      media.className =
        "viewer-media";

      box.appendChild(
        media
      );

    }

  }


  /* CAPTION */

  if (postData.text) {

    const text =
      document.createElement("div");

    text.className =
      "viewer-content";

    text.textContent =
      postData.text;

    box.appendChild(
      text
    );

  }


  /* INFO */

  const info =
    document.createElement("div");

  info.className =
    "viewer-info";

  info.textContent =
    "❤️ " +
    (
      Number(
        postData.likeCount
      ) || 0
    ) +
    "    💬 " +
    (
      Array.isArray(
        postData.comments
      )
      ? postData.comments.length
      : 0
    );


  box.appendChild(
    info
  );


  viewer.style.display =
    "block";

}


/* =========================
CLOSE
========================= */

function closePost() {

  document.getElementById(
    "postViewer"
  ).style.display =
    "none";

}


/* =========================
SHARE
========================= */

function sharePost(postData) {

  const shareText =
    getUsername(postData) +
    "\n\n" +
    (
      postData.text ||
      "Check out my post on AI Social!"
    );


  if (
    navigator.share
  ) {

    navigator.share({

      title:
        "AI Social",

      text:
        shareText,

      url:
        window.location.href

    });

    return;

  }


  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(
        shareText
      )
      .then(function() {

        alert(
          "✅ Post copied!"
        );

      });

    return;

  }


  alert(
    "Sharing is not supported."
  );

}


/* =========================
START
========================= */

loadPosts();


/* =========================
SERVICE WORKER
========================= */

if (
  "serviceWorker" in navigator
) {

  navigator.serviceWorker
    .register("./sw.js")
    .catch(function(error) {

      console.log(
        "Service worker error:",
        error
      );

    });

}

</script>

</body>

</html>
