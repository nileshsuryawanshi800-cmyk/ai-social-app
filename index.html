<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Social</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    header {
      background: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    .ai-button {
      background: #111;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .welcome {
      padding: 25px 18px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    #posts {
      width: 100%;
    }

    .post {
      background: white;
      margin: 12px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .post-header {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 25px;
    }

    .post-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-content {
      padding: 0 15px 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 20px;
      padding: 12px 15px;
      border-top: 1px solid #eee;
    }

    .actions button {
      border: none;
      background: none;
      font-size: 16px;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    nav button {
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
      padding: 5px;
    }

    .empty {
      text-align: center;
      padding: 30px 20px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>✨ AI Social</h1>

  <button class="ai-button" onclick="goAI()">
    🤖 AI Chat
  </button>
</header>

<section class="welcome">
  <h2>Welcome 👋</h2>
  <p>Connect, share and chat with AI.</p>
</section>

<!-- POSTS -->
<div id="posts"></div>

<!-- BOTTOM NAVIGATION -->
<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>

<script>

/* =========================
   NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  alert("🔍 Search feature coming soon!");
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
   LOAD POST
========================= */

function loadPosts() {

  const posts =
    document.getElementById("posts");

  const savedPost =
    localStorage.getItem("newPost");

  const username =
    localStorage.getItem("username") ||
    "You";

  const profileImage =
    localStorage.getItem("profileImage");


  posts.innerHTML = "";


  if (!savedPost) {

    posts.innerHTML =
      '<div class="empty">No posts yet.<br>Tap ➕ Create to make your first post! 📸</div>';

    return;
  }


  const post =
    document.createElement("div");

  post.className = "post";


  /* POST HEADER */

  const postHeader =
    document.createElement("div");

  postHeader.className =
    "post-header";


  /* PROFILE PICTURE */

  const avatar =
    document.createElement("div");

  avatar.className =
    "post-avatar";


  if (profileImage) {

    const image =
      document.createElement("img");

    image.src =
      profileImage;

    image.alt =
      "Profile picture";

    avatar.appendChild(image);

  } else {

    avatar.textContent =
      "👤";

  }


  /* USERNAME */

  const name =
    document.createElement("strong");

  name.textContent =
    username;


  postHeader.appendChild(avatar);

  postHeader.appendChild(name);


  /* POST TEXT */

  const content =
    document.createElement("div");

  content.className =
    "post-content";

  content.textContent =
    savedPost;


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const likeCount =
  localStorage.getItem("likeCount") || "0";

const liked =
  localStorage.getItem("liked") === "true";

actions.innerHTML = `
  <button id="likeButton" onclick="likePost()">
    ${liked ? "❤️" : "🤍"} Like
    <span id="likeCount">${likeCount}</span>
  </button>

  <button onclick="commentPost()">
    💬 Comment
  </button>

  <button onclick="sharePost()">
    ↗️ Share
  </button>
`;


  post.appendChild(postHeader);

  post.appendChild(content);

  post.appendChild(actions);

  posts.appendChild(post);

}


/* =========================
   BUTTONS
========================= */

function likePost() {

  let count =
    Number(localStorage.getItem("likeCount")) || 0;

  let liked =
    localStorage.getItem("liked") === "true";


  if (liked) {

    count--;

    liked = false;

  } else {

    count++;

    liked = true;

  }


  localStorage.setItem(
    "likeCount",
    count
  );

  localStorage.setItem(
    "liked",
    liked
  );


  const button =
    document.getElementById("likeButton");

  const countText =
    document.getElementById("likeCount");


  if (liked) {

    button.innerHTML =
      `❤️ Unlike <span id="likeCount">${count}</span>`;

  } else {

    button.innerHTML =
      `🤍 Like <span id="likeCount">${count}</span>`;

  }

}


function commentPost() {

  const comment = prompt(
    "💬 Write your comment:"
  );

  if (!comment || comment.trim() === "") {
    return;
  }

  const comments =
    JSON.parse(
      localStorage.getItem("comments") || "[]"
    );

  comments.push(comment.trim());

  localStorage.setItem(
    "comments",
    JSON.stringify(comments)
  );

  loadPosts();

}

  
function sharePost() {

  alert("↗️ Share feature coming soon!");

}


/* =========================
   START APP
========================= */

loadPosts();


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./sw.js")
    .then(() => {

      console.log(
        "Service Worker registered"
      );

    })
    .catch(error => {

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>

</body>
</html>
