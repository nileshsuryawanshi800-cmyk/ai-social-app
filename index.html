<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Social</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    header {
      background: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    .ai-button {
      background: #111;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .welcome {
      padding: 25px 18px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    #posts {
      width: 100%;
    }

    .post {
      background: white;
      margin: 12px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .post-header {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 25px;
    }

    .post-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-content {
      padding: 0 15px 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 18px;
      cursor: pointer;
    }

    .post-media {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .actions {
      display: flex;
      gap: 20px;
      padding: 12px 15px;
      border-top: 1px solid #eee;
    }

    .actions button {
      border: none;
      background: none;
      font-size: 16px;
      cursor: pointer;
    }

    .comments {
      padding: 0 15px 15px;
    }

    .comment {
      margin-top: 10px;
      cursor: pointer;
    }

    .comment img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 8px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    nav button {
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
      padding: 5px;
    }

    .delete-button {
      border: none;
      background: none;
      color: red;
      padding: 12px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 30px 20px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>✨ AI Social</h1>

  <button class="ai-button" onclick="goAI()">
    🤖 AI Chat
  </button>
</header>

<section class="welcome">
  <h2>Welcome 👋</h2>
  <p>Connect, share and chat with AI.</p>
</section>

<div id="posts"></div>

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>

<script>

/* =========================
   NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
   GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch (error) {

    return [];

  }

}


/* =========================
   SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
   LOAD POSTS
========================= */

function loadPosts() {

  const postsBox =
    document.getElementById("posts");

  postsBox.innerHTML = "";

  const posts = getPosts();

  if (posts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Tap ➕ Create to make your first post! 📸' +
      '</div>';

    return;

  }


  const username =
    localStorage.getItem("username") ||
    "You";

  const profileImage =
    localStorage.getItem("profileImage");


  posts.forEach(function(postData, index) {

    const post =
      document.createElement("div");

    post.className = "post";


    /* =========================
       POST HEADER
    ========================= */

    const postHeader =
      document.createElement("div");

    postHeader.className =
      "post-header";

    postHeader.onclick = function() {

      window.location.href =
        "profile.html";

    };


    const avatar =
      document.createElement("div");

    avatar.className =
      "post-avatar";


    if (profileImage) {

      const image =
        document.createElement("img");

      image.src =
        profileImage;

      image.alt =
        "Profile picture";

      avatar.appendChild(image);

    } else {

      avatar.textContent =
        "👤";

    }


    const name =
      document.createElement("strong");

    name.textContent =
      username;


    postHeader.appendChild(avatar);
    postHeader.appendChild(name);


    /* =========================
       POST TEXT
    ========================= */

    const content =
      document.createElement("div");

    content.className =
      "post-content";

    content.textContent =
      postData.text || "";


    if (!postData.text) {

      content.style.display =
        "none";

    }


    content.onclick = function() {

      window.location.href =
        "profile.html";

    };


    /* =========================
       POST MEDIA
    ========================= */

    let mediaElement = null;


    if (postData.media) {

      if (
        postData.mediaType &&
        postData.mediaType.startsWith("image/")
      ) {

        mediaElement =
          document.createElement("img");

        mediaElement.src =
          postData.media;

        mediaElement.className =
          "post-media";

      }


      if (
        postData.mediaType &&
        postData.mediaType.startsWith("video/")
      ) {

        mediaElement =
          document.createElement("video");

        mediaElement.src =
          postData.media;

        mediaElement.className =
          "post-media";

        mediaElement.controls = true;

        mediaElement.playsInline = true;

      }

    }


    /* =========================
       ACTIONS
    ========================= */

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    const liked =
      postData.liked === true;

    const likeCount =
      Number(postData.likeCount) || 0;


    const likeButton =
      document.createElement("button");

    likeButton.innerHTML =
      (liked ? "❤️ Unlike " : "🤍 Like ") +
      "<span>" +
      likeCount +
      "</span>";


    likeButton.onclick =
      function() {

        postData.liked =
          !postData.liked;

        if (postData.liked) {

          postData.likeCount =
            (Number(postData.likeCount) || 0) + 1;

        } else {

          postData.likeCount =
            Math.max(
              0,
              (Number(postData.likeCount) || 0) - 1
            );

        }

        savePosts(posts);
        loadPosts();

      };


    const commentButton =
      document.createElement("button");

    commentButton.textContent =
      "💬 Comment";


    commentButton.onclick =
      function() {

        const comment =
          prompt("💬 Write your comment:");

        if (
          !comment ||
          comment.trim() === ""
        ) {

          return;

        }


        if (!Array.isArray(postData.comments)) {

          postData.comments = [];

        }


        postData.comments.push(
          comment.trim()
        );


        savePosts(posts);
        loadPosts();

      };


    const shareButton =
      document.createElement("button");

    shareButton.textContent =
      "↗️ Share";


    shareButton.onclick =
      function() {

        sharePost(postData);

      };


    actions.appendChild(likeButton);
    actions.appendChild(commentButton);
    actions.appendChild(shareButton);


    /* =========================
       DELETE
    ========================= */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Delete Post";


    deleteButton.onclick =
      function() {

        const answer =
          confirm(
            "🗑️ Are you sure you want to delete this post?"
          );

        if (!answer) {

          return;

        }


        posts.splice(index, 1);

        savePosts(posts);

        loadPosts();

      };


    /* =========================
       COMMENTS
    ========================= */

    const commentsBox =
      document.createElement("div");

    commentsBox.className =
      "comments";


    if (
      Array.isArray(postData.comments) &&
      postData.comments.length > 0
    ) {

      const title =
        document.createElement("strong");

      title.textContent =
        "💬 Comments";

      commentsBox.appendChild(title);


      postData.comments.forEach(
        function(comment) {

          const commentItem =
            document.createElement("div");

          commentItem.className =
            "comment";


          commentItem.onclick =
            function() {

              window.location.href =
                "profile.html";

            };


          if (profileImage) {

            const image =
              document.createElement("img");

            image.src =
              profileImage;

            commentItem.appendChild(image);

          } else {

            const icon =
              document.createTextNode(
                "👤 "
              );

            commentItem.appendChild(icon);

          }


          const commentName =
            document.createElement("strong");

          commentName.textContent =
            username + " ";

          commentItem.appendChild(
            commentName
          );


          const commentText =
            document.createTextNode(
              comment
            );

          commentItem.appendChild(
            commentText
          );


          commentsBox.appendChild(
            commentItem
          );

        }
      );

    }


    /* =========================
       BUILD POST
    ========================= */

    post.appendChild(
      postHeader
    );

    if (mediaElement) {

      post.appendChild(
        mediaElement
      );

    }

    post.appendChild(
      content
    );

    post.appendChild(
      actions
    );

    post.appendChild(
      commentsBox
    );

    post.appendChild(
      deleteButton
    );


    postsBox.appendChild(
      post
    );

  });

}


/* =========================
   SHARE
========================= */

function sharePost(postData) {

  const text =
    postData.text ||
    "Check out my post on AI Social!";


  if (navigator.share) {

    navigator.share({

      title: "AI Social",

      text: text,

      url: window.location.href

    }).catch(function(error) {

      console.log(
        "Share cancelled:",
        error
      );

    });

  } else if (
    navigator.clipboard
  ) {

    navigator.clipboard.writeText(
      text + "\n\nShared from AI Social"
    ).then(function() {

      alert(
        "✅ Post copied! You can paste it anywhere."
      );

    }).catch(function() {

      alert(
        "⚠️ Sharing is not supported."
      );

    });

  } else {

    alert(
      "⚠️ Sharing is not supported."
    );

  }

}


/* =========================
   START
========================= */

loadPosts();


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./sw.js")
    .then(function() {

      console.log(
        "Service Worker registered"
      );

    })
    .catch(function(error) {

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>

</body>
</html>
