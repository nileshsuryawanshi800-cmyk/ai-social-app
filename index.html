<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Social</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  font-size: 22px;
}

.ai-button {
  background: #111;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 20px;
  cursor: pointer;
}

/* WELCOME */

.welcome {
  padding: 25px 18px;
}

.welcome h2 {
  margin-bottom: 8px;
}

/* POSTS */

#posts {
  width: 100%;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* POST HEADER */

.post-header {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-header-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.post-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  font-size: 25px;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-weight: bold;
  font-size: 16px;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  background: #000;
  display: block;
  cursor: pointer;
}

/* TEXT */

.post-content {
  padding: 0 15px 15px;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 17px;
  cursor: pointer;
}

/* ACTIONS */

.actions {
  display: flex;
  gap: 8px;
  padding: 12px 15px;
  border-top: 1px solid #eee;
  flex-wrap: wrap;
}

.actions button {
  border: none;
  background: #f5f5f5;
  padding: 9px 12px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

.actions button:active {
  transform: scale(0.95);
}

/* COMMENTS */

.comments {
  padding: 0 15px 10px;
}

.comment {
  margin-top: 8px;
  padding: 8px;
  background: #f5f5f5;
  border-radius: 10px;
}

.comment-name {
  font-weight: bold;
}

/* DELETE */

.delete-button {
  border: none;
  background: none;
  color: red;
  padding: 10px 15px 15px;
  cursor: pointer;
}

/* EMPTY */

.empty {
  text-align: center;
  padding: 30px;
  color: #777;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  cursor: pointer;
  padding: 5px;
}

/* POST VIEWER */

#postViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-box {
  max-width: 700px;
  margin: 30px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.viewer-close {
  position: fixed;
  top: 15px;
  right: 15px;
  background: white;
  border: none;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  font-size: 25px;
  cursor: pointer;
  z-index: 1001;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: #000;
}

.viewer-content {
  padding: 15px;
  font-size: 17px;
  white-space: pre-wrap;
}

</style>

</head>

<body>

<header>

<h1>✨ AI Social</h1>

<button
class="ai-button"
onclick="goAI()">
🤖 AI Chat
</button>

</header>


<section class="welcome">

<h2>
Welcome 👋
</h2>

<p>
Connect, share and chat with AI.
</p>

</section>


<div id="posts"></div>


<!-- POST VIEWER -->

<div id="postViewer">

<button
class="viewer-close"
onclick="closePost()">
✕
</button>

<div
class="viewer-box"
id="viewerBox">
</div>

</div>


<!-- NAVIGATION -->

<nav>

<button onclick="goHome()">
🏠<br>Home
</button>

<button onclick="goSearch()">
🔍<br>Search
</button>

<button onclick="goCreate()">
➕<br>Create
</button>

<button onclick="goAI()">
🤖<br>AI
</button>

<button onclick="goProfile()">
👤<br>Profile
</button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {

  window.location.href =
    "index.html";

}

function goSearch() {

  window.location.href =
    "search.html";

}

function goCreate() {

  window.location.href =
    "create.html";

}

function goAI() {

  window.location.href =
    "chat.html";

}

function goProfile() {

  window.location.href =
    "profile.html";

}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch(error) {

    return [];

  }

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
LOAD POSTS
========================= */

function loadPosts() {

  const postsBox =
    document.getElementById("posts");

  const posts =
    getPosts();

  postsBox.innerHTML = "";


  if (posts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Tap ➕ Create to make your first post! 📸' +
      '</div>';

    return;

  }


  posts.forEach(function(postData, index) {


    /* =========================
    POST CONTAINER
    ========================= */

    const post =
      document.createElement("div");

    post.className =
      "post";


    /* =========================
    POST HEADER
    ========================= */

    const header =
      document.createElement("div");

    header.className =
      "post-header";


    const profileLink =
      document.createElement("div");

    profileLink.className =
      "post-header-profile";


    /* PROFILE CLICK */

    profileLink.onclick =
      function(event) {

        event.stopPropagation();

        window.location.href =
          "profile.html";

      };


    /* AVATAR */

    const avatar =
      document.createElement("div");

    avatar.className =
      "post-avatar";


    if (postData.profileImage) {

      const img =
        document.createElement("img");

      img.src =
        postData.profileImage;

      img.alt =
        "Profile";

      avatar.appendChild(img);

    } else {

      avatar.textContent =
        "👤";

    }


    /* USERNAME */

    const username =
      document.createElement("div");

    username.className =
      "post-username";

    username.textContent =
      postData.username ||
      localStorage.getItem("username") ||
      "AI Social User";


    profileLink.appendChild(
      avatar
    );

    profileLink.appendChild(
      username
    );

    header.appendChild(
      profileLink
    );

    post.appendChild(
      header
    );


    /* =========================
    MEDIA
    ========================= */

    if (postData.media) {

      let media = null;


      if (
        postData.mediaType &&
        postData.mediaType
          .toLowerCase()
          .startsWith("image/")
      ) {

        media =
          document.createElement("img");

        media.src =
          postData.media;

      }


      else if (
        postData.mediaType &&
        postData.mediaType
          .toLowerCase()
          .startsWith("video/")
      ) {

        media =
          document.createElement("video");

        media.src =
          postData.media;

        media.controls =
          true;

        media.playsInline =
          true;

      }


      if (media) {

        media.className =
          "post-media";


        media.onclick =
          function(event) {

            event.stopPropagation();

            openPost(postData);

          };


        post.appendChild(
          media
        );

      }

    }


    /* =========================
    TEXT
    ========================= */

    if (postData.text) {

      const content =
        document.createElement("div");

      content.className =
        "post-content";

      content.textContent =
        postData.text;


      content.onclick =
        function(event) {

          event.stopPropagation();

          openPost(postData);

        };


      post.appendChild(
        content
      );

    }


    /* =========================
    ACTIONS
    ========================= */

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    /* LIKE */

    const likeButton =
      document.createElement("button");


    function updateLikeButton() {

      const liked =
        postData.liked === true;

      const count =
        Number(postData.likeCount) || 0;

      likeButton.textContent =
        (liked
          ? "❤️ Unlike "
          : "🤍 Like ") +
        count;

    }


    updateLikeButton();


    likeButton.onclick =
      function(event) {

        event.stopPropagation();


        postData.liked =
          !(
            postData.liked === true
          );


        if (postData.liked) {

          postData.likeCount =
            (Number(
              postData.likeCount
            ) || 0) + 1;

        } else {

          postData.likeCount =
            Math.max(
              0,
              (Number(
                postData.likeCount
              ) || 0) - 1
            );

        }


        savePosts(posts);

        updateLikeButton();

      };


    /* COMMENT */

    const commentButton =
      document.createElement("button");

    commentButton.textContent =
      "💬 Comment";


    commentButton.onclick =
      function(event) {

        event.stopPropagation();


        const comment =
          prompt(
            "💬 Write your comment:"
          );


        if (
          comment === null ||
          comment.trim() === ""
        ) {

          return;

        }


        if (
          !Array.isArray(
            postData.comments
          )
        ) {

          postData.comments =
            [];

        }


        postData.comments.push(
          comment.trim()
        );


        savePosts(posts);

        loadPosts();

      };


    /* SHARE */

    const shareButton =
      document.createElement("button");

    shareButton.textContent =
      "↗️ Share";


    shareButton.onclick =
      function(event) {

        event.stopPropagation();

        sharePost(postData);

      };


    actions.appendChild(
      likeButton
    );

    actions.appendChild(
      commentButton
    );

    actions.appendChild(
      shareButton
    );


    post.appendChild(
      actions
    );


    /* =========================
    COMMENTS
    ========================= */

    const commentsBox =
      document.createElement("div");

    commentsBox.className =
      "comments";


    if (
      Array.isArray(
        postData.comments
      ) &&
      postData.comments.length > 0
    ) {

      const title =
        document.createElement("strong");

      title.textContent =
        "💬 Comments";

      commentsBox.appendChild(
        title
      );


      postData.comments.forEach(
        function(comment) {

          const item =
            document.createElement("div");

          item.className =
            "comment";


          const name =
            document.createElement("span");

          name.className =
            "comment-name";

          name.textContent =
            (
              postData.username ||
              "You"
            ) + ": ";


          item.appendChild(
            name
          );

          item.appendChild(
            document.createTextNode(
              comment
            )
          );


          commentsBox.appendChild(
            item
          );

        }
      );

    }


    post.appendChild(
      commentsBox
    );


    /* =========================
    DELETE
    ========================= */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Delete Post";


    deleteButton.onclick =
      function(event) {

        event.stopPropagation();


        const answer =
          confirm(
            "🗑️ Are you sure you want to delete this post?"
          );


        if (!answer) {

          return;

        }


        posts.splice(
          index,
          1
        );


        savePosts(posts);

        loadPosts();

      };


    post.appendChild(
      deleteButton
    );


    postsBox.appendChild(
      post
    );

  });

}


/* =========================
OPEN POST
========================= */

function openPost(postData) {

  const viewer =
    document.getElementById(
      "postViewer"
    );

  const box =
    document.getElementById(
      "viewerBox"
    );


  box.innerHTML = "";


  /* USER */

  const user =
    document.createElement("div");

  user.style.padding =
    "15px";

  user.style.fontWeight =
    "bold";

  user.textContent =
    "👤 " +
    (
      postData.username ||
      "AI Social User"
    );


  box.appendChild(
    user
  );


  /* MEDIA */

  if (postData.media) {

    let media = null;


    if (
      postData.mediaType &&
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ) {

      media =
        document.createElement("img");

      media.src =
        postData.media;

    }


    else if (
      postData.mediaType &&
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ) {

      media =
        document.createElement("video");

      media.src =
        postData.media;

      media.controls =
        true;

      media.autoplay =
        true;

      media.playsInline =
        true;

    }


    if (media) {

      media.className =
        "viewer-media";

      box.appendChild(
        media
      );

    }

  }


  /* TEXT */

  if (postData.text) {

    const text =
      document.createElement("div");

    text.className =
      "viewer-content";

    text.textContent =
      postData.text;

    box.appendChild(
      text
    );

  }


  /* VIEWER INFO */

  const info =
    document.createElement("div");

  info.style.padding =
    "15px";

  info.textContent =
    "❤️ " +
    (Number(
      postData.likeCount
    ) || 0) +
    "    💬 " +
    (
      Array.isArray(
        postData.comments
      )
      ? postData.comments.length
      : 0
    );


  box.appendChild(
    info
  );


  viewer.style.display =
    "block";

}


function closePost() {

  document.getElementById(
    "postViewer"
  ).style.display =
    "none";

}


/* =========================
SHARE
========================= */

function sharePost(postData) {

  const shareText =
    (
      postData.username ||
      "AI Social User"
    ) +
    "\n\n" +
    (
      postData.text ||
      "Check out my post on AI Social!"
    );


  if (
    navigator.share
  ) {

    navigator.share({

      title:
        "AI Social",

      text:
        shareText,

      url:
        window.location.href

    })
    .catch(function(error) {

      console.log(error);

    });

    return;

  }


  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(
        shareText
      )
      .then(function() {

        alert(
          "✅ Post copied to clipboard!"
        );

      })
      .catch(function() {

        alert(
          "⚠️ Could not copy the post."
        );

      });

    return;

  }


  alert(
    "⚠️ Sharing is not supported on this device."
  );

}


/* =========================
START
========================= */

loadPosts();


/* =========================
SERVICE WORKER
========================= */

if (
  "serviceWorker" in navigator
) {

  navigator.serviceWorker
    .register("./sw.js")
    .then(function() {

      console.log(
        "Service Worker registered"
      );

    })
    .catch(function(error) {

      console.log(
        "Service Worker error:",
        error
      );

    });

}

</script>

</body>

</html>
