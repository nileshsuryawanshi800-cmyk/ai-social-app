<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account - AI Social</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
}

.container{
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}

h1{
  text-align:center;
  margin-top:25px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ddd;
  margin:10px auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:45px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.file-button{
  display:block;
  text-align:center;
  padding:12px;
  border:1px solid #ddd;
  border-radius:25px;
  cursor:pointer;
  margin-bottom:18px;
}

#photoInput{
  display:none;
}

input,
textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

textarea{
  height:90px;
  resize:none;
}

.create-button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.back-button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  font-size:15px;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>✨ Create New Account</h1>

<p class="subtitle">
Join AI Social
</p>

<div class="card">

<div class="avatar">

<img
id="photoPreview"
alt="Profile photo"
>

<span id="avatarIcon">👤</span>

</div>


<label
class="file-button"
for="photoInput"
>
📸 Choose Profile Photo
</label>


<input
id="photoInput"
type="file"
accept="image/*"
onchange="selectPhoto(event)"
>


<input
id="name"
type="text"
placeholder="Your name"
autocomplete="name"
>


<input
id="username"
type="text"
placeholder="Choose a username"
autocomplete="username"
>


<textarea
id="bio"
placeholder="Write your bio..."
></textarea>


<button
class="create-button"
onclick="createAccount()"
>
🚀 Create Account
</button>


<button
class="back-button"
onclick="goProfile()"
>
← Back to Profile
</button>


<p
id="message"
class="message"
></p>

</div>

</div>


<script>

let profilePhoto = "";


/* =========================
SELECT PHOTO
========================= */

function selectPhoto(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    event.target.value="";

    return;
  }


  /*
    Keep profile photos reasonably small
    because this version uses localStorage.
  */

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Please choose a profile photo under 5 MB."
    );

    event.target.value="";

    return;
  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    profilePhoto =
      e.target.result;


    const preview =
      document.getElementById(
        "photoPreview"
      );


    const icon =
      document.getElementById(
        "avatarIcon"
      );


    preview.src =
      profilePhoto;

    preview.style.display =
      "block";

    icon.style.display =
      "none";

  };


  reader.readAsDataURL(file);

}


/* =========================
GET ACCOUNTS
========================= */

function getAccounts(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("accounts") || "[]"
      );


    if(Array.isArray(saved)){
      return saved;
    }

  }catch(error){

    console.log(
      "Could not read accounts:",
      error
    );

  }


  return [];

}


/* =========================
SAVE ACCOUNTS
========================= */

function saveAccounts(accounts){

  localStorage.setItem(
    "accounts",
    JSON.stringify(accounts)
  );

}


/* =========================
CREATE ACCOUNT
========================= */

function createAccount(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  let username =
    document
      .getElementById("username")
      .value
      .trim();


  const bio =
    document
      .getElementById("bio")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter your name."
    );

    return;

  }


  if(!username){

    alert(
      "Please choose a username."
    );

    return;

  }


  /*
    Remove @ if the user typed it.
  */

  username =
    username.replace(/^@+/,"");


  /*
    Allow letters, numbers,
    underscore and dot.
  */

  if(!/^[a-zA-Z0-9._]+$/.test(username)){

    alert(
      "Username can contain only letters, numbers, dots and underscores."
    );

    return;

  }


  if(username.length < 3){

    alert(
      "Username must be at least 3 characters."
    );

    return;

  }


  if(username.length > 30){

    alert(
      "Username must be 30 characters or less."
    );

    return;

  }


  const accounts =
    getAccounts();


  /*
    Check duplicate username.
  */

  const exists =
    accounts.some(
      function(account){

        return String(
          account.username || ""
        ).toLowerCase()
        === username.toLowerCase();

      }
    );


  if(exists){

    alert(
      "This username already exists."
    );

    return;

  }


  /*
    Create a unique account ID.
  */

  const accountId =
    Date.now().toString()
    + "-"
    + Math.random()
      .toString(36)
      .substring(2,8);


  const account = {

    id: accountId,

    name: name,

    username: username,

    bio:
      bio ||
      "Welcome to my AI Social profile 🚀",

    profileImage:
      profilePhoto || "",

    posts: [],

    createdAt:
      Date.now()

  };


  /*
    Add account to accounts list.
  */

  accounts.push(account);


  saveAccounts(accounts);


  /*
    Make this the active account.
  */

  localStorage.setItem(
    "activeAccountId",
    accountId
  );


  /*
    Also keep these values temporarily
    for compatibility with your old files.
  */

  localStorage.setItem(
    "username",
    username
  );


  localStorage.setItem(
    "bio",
    account.bio
  );


  localStorage.setItem(
    "profileImage",
    account.profileImage
  );


  localStorage.setItem(
    "posts",
    JSON.stringify(account.posts)
  );


  document.getElementById(
    "message"
  ).textContent =
    "✅ Account created successfully!";


  /*
    Go to profile.
  */

  setTimeout(
    function(){

      window.location.href =
        "profile.html";

    },
    700
  );

}


/* =========================
GO PROFILE
========================= */

function goProfile(){

  window.location.href =
    "profile.html";

}

</script>

</body>

</html>
