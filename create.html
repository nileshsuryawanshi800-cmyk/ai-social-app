<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create - AI Social</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
}

header {
  background: white;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header button {
  border: none;
  background: none;
  font-size: 26px;
}

header h1 {
  font-size: 20px;
}

.container {
  padding: 18px;
}

textarea {
  width: 100%;
  height: 110px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 15px;
  font-size: 16px;
  resize: none;
  background: white;
}

.file-label {
  display: block;
  margin-top: 15px;
  padding: 16px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
}

#mediaInput {
  display: none;
}

.preview-box {
  margin-top: 15px;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
  min-height: 10px;
}

#preview {
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  display: none;
}

#videoPreview {
  width: 100%;
  max-height: 500px;
  display: none;
}

.edit-tools,
.filters,
.crop-tools {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.edit-tools button,
.filters button,
.crop-tools button {
  border: 1px solid #ddd;
  background: white;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.post-button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.change-button {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
  background: white;
  font-size: 15px;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <button onclick="goHome()">←</button>
  <h1>➕ Create Post</h1>
</header>

<div class="container">

<textarea
  id="postText"
  placeholder="Write a caption..."
></textarea>

<label
  class="file-label"
  for="mediaInput"
>
📸 Select Photo or 🎥 Reel
</label>

<input
  id="mediaInput"
  type="file"
  accept="image/*,video/*"
  onchange="selectMedia(event)"
>

<div class="preview-box">

  <img id="preview">

  <video
    id="videoPreview"
    controls
    playsinline
  ></video>

</div>

<!-- PHOTO EDITING -->

<div
  class="edit-tools"
  id="editTools"
>

  <button onclick="rotatePhoto()">
    🔄 Rotate
  </button>

  <button onclick="zoomIn()">
    🔍 Zoom +
  </button>

  <button onclick="zoomOut()">
    🔎 Zoom -
  </button>

  <button onclick="startCrop()">
    ✂️ Crop
  </button>

  <button onclick="resetPhoto()">
    ↩️ Reset
  </button>

</div>

<!-- CROP -->

<div
  class="crop-tools"
  id="cropTools"
>

  <button onclick="cropImage(1)">
    🔲 Square
  </button>

  <button onclick="cropImage(4/5)">
    📱 Portrait
  </button>

  <button onclick="cropImage(16/9)">
    🖼️ Landscape
  </button>

  <button onclick="cancelCrop()">
    ❌ Cancel
  </button>

</div>

<!-- FILTERS -->

<div
  class="filters"
  id="filters"
>

  <button onclick="setFilter('none')">
    Normal
  </button>

  <button onclick="setFilter('grayscale(1)')">
    ⚫ B&W
  </button>

  <button onclick="setFilter('sepia(1)')">
    🟤 Sepia
  </button>

  <button onclick="setFilter('brightness(1.3)')">
    ☀️ Bright
  </button>

  <button onclick="setFilter('contrast(1.4)')">
    ✨ Contrast
  </button>

</div>

<button
  class="change-button"
  id="changeButton"
  onclick="changeMedia()"
>
🔄 Change Photo / Video
</button>

<button
  class="post-button"
  onclick="publishPost()"
>
📤 Publish
</button>

<p
  id="message"
  class="message"
></p>

</div>

   HOME
========================= */

function goHome() {
  window.location.href = "index.html";
}
