<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create - AI Social</title><style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 30px;
}

header {
  background: white;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header button {
  border: none;
  background: none;
  font-size: 28px;
  cursor: pointer;
}

header h1 {
  font-size: 20px;
  margin: 0;
}

.container {
  padding: 18px;
}

textarea {
  width: 100%;
  height: 110px;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 15px;
  font-size: 16px;
  resize: none;
  background: white;
}

/* SELECT BUTTONS */

.select-button {
  display: block;
  width: 100%;
  margin-top: 15px;
  padding: 17px;
  border: 2px solid #111;
  border-radius: 15px;
  background: white;
  color: #111;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.select-button:active {
  transform: scale(0.98);
}

input[type="file"] {
  display: none;
}

/* MEDIA PREVIEW */

.preview-box {
  width: 100%;
  margin-top: 15px;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  min-height: 0;
}

#photoPreview,
#videoPreview {
  width: 100%;
  max-height: 550px;
  object-fit: contain;
  display: none;
}

#photoPreview {
  transform-origin: center center;
}

/* SOUND */

.sound-box {
  display: none;
  margin-top: 15px;
  background: white;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid #ddd;
}

.sound-title {
  font-weight: bold;
  margin-bottom: 10px;
}

#soundPreview {
  width: 100%;
}

.remove-sound {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: white;
  color: red;
  font-weight: bold;
}

/* EDIT BUTTONS */

.tools {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.tools button {
  border: 1px solid #ccc;
  background: white;
  padding: 10px 13px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

/* PUBLISH */

.publish-button {
  width: 100%;
  margin-top: 20px;
  padding: 17px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

canvas {
  display: none;
}
</style></head><body><header><button type="button" onclick="goHome()">←</button>

<h1>➕ Create Post</h1></header><div class="container"><textarea
  id="postText"
  placeholder="Write a caption..."
></textarea><!-- PHOTO / REEL BUTTON --><button
type="button"
class="select-button"
onclick="openMediaPicker()"

«»

📸 SELECT PHOTO / 🎥 REEL
</button>

<input
  id="mediaInput"
  type="file"
  accept="image/*,video/*"
  style="display:block;width:100%;padding:15px;margin-top:15px;font-size:16px;"
>

«»

<!-- SOUND BUTTON --><button
type="button"
class="select-button"
onclick="openSoundPicker()"

«»

🎵 ADD SOUND / MUSIC
</button>

<input
id="soundInput"
type="file"
accept="audio/*"

«»

<!-- MEDIA PREVIEW --><div class="preview-box"><img
id="photoPreview"
alt="Edited photo preview"

«»

<video
id="videoPreview"
controls
playsinline

«</video>»

</div><!-- PHOTO EDIT TOOLS --><div
  class="tools"
  id="photoTools"
><button type="button" onclick="rotatePhoto()">
🔄 Rotate
</button><button type="button" onclick="zoomIn()">
🔍 Zoom +
</button><button type="button" onclick="zoomOut()">
🔎 Zoom -
</button><button type="button" onclick="normalPhoto()">
Normal
</button><button type="button" onclick="blackWhite()">
⚫ B&W
</button><button type="button" onclick="sepiaPhoto()">
🟤 Sepia
</button><button type="button" onclick="brightPhoto()">
☀️ Bright
</button><button type="button" onclick="resetPhoto()">
↩️ Reset
</button></div><!-- SOUND PREVIEW --><div
  class="sound-box"
  id="soundBox"
><div class="sound-title">
🎵 Selected Sound
</div><audio
id="soundPreview"
controls

«</audio>»

<button
type="button"
class="remove-sound"
onclick="removeSound()"

«»

❌ Remove Sound
</button>

</div><!-- PUBLISH --><button
type="button"
class="publish-button"
onclick="publishPost()"

«»

📤 PUBLISH POST
</button>

<p
  id="message"
  class="message"
></p><canvas id="editCanvas"></canvas>

</div><script>

let selectedMedia = null;
let selectedSound = null;

let originalImage = null;

let rotation = 0;
let zoom = 1;
let filter = "none";


/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}


/* =========================
OPEN PHOTO PICKER
========================= */

function openMediaPicker() {

  const input =
    document.getElementById("mediaInput");

  input.value = "";

  input.click();
}


/* =========================
OPEN SOUND PICKER
========================= */

function openSoundPicker() {

  const input =
    document.getElementById("soundInput");

  input.value = "";

  input.click();
}


/* =========================
MEDIA SELECTED
========================= */

document
  .getElementById("mediaInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      selectedMedia = file;

      rotation = 0;
      zoom = 1;
      filter = "none";

      const photo =
        document.getElementById(
          "photoPreview"
        );

      const video =
        document.getElementById(
          "videoPreview"
        );

      const tools =
        document.getElementById(
          "photoTools"
        );

      const message =
        document.getElementById(
          "message"
        );

      photo.style.display = "none";
      video.style.display = "none";
      tools.style.display = "none";

      /* PHOTO */

      if (
        file.type.startsWith("image/")
      ) {

        const url =
          URL.createObjectURL(file);

        originalImage =
          new Image();

        originalImage.onload =
          function() {

            photo.src = url;

            photo.style.display =
              "block";

            tools.style.display =
              "flex";

            applyPreview();

          };

        originalImage.src = url;

        message.textContent =
          "✅ Photo selected. Edit it before publishing.";

        return;
      }


      /* VIDEO */

      if (
        file.type.startsWith("video/")
      ) {

        video.src =
          URL.createObjectURL(file);

        video.style.display =
          "block";

        video.onloadedmetadata =
          function() {

            if (
              video.duration > 60
            ) {

              alert(
                "⚠️ Reel must be 1 minute or less."
              );

              selectedMedia = null;

              video.src = "";

              video.style.display =
                "none";

              return;
            }

            message.textContent =
              "✅ Reel selected. Ready to publish.";

          };

        return;
      }

      alert(
        "⚠️ Please select a photo or video."
      );

    }
  );


/* =========================
SOUND SELECTED
========================= */

document
  .getElementById("soundInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      if (
        !file.type.startsWith("audio/")
      ) {

        alert(
          "⚠️ Please select an audio file."
        );

        return;
      }

      if (
        file.size > 10 * 1024 * 1024
      ) {

        alert(
          "⚠️ Sound must be under 10 MB."
        );

        return;
      }

      selectedSound = file;

      const soundBox =
        document.getElementById(
          "soundBox"
        );

      const soundPreview =
        document.getElementById(
          "soundPreview"
        );

      soundPreview.src =
        URL.createObjectURL(file);

      soundBox.style.display =
        "block";

      document.getElementById(
        "message"
      ).textContent =
        "🎵 Sound selected. Press ▶️ to preview.";

    }
  );


/* =========================
PHOTO PREVIEW
========================= */

function applyPreview() {

  const photo =
    document.getElementById(
      "photoPreview"
    );

  photo.style.transform =
    "rotate(" +
    rotation +
    "deg) scale(" +
    zoom +
    ")";

  photo.style.filter =
    filter;
}


/* =========================
ROTATE
========================= */

function rotatePhoto() {

  rotation += 90;

  if (rotation >= 360) {
    rotation = 0;
  }

  applyPreview();
}


/* =========================
ZOOM
========================= */

function zoomIn() {

  zoom += 0.1;

  if (zoom > 2) {
    zoom = 2;
  }

  applyPreview();
}


function zoomOut() {

  zoom -= 0.1;

  if (zoom < 0.5) {
    zoom = 0.5;
  }

  applyPreview();
}


/* =========================
FILTERS
========================= */

function normalPhoto() {

  filter = "none";

  applyPreview();
}


function blackWhite() {

  filter = "grayscale(1)";

  applyPreview();
}


function sepiaPhoto() {

  filter = "sepia(1)";

  applyPreview();
}


function brightPhoto() {

  filter = "brightness(1.3)";

  applyPreview();
}


/* =========================
RESET
========================= */

function resetPhoto() {

  rotation = 0;
  zoom = 1;
  filter = "none";

  applyPreview();
}


/* =========================
REMOVE SOUND
========================= */

function removeSound() {

  selectedSound = null;

  const sound =
    document.getElementById(
      "soundPreview"
    );

  sound.pause();

  sound.src = "";

  document.getElementById(
    "soundBox"
  ).style.display =
    "none";

  document.getElementById(
    "soundInput"
  ).value = "";

}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "posts"
      ) || "[]"
    );

  } catch(error) {

    return [];

  }
}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
FILE TO DATA URL
========================= */

function fileToDataURL(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          resolve(
            event.target.result
          );

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );
}


/* =========================
CREATE EDITED PHOTO
========================= */

function createEditedPhoto() {

  return new Promise(
    function(resolve) {

      if (!originalImage) {

        resolve(null);

        return;

      }

      const canvas =
        document.getElementById(
          "editCanvas"
        );

      const ctx =
        canvas.getContext("2d");

      const width =
        originalImage.width;

      const height =
        originalImage.height;

      const angle =
        rotation *
        Math.PI /
        180;

      const sin =
        Math.abs(
          Math.sin(angle)
        );

      const cos =
        Math.abs(
          Math.cos(angle)
        );

      const newWidth =
        width * cos +
        height * sin;

      const newHeight =
        width * sin +
        height * cos;

      canvas.width =
        newWidth;

      canvas.height =
        newHeight;

      ctx.save();

      ctx.translate(
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.rotate(angle);

      ctx.filter =
        filter;

      ctx.drawImage(
        originalImage,
        -width / 2,
        -height / 2,
        width,
        height
      );

      ctx.restore();

      canvas.toBlob(
        function(blob) {

          resolve(blob);

        },
        "image/jpeg",
        0.90
      );

    }
  );
}


/* =========================
PUBLISH
========================= */

async function publishPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const message =
    document.getElementById(
      "message"
    );

  if (
    text === "" &&
    !selectedMedia
  ) {

    message.textContent =
      "⚠️ Write a caption or select a photo/video.";

    return;
  }

  message.textContent =
    "⏳ Publishing...";

  const posts =
    getPosts();

  const username =
    localStorage.getItem(
      "username"
    ) || "You";

  const profileImage =
    localStorage.getItem(
      "profileImage"
    ) || null;


  /* SAVE SOUND */

  let soundData = null;

  if (selectedSound) {

    try {

      soundData =
        await fileToDataURL(
          selectedSound
        );

    } catch(error) {

      message.textContent =
        "⚠️ Could not save sound.";

      return;
    }
  }


  /* TEXT ONLY */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: null,

      mediaType: null,

      sound: soundData,

      soundType:
        selectedSound
          ? selectedSound.type
          : null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });

    savePosts(posts);

    publishDone();

    return;
  }


  /* VIDEO */

  if (
    selectedMedia.type.startsWith(
      "video/"
    )
  ) {

    if (
      selectedMedia.size >
      20 * 1024 * 1024
    ) {

      message.textContent =
        "⚠️ Reel must be under 20 MB.";

      return;
    }

    try {

      const videoData =
        await fileToDataURL(
          selectedMedia
        );

      posts.unshift({

        id: Date.now(),

        username: username,

        profileImage: profileImage,

        text: text,

        media: videoData,

        mediaType:
          selectedMedia.type,

        sound: soundData,

        soundType:
          selectedSound
            ? selectedSound.type
            : null,

        liked: false,

        likeCount: 0,

        comments: [],

        createdAt: Date.now()

      });

      savePosts(posts);

      publishDone();

    } catch(error) {

      message.textContent =
        "⚠️ Could not save the Reel.";
    }

    return;
  }


  /* PHOTO */

  const editedPhoto =
    await createEditedPhoto();

  if (!editedPhoto) {

    message.textContent =
      "⚠️ Could not create edited photo.";

    return;
  }

  try {

    const photoData =
      await fileToDataURL(
        editedPhoto
      );

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: photoData,

      mediaType: "image/jpeg",

      sound: soundData,

      soundType:
        selectedSound
          ? selectedSound.type
          : null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });

    savePosts(posts);

    publishDone();

  } catch(error) {

    message.textContent =
      "⚠️ Photo or sound is too large.";

  }
}


/* =========================
DONE
========================= */

function publishDone() {

  document.getElementById(
    "message"
  ).textContent =
    "✅ Post published successfully!";

  setTimeout(
    function() {

      window.location.href =
        "index.html";

    },
    700
  );
}

</script></body>
  </html>
