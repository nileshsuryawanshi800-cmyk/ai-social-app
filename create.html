<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create - AI Social</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
}

header {
  background: white;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header button {
  border: none;
  background: none;
  font-size: 26px;
}

header h1 {
  font-size: 20px;
}

.container {
  padding: 18px;
}

textarea {
  width: 100%;
  height: 110px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 15px;
  font-size: 16px;
  resize: none;
  background: white;
}

/* SELECT */

.file-label {
  display: block;
  margin-top: 15px;
  padding: 16px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
}

#mediaInput {
  display: none;
}

/* PREVIEW BOX */

.preview-box {
  margin-top: 15px;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
}

#preview {
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  display: none;
}

#videoPreview {
  width: 100%;
  max-height: 500px;
  display: none;
}

/* EDIT BUTTONS */

.edit-tools {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.edit-tools button {
  border: none;
  background: white;
  padding: 10px 14px;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid #ddd;
}

/* FILTERS */

.filters {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.filters button {
  border: none;
  padding: 9px 13px;
  border-radius: 18px;
  cursor: pointer;
}

/* PUBLISH */

.post-button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.change-button {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: none;
  border-radius: 25px;
  background: white;
  border: 1px solid #ddd;
  font-size: 15px;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

</style>
</head>

<body>

<header>

<button onclick="goHome()">←</button>

<h1>➕ Create Post</h1>

</header>


<div class="container">

<textarea
id="postText"
placeholder="Write a caption..."
></textarea>


<label
class="file-label"
for="mediaInput"
id="selectLabel"
>
📸 Select Photo or 🎥 Reel
</label>


<input
id="mediaInput"
type="file"
accept="image/*,video/*"
onchange="selectMedia(event)"
>


<!-- PREVIEW -->

<div class="preview-box">

<img
id="preview"
alt="Photo preview"
>

<video
id="videoPreview"
controls
playsinline
></video>

</div>


<!-- EDIT TOOLS -->

<div
class="edit-tools"
id="editTools"
>

<button onclick="rotatePhoto()">
🔄 Rotate
</button>
  
  <button onclick="startCrop()">
✂️ Crop
</button>

<button onclick="zoomIn()">
🔍 Zoom +
</button>

<button onclick="zoomOut()">
🔎 Zoom -
</button>

<button onclick="resetPhoto()">
↩️ Reset
</button>

</div>


<!-- FILTERS -->
<div
id="cropTools"
style="display:none;margin-top:12px;gap:8px;flex-wrap:wrap;"
>

<button onclick="cropSquare()">
🔲 Square
</button>

<button onclick="cropPortrait()">
📱 Portrait
</button>

<button onclick="cropLandscape()">
🖼️ Landscape
</button>

<button onclick="cancelCrop()">
❌ Cancel
</button>

</div>
  
<div
class="filters"
id="filters"
>

<button onclick="filterPhoto('none')">
Normal
</button>

<button onclick="filterPhoto('grayscale(1)')">
⚫ B&W
</button>

<button onclick="filterPhoto('sepia(1)')">
🟤 Sepia
</button>

<button onclick="filterPhoto('brightness(1.3)')">
☀️ Bright
</button>

<button onclick="filterPhoto('contrast(1.4)')">
✨ Contrast
</button>

</div>


<button
class="change-button"
id="changeButton"
onclick="changeMedia()"
>
🔄 Change Photo / Video
</button>


<button
class="post-button"
onclick="publishPost()"
>
📤 Publish
</button>


<p
id="message"
class="message"
></p>

</div>


<script>

/* =========================
   HOME
========================= */

function goHome() {

  window.location.href =
    "index.html";

}


/* =========================
   VARIABLES
========================= */

let selectedMedia = null;

let rotation = 0;

let zoom = 1;

let currentFilter = "none";


/* =========================
   SELECT MEDIA
========================= */

function selectMedia(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  selectedMedia = file;


  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const tools =
    document.getElementById("editTools");

  const filters =
    document.getElementById("filters");

  const change =
    document.getElementById("changeButton");

  const message =
    document.getElementById("message");


  image.style.display = "none";

  video.style.display = "none";

  tools.style.display = "none";

  filters.style.display = "none";

  message.textContent = "";


  rotation = 0;

  zoom = 1;

  currentFilter = "none";


  /* PHOTO */

  if (
    file.type.startsWith("image/")
  ) {

    image.src =
      URL.createObjectURL(file);

    image.style.display =
      "block";

    tools.style.display =
      "flex";

    filters.style.display =
      "flex";

    change.style.display =
      "block";

    applyPhotoStyle();

    message.textContent =
      "✅ Photo ready. Edit it before publishing.";

    return;
  }


  /* VIDEO */

  if (
    file.type.startsWith("video/")
  ) {

    video.src =
      URL.createObjectURL(file);

    video.style.display =
      "block";

    change.style.display =
      "block";


    video.onloadedmetadata =
      function() {

        if (video.duration > 60) {

          alert(
            "⚠️ Reel must be 1 minute or less."
          );

          selectedMedia = null;

          video.src = "";

          video.style.display =
            "none";

          change.style.display =
            "none";

          document.getElementById(
            "mediaInput"
          ).value = "";

          return;
        }


        message.textContent =
          "✅ Reel ready. Preview it before publishing.";

      };

    return;
  }


  selectedMedia = null;

}


/* =========================
   PHOTO ROTATE
========================= */

function rotatePhoto() {

  rotation += 90;

  if (rotation >= 360) {
    rotation = 0;
  }

  applyPhotoStyle();

}


/* =========================
   ZOOM IN
========================= */

function zoomIn() {

  zoom += 0.1;

  if (zoom > 2) {
    zoom = 2;
  }

  applyPhotoStyle();

}


/* =========================
   ZOOM OUT
========================= */

function zoomOut() {

  zoom -= 0.1;

  if (zoom < 0.5) {
    zoom = 0.5;
  }

  applyPhotoStyle();

}

/* =========================
   CROP
========================= */

function startCrop() {

  if (!selectedMedia) {
    return;
  }

  if (!selectedMedia.type.startsWith("image/")) {

    alert("✂️ Crop is available for photos.");

    return;
  }

  document.getElementById(
    "cropTools"
  ).style.display = "flex";

}


/* =========================
   CROP SQUARE
========================= */

function cropSquare() {

  cropImage(1);

}


/* =========================
   CROP PORTRAIT
========================= */

function cropPortrait() {

  cropImage(4 / 5);

}


/* =========================
   CROP LANDSCAPE
========================= */

function cropLandscape() {

  cropImage(16 / 9);

}


/* =========================
   CROP IMAGE
========================= */

function cropImage(ratio) {

  const image =
    document.getElementById("preview");

  if (!image.src) {
    return;
  }


  const canvas =
    document.createElement("canvas");

  const ctx =
    canvas.getContext("2d");


  const img =
    new Image();


  img.onload = function() {

    let sourceWidth =
      img.width;

    let sourceHeight =
      img.height;


    const sourceRatio =
      sourceWidth / sourceHeight;


    let cropWidth;
    let cropHeight;


    if (sourceRatio > ratio) {

      cropHeight =
        sourceHeight;

      cropWidth =
        sourceHeight * ratio;

    } else {

      cropWidth =
        sourceWidth;

      cropHeight =
        sourceWidth / ratio;

    }


    const sourceX =
      (sourceWidth - cropWidth) / 2;

    const sourceY =
      (sourceHeight - cropHeight) / 2;


    canvas.width =
      cropWidth;

    canvas.height =
      cropHeight;


    ctx.drawImage(

      img,

      sourceX,
      sourceY,

      cropWidth,
      cropHeight,

      0,
      0,
      cropWidth,
      cropHeight

    );


    image.src =
      canvas.toDataURL(
        "image/jpeg",
        0.92
      );


    image.style.display =
      "block";


    /* Replace selected photo */

    canvas.toBlob(
      function(blob) {

        if (!blob) {
          return;
        }


        selectedMedia =
          new File(
            [blob],
            "edited-photo.jpg",
            {
              type:
                "image/jpeg"
            }
          );

      },
      "image/jpeg",
      0.92
    );


    document.getElementById(
      "cropTools"
    ).style.display = "none";


    document.getElementById(
      "message"
    ).textContent =
      "✅ Photo cropped. You can continue editing.";

  };


  img.src =
    image.src;

}


/* =========================
   CANCEL CROP
========================= */

function cancelCrop() {

  document.getElementById(
    "cropTools"
  ).style.display = "none";

  }
  
/* =========================
   FILTER
========================= */

function filterPhoto(filter) {

  currentFilter =
    filter;

  applyPhotoStyle();

}


/* =========================
   APPLY PHOTO STYLE
========================= */

function applyPhotoStyle() {

  const image =
    document.getElementById("preview");

  image.style.transform =
    "rotate(" +
    rotation +
    "deg) scale(" +
    zoom +
    ")";

  image.style.filter =
    currentFilter;

}


/* =========================
   RESET
========================= */

function resetPhoto() {

  rotation = 0;

  zoom = 1;

  currentFilter =
    "none";

  applyPhotoStyle();

}


/* =========================
   CHANGE MEDIA
========================= */

function changeMedia() {

  document.getElementById(
    "mediaInput"
  ).click();

}


/* =========================
   GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") ||
      "[]"
    );

  } catch (error) {

    return [];

  }

}


/* =========================
   PUBLISH
========================= */

function publishPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();


  const message =
    document.getElementById(
      "message"
    );


  if (
    text === "" &&
    !selectedMedia
  ) {

    message.textContent =
      "⚠️ Write a caption or select media.";

    return;

  }


  /* VIDEO LIMIT */

  if (
    selectedMedia &&
    selectedMedia.type.startsWith(
      "video/"
    )
  ) {

    const video =
      document.getElementById(
        "videoPreview"
      );


    if (
      video.duration &&
      video.duration > 60
    ) {

      message.textContent =
        "⚠️ Reel must be 1 minute or less.";

      return;

    }

  }


  message.textContent =
    "⏳ Publishing...";


  const posts =
    getPosts();


  const username =
    localStorage.getItem(
      "username"
    ) || "You";


  const profileImage =
    localStorage.getItem(
      "profileImage"
    ) || null;


  /* TEXT ONLY */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage:
        profileImage,

      text: text,

      media: null,

      mediaType: null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt:
        Date.now()

    });


    savePosts(posts);

    finish();

    return;

  }


  /* READ MEDIA */

  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      const mediaData =
        event.target.result;


      posts.unshift({

        id: Date.now(),

        username: username,

        profileImage:
          profileImage,

        text: text,

        media:
          mediaData,

        mediaType:
          selectedMedia.type,

        liked: false,

        likeCount: 0,

        comments: [],

        createdAt:
          Date.now()

      });


      try {

        savePosts(posts);

        finish();

      } catch (error) {

        message.textContent =
          "⚠️ File is too large for browser storage. We will move large Reels to IndexedDB next.";

      }

    };


  reader.onerror =
    function() {

      message.textContent =
        "⚠️ Could not read the file.";

    };


  reader.readAsDataURL(
    selectedMedia
  );

}


/* =========================
   SAVE
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
   FINISH
========================= */

function finish() {

  document.getElementById(
    "message"
  ).textContent =
    "✅ Published successfully!";


  setTimeout(
    function() {

      window.location.href =
        "index.html";

    },
    700
  );

}

</script>

</body>
  </html>
