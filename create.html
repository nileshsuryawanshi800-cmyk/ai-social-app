<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create - AI Social</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:30px;
}

header{
  background:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #ddd;
}

header button{
  border:none;
  background:none;
  font-size:28px;
}

header h1{
  font-size:20px;
  margin:0;
}

.container{
  padding:18px;
}

textarea{
  width:100%;
  height:110px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:16px;
  resize:none;
  background:white;
}

/* FILE BUTTON */

.file-label{
  display:block;
  margin-top:15px;
  padding:16px;
  background:white;
  border:1px solid #ddd;
  border-radius:15px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

input[type="file"]{
  display:none;
}

/* PREVIEW */

.preview-box{
  margin-top:15px;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  min-height:20px;
  text-align:center;
}

#preview{
  width:100%;
  max-height:550px;
  object-fit:contain;
  display:none;
}

#videoPreview{
  width:100%;
  max-height:550px;
  display:none;
}

/* SOUND */

.sound-box{
  display:none;
  margin-top:15px;
  padding:15px;
  background:white;
  border-radius:15px;
}

.sound-title{
  font-weight:bold;
  margin-bottom:10px;
}

#soundPreview{
  width:100%;
}

.remove-sound{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:20px;
  background:white;
  color:red;
}

/* TOOLS */

.tools{
  display:none;
  margin-top:12px;
  gap:8px;
  flex-wrap:wrap;
}

.tools button{
  border:1px solid #ddd;
  background:white;
  padding:10px 13px;
  border-radius:20px;
  font-weight:bold;
}

/* CROP */

.crop-tools{
  display:none;
  margin-top:12px;
  gap:8px;
  flex-wrap:wrap;
}

.crop-tools button{
  border:1px solid #ddd;
  background:white;
  padding:10px 13px;
  border-radius:20px;
}

/* PUBLISH */

.change-button{
  display:none;
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  font-weight:bold;
}

.publish-button{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

#canvas{
  display:none;
}
</style>
</head>

<body>

<header>

<button onclick="goHome()">←</button>

<h1>➕ Create Post</h1>

</header>

<div class="container">

<textarea
id="postText"
placeholder="Write a caption..."
></textarea>


<!-- PHOTO / VIDEO -->

<label
class="file-label"
for="mediaInput"
>
📸 Select Photo / 🎥 Reel
</label>

<input
id="mediaInput"
type="file"
accept="image/*,video/*"
>


<!-- SOUND -->

<label
class="file-label"
for="soundInput"
>
🎵 Add Sound / Music
</label>

<input
id="soundInput"
type="file"
accept="audio/*"
>


<!-- SOUND PREVIEW -->

<div
class="sound-box"
id="soundBox"
>

<div class="sound-title">
🎵 Sound Preview
</div>

<audio
id="soundPreview"
controls
></audio>

<button
class="remove-sound"
onclick="removeSound()"
>
❌ Remove Sound
</button>

</div>


<!-- MEDIA PREVIEW -->

<div class="preview-box">

<img
id="preview"
alt="Photo preview"
>

<video
id="videoPreview"
controls
playsinline
></video>

</div>


<!-- EDIT TOOLS -->

<div
class="tools"
id="editTools"
>

<button onclick="rotatePhoto()">
🔄 Rotate
</button>

<button onclick="zoomIn()">
🔍 Zoom +
</button>

<button onclick="zoomOut()">
🔎 Zoom -
</button>

<button onclick="resetPhoto()">
↩️ Reset
</button>

</div>


<!-- FILTERS -->

<div
class="tools"
id="filters"
>

<button onclick="setFilter('none')">
Normal
</button>

<button onclick="setFilter('grayscale(1)')">
⚫ B&W
</button>

<button onclick="setFilter('sepia(1)')">
🟤 Sepia
</button>

<button onclick="setFilter('brightness(1.3)')">
☀️ Bright
</button>

<button onclick="setFilter('contrast(1.4)')">
✨ Contrast
</button>

</div>


<!-- CROP -->

<div
class="crop-tools"
id="cropTools"
>

<button onclick="cropPhoto(1)">
🔲 Square
</button>

<button onclick="cropPhoto(0.8)">
📱 Portrait
</button>

<button onclick="cropPhoto(16/9)">
🖼️ Landscape
</button>

</div>


<button
class="change-button"
id="changeButton"
onclick="changeMedia()"
>
🔄 Change Photo / Video
</button>


<button
class="publish-button"
onclick="publishPost()"
>
📤 Publish
</button>


<div
class="message"
id="message"
></div>


<canvas id="canvas"></canvas>

</div>


<script>

/* =========================
VARIABLES
========================= */

let selectedMedia = null;
let selectedSound = null;
let originalImage = null;

let rotation = 0;
let zoom = 1;
let currentFilter = "none";


/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}


/* =========================
MEDIA SELECT
========================= */

document
.getElementById("mediaInput")
.addEventListener("change",function(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  selectedMedia=file;

  rotation=0;
  zoom=1;
  currentFilter="none";

  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const tools =
    document.getElementById("editTools");

  const filters =
    document.getElementById("filters");

  const cropTools =
    document.getElementById("cropTools");

  const change =
    document.getElementById("changeButton");

  const message =
    document.getElementById("message");


  image.style.display="none";
  video.style.display="none";

  tools.style.display="none";
  filters.style.display="none";
  cropTools.style.display="none";

  change.style.display="block";


  /* PHOTO */

  if(file.type.startsWith("image/")){

    const url =
      URL.createObjectURL(file);

    image.src=url;

    image.style.display="block";

    tools.style.display="flex";
    filters.style.display="flex";
    cropTools.style.display="flex";


    originalImage=new Image();

    originalImage.onload=function(){

      applyPreview();

    };

    originalImage.src=url;


    message.textContent=
      "✅ Photo selected. You can edit it before publishing.";

    return;
  }


  /* VIDEO */

  if(file.type.startsWith("video/")){

    const url =
      URL.createObjectURL(file);

    video.src=url;

    video.style.display="block";

    message.textContent=
      "✅ Reel selected.";

    video.onloadedmetadata=function(){

      if(video.duration > 60){

        alert(
          "⚠️ Reel must be 60 seconds or less."
        );

        selectedMedia=null;

        video.src="";
        video.style.display="none";

        change.style.display="none";

        document.getElementById(
          "mediaInput"
        ).value="";

        return;
      }

    };

  }

});


/* =========================
SOUND SELECT
========================= */

document
.getElementById("soundInput")
.addEventListener("change",function(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("audio/")){

    alert("Please select an audio file.");

    return;
  }


  if(file.size > 10*1024*1024){

    alert(
      "Please select audio under 10 MB."
    );

    return;
  }


  selectedSound=file;


  const box =
    document.getElementById("soundBox");

  const preview =
    document.getElementById("soundPreview");


  preview.src =
    URL.createObjectURL(file);

  box.style.display="block";


  document.getElementById(
    "message"
  ).textContent=
    "🎵 Sound selected. Press ▶️ to preview.";

});


/* =========================
REMOVE SOUND
========================= */

function removeSound(){

  selectedSound=null;

  const preview =
    document.getElementById("soundPreview");

  preview.pause();
  preview.src="";

  document.getElementById(
    "soundBox"
  ).style.display="none";

  document.getElementById(
    "soundInput"
  ).value="";

}


/* =========================
PREVIEW
========================= */

function applyPreview(){

  const image =
    document.getElementById("preview");

  image.style.transform=
    "rotate("+
    rotation+
    "deg) scale("+
    zoom+
    ")";

  image.style.filter=
    currentFilter;
}


/* =========================
ROTATE
========================= */

function rotatePhoto(){

  if(!originalImage){
    return;
  }

  rotation+=90;

  if(rotation>=360){
    rotation=0;
  }

  applyPreview();
}


/* =========================
ZOOM
========================= */

function zoomIn(){

  zoom+=0.1;

  if(zoom>2){
    zoom=2;
  }

  applyPreview();
}


function zoomOut(){

  zoom-=0.1;

  if(zoom<0.5){
    zoom=0.5;
  }

  applyPreview();
}


/* =========================
FILTER
========================= */

function setFilter(filter){

  currentFilter=filter;

  applyPreview();
}


/* =========================
CROP
========================= */

function cropPhoto(ratio){

  if(!originalImage){
    return;
  }

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  let width =
    originalImage.width;

  let height =
    originalImage.height;


  const originalRatio =
    width/height;


  let cropWidth;
  let cropHeight;


  if(originalRatio > ratio){

    cropHeight=height;
    cropWidth=height*ratio;

  }else{

    cropWidth=width;
    cropHeight=width/ratio;

  }


  const x =
    (width-cropWidth)/2;

  const y =
    (height-cropHeight)/2;


  canvas.width=cropWidth;
  canvas.height=cropHeight;


  ctx.drawImage(
    originalImage,
    x,
    y,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );


  canvas.toBlob(function(blob){

    if(!blob){
      return;
    }


    selectedMedia =
      new File(
        [blob],
        "edited-photo.jpg",
        {
          type:"image/jpeg"
        }
      );


    const url =
      URL.createObjectURL(selectedMedia);


    originalImage=new Image();


    originalImage.onload=function(){

      rotation=0;
      zoom=1;

      applyPreview();

    };


    originalImage.src=url;


    document.getElementById(
      "preview"
    ).src=url;


    document.getElementById(
      "message"
    ).textContent=
      "✅ Crop applied.";

  },"image/jpeg",0.92);

}


/* =========================
RESET
========================= */

function resetPhoto(){

  if(!selectedMedia){
    return;
  }

  rotation=0;
  zoom=1;
  currentFilter="none";

  applyPreview();
}


/* =========================
CHANGE
========================= */

function changeMedia(){

  document
  .getElementById("mediaInput")
  .click();

}


/* =========================
GET POSTS
========================= */

function getPosts(){

  try{

    const saved =
      localStorage.getItem("posts");

    if(!saved){
      return [];
    }

    const posts =
      JSON.parse(saved);

    return Array.isArray(posts)
      ? posts
      : [];

  }catch(error){

    return [];

  }
}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts){

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
FILE TO DATA URL
========================= */

function fileToDataURL(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload=function(event){

        resolve(event.target.result);

      };

      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
CREATE FINAL PHOTO
========================= */

function createEditedImage(){

  return new Promise(function(resolve){

    if(!originalImage){

      resolve(null);
      return;

    }


    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");


    const width =
      originalImage.width;

    const height =
      originalImage.height;


    const angle =
      rotation*Math.PI/180;


    const sin =
      Math.abs(Math.sin(angle));

    const cos =
      Math.abs(Math.cos(angle));


    const newWidth =
      width*cos+
      height*sin;

    const newHeight =
      width*sin+
      height*cos;


    canvas.width=
      newWidth*zoom;

    canvas.height=
      newHeight*zoom;


    ctx.save();


    ctx.translate(
      canvas.width/2,
      canvas.height/2
    );


    ctx.rotate(angle);


    ctx.scale(
      zoom,
      zoom
    );


    ctx.filter=
      currentFilter;


    ctx.drawImage(
      originalImage,
      -width/2,
      -height/2,
      width,
      height
    );


    ctx.restore();


    canvas.toBlob(
      function(blob){

        resolve(blob);

      },
      "image/jpeg",
      0.92
    );

  });

}


/* =========================
PUBLISH
========================= */

async function publishPost(){

  const message =
    document.getElementById("message");

  const text =
    document
    .getElementById("postText")
    .value
    .trim();


  if(
    text==="" &&
    !selectedMedia
  ){

    message.textContent=
      "⚠️ Write a caption or select a photo/video.";

    return;
  }


  message.textContent=
    "⏳ Publishing...";


  const posts =
    getPosts();


  const username =
    localStorage.getItem("username") ||
    "You";


  const profileImage =
    localStorage.getItem("profileImage") ||
    null;


  /* SOUND */

  let soundData=null;


  if(selectedSound){

    try{

      soundData=
        await fileToDataURL(
          selectedSound
        );

    }catch(error){

      message.textContent=
        "⚠️ Could not save sound.";

      return;

    }

  }


  /* =========================
  TEXT ONLY
  ========================= */

  if(!selectedMedia){

    posts.unshift({

      id:Date.now(),

      username:username,

      profileImage:profileImage,

      text:text,

      media:null,

      mediaType:null,

      sound:soundData,

      soundType:
        selectedSound
        ? selectedSound.type
        : null,

      liked:false,

      likeCount:0,

      comments:[],

      createdAt:Date.now()

    });


    savePosts(posts);

    finish();

    return;
  }


  /* =========================
  VIDEO
  ========================= */

  if(
    selectedMedia.type.startsWith("video/")
  ){

    if(
      selectedMedia.size >
      20*1024*1024
    ){

      message.textContent=
        "⚠️ Reel must be under 20 MB.";

      return;
    }


    try{

      const videoData =
        await fileToDataURL(
          selectedMedia
        );


      posts.unshift({

        id:Date.now(),

        username:username,

        profileImage:profileImage,

        text:text,

        media:videoData,

        mediaType:selectedMedia.type,

        sound:soundData,

        soundType:
          selectedSound
          ? selectedSound.type
          : null,

        liked:false,

        likeCount:0,

        comments:[],

        createdAt:Date.now()

      });


      savePosts(posts);

      finish();

    }catch(error){

      message.textContent=
        "⚠️ Could not save Reel.";

    }

    return;
  }


  /* =========================
  PHOTO
  ========================= */

  message.textContent=
    "⏳ Saving edited photo...";


  const blob =
    await createEditedImage();


  if(!blob){

    message.textContent=
      "⚠️ Could not create edited photo.";

    return;
  }


  try{

    const photoData =
      await fileToDataURL(blob);


    posts.unshift({

      id:Date.now(),

      username:username,

      profileImage:profileImage,

      text:text,

      media:photoData,

      mediaType:"image/jpeg",

      sound:soundData,

      soundType:
        selectedSound
        ? selectedSound.type
        : null,

      liked:false,

      likeCount:0,

      comments:[],

      createdAt:Date.now()

    });


    savePosts(posts);

    finish();

  }catch(error){

    message.textContent=
      "⚠️ Photo is too large for browser storage.";

  }

}


/* =========================
FINISH
========================= */

function finish(){

  document.getElementById(
    "message"
  ).textContent=
    "✅ Published successfully!";


  setTimeout(function(){

    window.location.href=
      "index.html";

  },700);

}

</script>

</body>
</html>
