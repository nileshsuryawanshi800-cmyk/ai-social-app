<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create - AI Social</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
}

header {
  background: white;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header button {
  border: none;
  background: none;
  font-size: 26px;
  cursor: pointer;
}

header h1 {
  font-size: 20px;
}

.container {
  padding: 20px;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 15px;
  font-size: 16px;
  resize: none;
  background: white;
}

.file-label {
  display: block;
  margin-top: 15px;
  padding: 16px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  font-size: 16px;
}

#mediaInput {
  display: none;
}

#preview,
#videoPreview {
  display: none;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 15px;
  background: #000;
}

.post-button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <button onclick="goHome()">←</button>
  <h1>➕ Create Post</h1>
</header>

<div class="container">

<textarea
  id="postText"
  placeholder="What's on your mind?"
></textarea>

<label class="file-label" for="mediaInput">
  📸 Select Photo or 🎥 Video
</label>

<input
  id="mediaInput"
  type="file"
  accept="image/*,video/*"
  onchange="previewMedia(event)"
>

<img id="preview" alt="Photo preview">

<video
  id="videoPreview"
  controls
  playsinline
></video>

<button
  class="post-button"
  onclick="publishPost()"
>
  📤 Publish
</button>

<p id="message" class="message"></p>

</div>

<script>

/* =========================
   HOME
========================= */

function goHome() {
  window.location.href = "index.html";
}


/* =========================
   SELECTED FILE
========================= */

let selectedMedia = null;


/* =========================
   PREVIEW
========================= */

function previewMedia(event) {

  const file = event.target.files[0];

  if (!file) {
    return;
  }

  selectedMedia = file;

  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const message =
    document.getElementById("message");

  image.style.display = "none";
  video.style.display = "none";

  message.textContent = "";


  /* PHOTO */

  if (file.type.startsWith("image/")) {

    image.src =
      URL.createObjectURL(file);

    image.style.display = "block";

    return;
  }


  /* VIDEO */

  if (file.type.startsWith("video/")) {

    const videoURL =
      URL.createObjectURL(file);

    video.src = videoURL;

    video.style.display = "block";


    /* Check video duration */

    video.onloadedmetadata = function() {

      if (video.duration > 60) {

        message.textContent =
          "⚠️ Reel/video must be 1 minute or less.";

        selectedMedia = null;

        video.style.display = "none";

        document.getElementById(
          "mediaInput"
        ).value = "";

      } else {

        message.textContent =
          "✅ Video ready to publish.";

      }

    };

    return;
  }


  message.textContent =
    "⚠️ Please select a photo or video.";

  selectedMedia = null;
}


/* =========================
   GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch (error) {

    return [];

  }
}


/* =========================
   PUBLISH
========================= */

function publishPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const message =
    document.getElementById("message");


  if (
    text === "" &&
    !selectedMedia
  ) {

    message.textContent =
      "⚠️ Write a caption or select a photo/video.";

    return;
  }


  /* VIDEO CHECK */

  if (
    selectedMedia &&
    selectedMedia.type.startsWith("video/")
  ) {

    const video =
      document.getElementById("videoPreview");

    if (
      video.duration &&
      video.duration > 60
    ) {

      message.textContent =
        "⚠️ Video must be 1 minute or less.";

      return;
    }
  }


  message.textContent =
    "⏳ Preparing your post...";


  const posts = getPosts();

  const username =
    localStorage.getItem("username") ||
    "You";

  const profileImage =
    localStorage.getItem("profileImage") ||
    null;


  /* TEXT ONLY */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: null,

      mediaType: null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });


    localStorage.setItem(
      "posts",
      JSON.stringify(posts)
    );


    finish();

    return;
  }


  /* READ MEDIA */

  const reader =
    new FileReader();


  reader.onload = function(event) {

    const mediaData =
      event.target.result;


    const newPost = {

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: mediaData,

      mediaType: selectedMedia.type,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    };


    posts.unshift(newPost);


    try {

      localStorage.setItem(
        "posts",
        JSON.stringify(posts)
      );


      finish();

    } catch (error) {

      message.textContent =
        "⚠️ This video/photo is too large for browser storage. The next step will move media to IndexedDB.";

    }

  };


  reader.onerror = function() {

    message.textContent =
      "⚠️ Could not read the file.";

  };


  reader.readAsDataURL(
    selectedMedia
  );

}


/* =========================
   FINISH
========================= */

function finish() {

  document.getElementById(
    "message"
  ).textContent =
    "✅ Published successfully!";


  setTimeout(function() {

    window.location.href =
      "index.html";

  }, 700);

}

</script>

</body>
</html>
