<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create - AI Social</title><style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;

}

header {

}

}

  font-size: 20px;
}

.container {
  padding: 18px;
}

textarea {
  width: 100%;
  height: 110px;

}

.file-label {
  display: block;

}

#mediaInput {
  display: none;
}

.preview-box {
  margin-top: 15px;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
}

#preview {
  width: 100%;
  max-height: 550px;
  object-fit: contain;
  display: none;
}

#videoPreview {
  width: 100%;
  max-height: 550px;
  display: none;
}

.edit-tools,
.filters,
.crop-tools {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.edit-tools button,
.filters button,
.crop-tools button {
  border: 1px solid #ddd;
  background: white;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.edit-tools button:active,
.filters button:active,
.crop-tools button:active {
  transform: scale(0.96);
}

.post-button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.change-button {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
  background: white;
  font-size: 15px;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  min-height: 20px;
}

#editCanvas {
  display: none;
}
</style></head><body><header>
  <button onclick="goHome()">←</button>
  <h1>➕ Create Post</h1>
</header><div class="container"><textarea
  id="postText"
  placeholder="Write a caption..."
></textarea><label class="file-label" for="mediaInput">
  📸 Select Photo or 🎥 Reel
</label><input
id="mediaInput"
type="file"
accept="image/,video/"

<div class="preview-box"> <!-- SOUND -->

<label class="file-label" for="soundInput">
🎵 Add Sound / Music
</label>

<input
  id="soundInput"
  type="file"
  accept="audio/*"
  onchange="selectSound(event)"
>

<audio
  id="soundPreview"
  controls
  style="display:none;width:100%;margin-top:12px;"
></audio>

<button

  onclick="removeSound()"
  style="display:none;width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:20px;background:white;"
>

</button>  <img id="preview" alt="Photo preview"><video

playsinline

«</video>»

</div><div class="edit-tools" id="editTools"><button onclick="rotatePhoto()">🔄 Rotate</button>

<button onclick="zoomIn()">🔍 Zoom +</button>

<button onclick="zoomOut()">🔎 Zoom -</button>

<button onclick="startCrop()">✂️ Crop</button>

<button onclick="resetPhoto()">↩️ Reset</button>

</div><div class="crop-tools" id="cropTools"><button onclick="cropPhoto(1)">🔲 Square</button>

<button onclick="cropPhoto(0.8)">📱 Portrait</button>

<button onclick="cropPhoto(16/9)">🖼️ Landscape</button>

<button onclick="cancelCrop()">❌ Cancel</button>

</div><div class="filters" id="filters"><button onclick="setFilter('none')">Normal</button>

<button onclick="setFilter('grayscale(1)')">⚫ B&W</button>

<button onclick="setFilter('sepia(1)')">🟤 Sepia</button>

<button onclick="setFilter('brightness(1.3)')">☀️ Bright</button>

<button onclick="setFilter('contrast(1.4)')">✨ Contrast</button>

</div><button
class="change-button"
id="changeButton"
onclick="changeMedia()"

«»

🔄 Change Photo / Video
</button>

<button
class="post-button"
onclick="publishPost()"

«»

📤 Publish
</button>

<p id="message" class="message"></p><canvas id="editCanvas"></canvas>

</div><script>

let selectedMedia = null;
let selectedSound = null;
let originalImage = null;

let rotation = 0;
let zoom = 1;
let currentFilter = "none";

let cropApplied = false;


/* =========================
   HOME
========================= */

function goHome() {
  window.location.href = "index.html";
}


/* =========================
   MEDIA INPUT
========================= */

document
  .getElementById("mediaInput")
  .addEventListener("change", selectMedia);


/* =========================
   SELECT MEDIA
========================= */

function selectMedia(event) {

  const file = event.target.files[0];

  if (!file) return;

  selectedMedia = file;

  rotation = 0;
  zoom = 1;
  currentFilter = "none";
  cropApplied = false;
  originalImage = null;

  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const tools =
    document.getElementById("editTools");

  const filters =
    document.getElementById("filters");

  const cropTools =
    document.getElementById("cropTools");

  const change =
    document.getElementById("changeButton");

  const message =
    document.getElementById("message");

  image.style.display = "none";
  video.style.display = "none";

  tools.style.display = "none";
  filters.style.display = "none";
  cropTools.style.display = "none";

  change.style.display = "block";

  message.textContent = "";

  /* PHOTO */

  if (file.type.startsWith("image/")) {

    const url =
      URL.createObjectURL(file);

    image.src = url;

    image.style.display = "block";

    tools.style.display = "flex";
    filters.style.display = "flex";

    originalImage = new Image();

    originalImage.onload = function() {

      applyPreview();

    };

    originalImage.src = url;

    message.textContent =
      "✅ Photo ready. Edit it before publishing.";

    return;
  }


  /* VIDEO */

  if (file.type.startsWith("video/")) {

    const url =
      URL.createObjectURL(file);

    video.src = url;

    video.style.display = "block";

    video.onloadedmetadata = function() {

      if (video.duration > 60) {

        alert(
          "⚠️ Reel must be 1 minute or less."
        );

        clearMedia();

        return;
      }

      message.textContent =
        "✅ Reel ready. Maximum length: 1 minute.";

    };

    return;
  }

}


/* =========================
   CLEAR MEDIA
========================= */

function clearMedia() {

  selectedMedia = null;
  originalImage = null;

  const input =
    document.getElementById("mediaInput");

  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  image.src = "";
  video.src = "";

  image.style.display = "none";
  video.style.display = "none";

  document.getElementById("editTools")
    .style.display = "none";

  document.getElementById("filters")
    .style.display = "none";

  document.getElementById("cropTools")
    .style.display = "none";

  document.getElementById("changeButton")
    .style.display = "none";

  input.value = "";

}


/* =========================
   PREVIEW
========================= */

function applyPreview() {

  const image =
    document.getElementById("preview");

  image.style.transform =
    "rotate(" +
    rotation +
    "deg) scale(" +
    zoom +
    ")";

  image.style.filter =
    currentFilter;

}


/* =========================
   ROTATE
========================= */

function rotatePhoto() {

  if (!originalImage) return;

  rotation += 90;

  if (rotation >= 360) {
    rotation = 0;
  }

  applyPreview();

}


/* =========================
   ZOOM
========================= */

function zoomIn() {

  if (!originalImage) return;

  zoom += 0.1;

  if (zoom > 2) {
    zoom = 2;
  }

  applyPreview();

}


function zoomOut() {

  if (!originalImage) return;

  zoom -= 0.1;

  if (zoom < 0.5) {
    zoom = 0.5;
  }

  applyPreview();

}


/* =========================
   FILTER
========================= */

function setFilter(filter) {

  if (!originalImage) return;

  currentFilter = filter;

  applyPreview();

}


/* =========================
   START CROP
========================= */

function startCrop() {

  if (!selectedMedia) return;

  if (!selectedMedia.type.startsWith("image/")) {

    alert("✂️ Crop is available for photos only.");

    return;
  }

  document.getElementById("cropTools")
    .style.display = "flex";

}


/* =========================
   CANCEL CROP
========================= */

function cancelCrop() {

  document.getElementById("cropTools")
    .style.display = "none";

}


/* =========================
   CROP
========================= */

function cropPhoto(ratio) {

  if (!originalImage) return;

  const sourceWidth =
    originalImage.naturalWidth ||
    originalImage.width;

  const sourceHeight =
    originalImage.naturalHeight ||
    originalImage.height;

  const sourceRatio =
    sourceWidth / sourceHeight;

  let cropWidth;
  let cropHeight;

  if (sourceRatio > ratio) {

    cropHeight = sourceHeight;
    cropWidth = sourceHeight * ratio;

  } else {

    cropWidth = sourceWidth;
    cropHeight = sourceWidth / ratio;

  }

  const x =
    (sourceWidth - cropWidth) / 2;

  const y =
    (sourceHeight - cropHeight) / 2;

  const canvas =
    document.getElementById("editCanvas");

  canvas.width =
    Math.round(cropWidth);

  canvas.height =
    Math.round(cropHeight);

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    Crop the original image first.
    This creates a new source image.
  */

  ctx.filter = "none";

  ctx.drawImage(
    originalImage,
    x,
    y,
    cropWidth,
    cropHeight,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(
    function(blob) {

      if (!blob) {

        document.getElementById("message")
          .textContent =
          "⚠️ Crop failed.";

        return;
      }

      selectedMedia =
        new File(
          [blob],
          "edited-photo.jpg",
          {
            type: "image/jpeg"
          }
        );

      const url =
        URL.createObjectURL(selectedMedia);

      originalImage =
        new Image();

      originalImage.onload =
        function() {

          rotation = 0;
          zoom = 1;

          applyPreview();

        };

      originalImage.src = url;

      document.getElementById("preview")
        .src = url;

      cropApplied = true;

      document.getElementById("cropTools")
        .style.display = "none";

      document.getElementById("message")
        .textContent =
        "✅ Crop applied.";

    },
    "image/jpeg",
    0.92
  );

}


/* =========================
   RESET
========================= */

function resetPhoto() {

  if (!selectedMedia) return;

  if (!originalImage) return;

  rotation = 0;
  zoom = 1;
  currentFilter = "none";

  applyPreview();

}


/* =========================
   CHANGE MEDIA
========================= */

function changeMedia() {

  document.getElementById("mediaInput").click();

}


/* =========================
   POSTS
========================= */

function getPosts() {

  try {

    const saved =
      localStorage.getItem("posts");

    if (!saved) return [];

    const posts =
      JSON.parse(saved);

    return Array.isArray(posts)
      ? posts
      : [];

  } catch(error) {

    return [];

  }

}


function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
   CREATE FINAL IMAGE
========================= */

function createEditedImage() {

  return new Promise(function(resolve) {

    if (!originalImage) {

      resolve(null);
      return;

    }

    const canvas =
      document.getElementById("editCanvas");

    const ctx =
      canvas.getContext("2d");

    const width =
      originalImage.naturalWidth ||
      originalImage.width;

    const height =
      originalImage.naturalHeight ||
      originalImage.height;

    const angle =
      rotation *
      Math.PI /
      180;

    const scale =
      zoom;

    const sin =
      Math.abs(Math.sin(angle));

    const cos =
      Math.abs(Math.cos(angle));

    const outputWidth =
      Math.ceil(
        (width * cos + height * sin) *
        scale
      );

    const outputHeight =
      Math.ceil(
        (width * sin + height * cos) *
        scale
      );

    canvas.width =
      outputWidth;

    canvas.height =
      outputHeight;

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.save();

    ctx.translate(
      canvas.width / 2,
      canvas.height / 2
    );

    ctx.rotate(angle);

    ctx.scale(
      scale,
      scale
    );

    /*
      THIS IS THE IMPORTANT PART.

      The filter is rendered into the canvas,
      so B&W/sepia/brightness/contrast are
      saved into the actual image.
    */

    ctx.filter =
      currentFilter;

    ctx.drawImage(
      originalImage,
      -width / 2,
      -height / 2,
      width,
      height
    );

    ctx.restore();

    canvas.toBlob(
      function(blob) {

        resolve(blob);

      },
      "image/jpeg",
      0.88
    );

  });

}


/* =========================
   PUBLISH
========================= */

async function publishPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const message =
    document.getElementById("message");

  if (
    text === "" &&
    !selectedMedia
  ) {

    message.textContent =
      "⚠️ Write a caption or select media.";

    return;

  }

  message.textContent =
    "⏳ Preparing your post...";

  const posts =
    getPosts();

  const username =
    localStorage.getItem("username") ||
    "You";

  const profileImage =
    localStorage.getItem("profileImage") ||
    null;


  /* =========================
     TEXT ONLY
  ========================= */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: null,

      mediaType: null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });

    try {

      savePosts(posts);

      finish();

    } catch(error) {

      message.textContent =
        "⚠️ Could not save the post.";

    }

    return;
  }


  /* =========================
     VIDEO
  ========================= */

  if (
    selectedMedia.type.startsWith("video/")
  ) {

    const video =
      document.getElementById("videoPreview");

    if (
      video.duration &&
      video.duration > 60
    ) {

      message.textContent =
        "⚠️ Reel must be 1 minute or less.";

      return;

    }

    /*
      Keep the 20 MB limit for the current
      browser-storage version.
    */

    if (
      selectedMedia.size >
      20 * 1024 * 1024
    ) {

      message.textContent =
        "⚠️ Please choose a Reel under 20 MB.";

      return;

    }

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        posts.unshift({

          id: Date.now(),

          username: username,

          profileImage: profileImage,

          text: text,

          media: event.target.result,

          mediaType: selectedMedia.type,

          liked: false,

          likeCount: 0,

          comments: [],

          createdAt: Date.now()

        });

        try {

          savePosts(posts);

          finish();

        } catch(error) {

          message.textContent =
            "⚠️ Reel is too large for browser storage. Try a smaller video.";

        }

      };

    reader.readAsDataURL(selectedMedia);

    return;
  }


  /* =========================
     PHOTO
  ========================= */

  message.textContent =
    "⏳ Saving your edited photo...";

  const editedBlob =
    await createEditedImage();

  if (!editedBlob) {

    message.textContent =
      "⚠️ Could not create the edited photo.";

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(event) {

      posts.unshift({

        id: Date.now(),

        username: username,

        profileImage: profileImage,

        text: text,

        media: event.target.result,

        mediaType: "image/jpeg",

        liked: false,

        likeCount: 0,

        comments: [],

        createdAt: Date.now()

      });

      try {

        savePosts(posts);

        finish();

      } catch(error) {

        message.textContent =
          "⚠️ Photo is too large for browser storage.";

      }

    };

  reader.readAsDataURL(editedBlob);

}


/* =========================
   FINISH
========================= */

function finish() {

  document.getElementById("message")
    .textContent =
    "✅ Published successfully!";

  setTimeout(function() {

    window.location.href =
      "index.html";

  }, 700);

}

</script></body>
</html>
