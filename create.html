<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Post - AI Social</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: white;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #ddd;
    }

    header button {
      border: none;
      background: none;
      font-size: 26px;
      cursor: pointer;
    }

    header h1 {
      font-size: 20px;
    }

    .container {
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-size: 16px;
      resize: none;
      background: white;
    }

    .file-label {
      display: block;
      margin-top: 15px;
      padding: 15px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      font-size: 16px;
    }

    #mediaInput {
      display: none;
    }

    #preview,
    #videoPreview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 15px;
      background: #000;
    }

    .post-button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 25px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <button onclick="goHome()">←</button>
  <h1>📸 Create Post</h1>
</header>

<div class="container">

  <textarea
    id="postText"
    placeholder="What's on your mind?"
  ></textarea>

  <label class="file-label" for="mediaInput">
    📸 Select Photo or Video
  </label>

  <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    onchange="previewMedia(event)"
  >

  <img id="preview" alt="Photo preview">

  <video
    id="videoPreview"
    controls
    playsinline
  ></video>

  <button
    class="post-button"
    onclick="createPost()"
  >
    📤 Publish Post
  </button>

  <p id="message" class="message"></p>

</div>

<script>

function goHome() {
  window.location.href = "index.html";
}


/* =========================
   SELECTED MEDIA
========================= */

let selectedMedia = null;


/* =========================
   PREVIEW PHOTO / VIDEO
========================= */

function previewMedia(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  selectedMedia = file;

  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const url =
    URL.createObjectURL(file);

  image.style.display = "none";
  video.style.display = "none";


  if (file.type.startsWith("image/")) {

    image.src = url;
    image.style.display = "block";

  }


  if (file.type.startsWith("video/")) {

    video.src = url;
    video.style.display = "block";

  }

}


/* =========================
   GET EXISTING POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch (error) {

    return [];

  }

}


/* =========================
   CREATE POST
========================= */

function createPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();


  if (
    text === "" &&
    !selectedMedia
  ) {

    document
      .getElementById("message")
      .textContent =
      "⚠️ Write something or select a photo/video.";

    return;

  }


  const posts =
    getPosts();


  const username =
    localStorage.getItem("username") ||
    "You";

  const profileImage =
    localStorage.getItem("profileImage");


  /* =========================
     TEXT-ONLY POST
  ========================= */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      text: text,

      media: null,

      mediaType: null,

      username: username,

      profileImage: profileImage || null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });


    localStorage.setItem(
      "posts",
      JSON.stringify(posts)
    );


    finishPost();

    return;

  }


  /* =========================
     VIDEO LIMIT
  ========================= */

  if (
    selectedMedia.type.startsWith("video/")
  ) {

    if (
      selectedMedia.size >
      3 * 1024 * 1024
    ) {

      document
        .getElementById("message")
        .textContent =
        "⚠️ This video is too large for the current local storage system.";

      return;

    }

  }


  /* =========================
     READ PHOTO / VIDEO
  ========================= */

  const reader =
    new FileReader();


  reader.onload = function(event) {

    const mediaData =
      event.target.result;


    posts.unshift({

      id: Date.now(),

      text: text,

      media: mediaData,

      mediaType: selectedMedia.type,

      username: username,

      profileImage: profileImage || null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });


    try {

      localStorage.setItem(
        "posts",
        JSON.stringify(posts)
      );


      finishPost();

    } catch (error) {

      document
        .getElementById("message")
        .textContent =
        "⚠️ This file is too large for phone storage. We'll fix large Reels in the next step.";

    }

  };


  reader.onerror = function() {

    document
      .getElementById("message")
      .textContent =
      "⚠️ Could not read this file.";

  };


  reader.readAsDataURL(
    selectedMedia
  );

}


/* =========================
   FINISH
========================= */

function finishPost() {

  document
    .getElementById("message")
    .textContent =
    "✅ Post created successfully!";


  setTimeout(function() {

    window.location.href =
      "index.html";

  }, 700);

}

</script>

</body>
</html>
