<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Post</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .container {
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 15px;
      box-sizing: border-box;
      font-size: 16px;
      resize: none;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #111;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>➕ Create Post</header>

<div class="container">

  <textarea id="postText"
    placeholder="What's on your mind?"></textarea>

  <button onclick="createPost()">
  🚀 Post
</button>

<script>
function createPost() {
  const text = document.querySelector("textarea").value.trim();

  if (text === "") {
    alert("Please write something first!");
    return;
  }

  localStorage.setItem("myPost", text);

  alert("Post created successfully! 🎉");

  window.location.href = "index.html";
}
</script>

</div>

<script>
function createPost() {
  const text = document.getElementById("postText").value.trim();

  if (!text) {
    alert("Please write something first!");
    return;
  }

  localStorage.setItem("latestPost", text);

  alert("Post published! 🎉");

  window.location.href = "index.html";
}
</script>

</body>
</html>
