<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create - AI Social</title><style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 30px;
}

header {
  background: white;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #ddd;
}

header button {
  border: none;
  background: none;
  font-size: 28px;
  cursor: pointer;
}

header h1 {
  font-size: 20px;
  margin: 0;
}

.container {
  padding: 18px;
}

textarea {
  width: 100%;
  height: 110px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 15px;
  font-size: 16px;
  resize: none;
  background: white;
}

/* SELECT BUTTON */

.file-label {
  display: block;
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
}

/* KEEP INPUT WORKING LIKE ORIGINAL */

#mediaInput,
#soundInput {
  display: none;
}

/* PREVIEW */

.preview-box {
  margin-top: 15px;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
}

#preview {
  width: 100%;
  max-height: 550px;
  object-fit: contain;
  display: none;
  transform-origin: center center;
}

#videoPreview {
  width: 100%;
  max-height: 550px;
  display: none;
}

/* SOUND */

.sound-box {
  margin-top: 15px;
  background: white;
  padding: 15px;
  border-radius: 15px;
  display: none;
}

.sound-title {
  font-weight: bold;
  margin-bottom: 10px;
}

#soundPreview {
  width: 100%;
}

.remove-sound-button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: white;
  color: red;
  font-weight: bold;
}

/* EDIT TOOLS */

.edit-tools,
.filters,
.crop-tools {
  display: none;
  margin-top: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.edit-tools button,
.filters button,
.crop-tools button {
  border: 1px solid #ddd;
  background: white;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

/* CHANGE */

.change-button {
  display: none;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
  background: white;
  font-size: 15px;
}

/* PUBLISH */

.post-button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

#editCanvas {
  display: none;
}
</style></head><body><header><button onclick="goHome()">←</button>

<h1>➕ Create Post</h1></header><div class="container"><textarea
  id="postText"
  placeholder="Write a caption..."
></textarea><!-- =========================
PHOTO / VIDEO
========================= --><label
class="file-label"
for="mediaInput"

«»

📸 Select Photo or 🎥 Reel
</label>

<input
id="mediaInput"
type="file"
accept="image/,video/"
onchange="selectMedia(event)"

«»

<!-- =========================
SOUND
========================= --><label
class="file-label"
for="soundInput"

«»

🎵 Add Sound / Music
</label>

<input
id="soundInput"
type="file"
accept="audio/*"
onchange="selectSound(event)"

«»

<!-- SOUND PREVIEW --><div
  class="sound-box"
  id="soundBox"
><div class="sound-title">
🎵 Sound Preview
</div><audio
id="soundPreview"
controls

«</audio>»

<button
type="button"
class="remove-sound-button"
onclick="removeSound()"

«»

❌ Remove Sound
</button>

</div><!-- MEDIA PREVIEW --><div class="preview-box"><img
id="preview"
alt="Edited photo preview"

«»

<video
id="videoPreview"
controls
playsinline

«</video>»

</div><!-- PHOTO EDITING --><div
  class="edit-tools"
  id="editTools"
><button onclick="rotatePhoto()">
🔄 Rotate
</button><button onclick="zoomIn()">
🔍 Zoom +
</button><button onclick="zoomOut()">
🔎 Zoom -
</button><button onclick="resetPhoto()">
↩️ Reset
</button></div><!-- FILTERS --><div
  class="filters"
  id="filters"
><button onclick="setFilter('none')">
Normal
</button><button onclick="setFilter('grayscale(1)')">
⚫ B&W
</button><button onclick="setFilter('sepia(1)')">
🟤 Sepia
</button><button onclick="setFilter('brightness(1.3)')">
☀️ Bright
</button><button onclick="setFilter('contrast(1.4)')">
✨ Contrast
</button></div><!-- CROP --><div
  class="crop-tools"
  id="cropTools"
><button onclick="cropPhoto(1)">
🔲 Square
</button><button onclick="cropPhoto(0.8)">
📱 Portrait
</button><button onclick="cropPhoto(16/9)">
🖼️ Landscape
</button><button onclick="cancelCrop()">
❌ Cancel
</button></div><button
class="change-button"
id="changeButton"
onclick="changeMedia()"

«»

🔄 Change Photo / Video
</button>

<button
class="post-button"
onclick="publishPost()"

«»

📤 Publish
</button>

<p
  id="message"
  class="message"
></p><canvas id="editCanvas"></canvas>

</div><script>

/* =========================
VARIABLES
========================= */

let selectedMedia = null;
let selectedSound = null;

let originalImage = null;

let rotation = 0;
let zoom = 1;
let currentFilter = "none";


/* =========================
HOME
========================= */

function goHome() {

  window.location.href =
    "index.html";

}


/* =========================
SELECT MEDIA
========================= */

function selectMedia(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  selectedMedia = file;

  rotation = 0;
  zoom = 1;
  currentFilter = "none";


  const image =
    document.getElementById("preview");

  const video =
    document.getElementById("videoPreview");

  const tools =
    document.getElementById("editTools");

  const filters =
    document.getElementById("filters");

  const cropTools =
    document.getElementById("cropTools");

  const change =
    document.getElementById("changeButton");

  const message =
    document.getElementById("message");


  image.style.display = "none";
  video.style.display = "none";

  tools.style.display = "none";
  filters.style.display = "none";
  cropTools.style.display = "none";


  change.style.display = "block";


  /* =========================
  PHOTO
  ========================= */

  if (
    file.type.startsWith("image/")
  ) {

    const url =
      URL.createObjectURL(file);


    originalImage =
      new Image();


    originalImage.onload =
      function() {

        image.src = url;

        image.style.display =
          "block";

        tools.style.display =
          "flex";

        filters.style.display =
          "flex";

        applyPreview();

      };


    originalImage.src =
      url;


    message.textContent =
      "✅ Photo selected. Edit it before publishing.";

    return;

  }


  /* =========================
  VIDEO
  ========================= */

  if (
    file.type.startsWith("video/")
  ) {

    originalImage = null;


    video.src =
      URL.createObjectURL(file);


    video.style.display =
      "block";


    video.onloadedmetadata =
      function() {

        if (
          video.duration > 60
        ) {

          alert(
            "⚠️ Reel must be 1 minute or less."
          );


          selectedMedia =
            null;


          video.src =
            "";


          video.style.display =
            "none";


          change.style.display =
            "none";


          document.getElementById(
            "mediaInput"
          ).value =
            "";


          return;

        }


        message.textContent =
          "✅ Reel selected. Maximum 1 minute.";

      };


    return;

  }

}


/* =========================
SOUND
========================= */

function selectSound(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  if (
    !file.type.startsWith("audio/")
  ) {

    alert(
      "⚠️ Please select an audio file."
    );

    return;

  }


  if (
    file.size >
    10 * 1024 * 1024
  ) {

    alert(
      "⚠️ Sound must be under 10 MB."
    );

    return;

  }


  selectedSound =
    file;


  const soundBox =
    document.getElementById(
      "soundBox"
    );


  const soundPreview =
    document.getElementById(
      "soundPreview"
    );


  soundPreview.src =
    URL.createObjectURL(file);


  soundBox.style.display =
    "block";


  document.getElementById(
    "message"
  ).textContent =
    "🎵 Sound selected. Press ▶️ to preview.";

}


/* =========================
REMOVE SOUND
========================= */

function removeSound() {

  selectedSound =
    null;


  const sound =
    document.getElementById(
      "soundPreview"
    );


  sound.pause();

  sound.src = "";


  document.getElementById(
    "soundBox"
  ).style.display =
    "none";


  document.getElementById(
    "soundInput"
  ).value =
    "";

}


/* =========================
PREVIEW
========================= */

function applyPreview() {

  const image =
    document.getElementById(
      "preview"
    );


  image.style.transform =
    "rotate(" +
    rotation +
    "deg) scale(" +
    zoom +
    ")";


  image.style.filter =
    currentFilter;

}


/* =========================
ROTATE
========================= */

function rotatePhoto() {

  rotation += 90;


  if (
    rotation >= 360
  ) {

    rotation = 0;

  }


  applyPreview();

}


/* =========================
ZOOM
========================= */

function zoomIn() {

  zoom += 0.1;


  if (
    zoom > 2
  ) {

    zoom = 2;

  }


  applyPreview();

}


function zoomOut() {

  zoom -= 0.1;


  if (
    zoom < 0.5
  ) {

    zoom = 0.5;

  }


  applyPreview();

}


/* =========================
FILTER
========================= */

function setFilter(filter) {

  currentFilter =
    filter;

  applyPreview();

}


/* =========================
RESET
========================= */

function resetPhoto() {

  rotation = 0;
  zoom = 1;
  currentFilter = "none";

  applyPreview();

}


/* =========================
CROP
========================= */

function startCrop() {

  document.getElementById(
    "cropTools"
  ).style.display =
    "flex";

}


function cancelCrop() {

  document.getElementById(
    "cropTools"
  ).style.display =
    "none";

}


function cropPhoto(ratio) {

  if (!originalImage) {

    alert(
      "⚠️ Select a photo first."
    );

    return;

  }


  const canvas =
    document.getElementById(
      "editCanvas"
    );


  const ctx =
    canvas.getContext("2d");


  let width =
    originalImage.width;

  let height =
    originalImage.height;


  const originalRatio =
    width / height;


  let cropWidth;
  let cropHeight;


  if (
    originalRatio > ratio
  ) {

    cropHeight =
      height;

    cropWidth =
      height * ratio;

  } else {

    cropWidth =
      width;

    cropHeight =
      width / ratio;

  }


  const x =
    (width - cropWidth) / 2;

  const y =
    (height - cropHeight) / 2;


  canvas.width =
    cropWidth;

  canvas.height =
    cropHeight;


  ctx.drawImage(

    originalImage,

    x,
    y,
    cropWidth,
    cropHeight,

    0,
    0,
    cropWidth,
    cropHeight

  );


  canvas.toBlob(

    function(blob) {

      if (!blob) {
        return;
      }


      selectedMedia =
        new File(

          [blob],

          "edited-photo.jpg",

          {
            type:
              "image/jpeg"
          }

        );


      const url =
        URL.createObjectURL(
          selectedMedia
        );


      originalImage =
        new Image();


      originalImage.onload =
        function() {

          rotation = 0;
          zoom = 1;

          applyPreview();

        };


      originalImage.src =
        url;


      document.getElementById(
        "preview"
      ).src =
        url;


      document.getElementById(
        "cropTools"
      ).style.display =
        "none";


      document.getElementById(
        "message"
      ).textContent =
        "✅ Crop applied.";

    },

    "image/jpeg",

    0.92

  );

}


/* =========================
CHANGE MEDIA
========================= */

function changeMedia() {

  document.getElementById(
    "mediaInput"
  ).click();

}


/* =========================
POST STORAGE
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "posts"
      ) || "[]"
    );

  } catch(error) {

    return [];

  }

}


function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
FILE TO DATA URL
========================= */

function fileToDataURL(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          resolve(
            event.target.result
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
CREATE EDITED PHOTO
========================= */

function createEditedImage() {

  return new Promise(
    function(resolve) {

      if (!originalImage) {

        resolve(null);

        return;

      }


      const canvas =
        document.getElementById(
          "editCanvas"
        );


      const ctx =
        canvas.getContext("2d");


      const width =
        originalImage.width;

      const height =
        originalImage.height;


      const angle =
        rotation *
        Math.PI /
        180;


      const sin =
        Math.abs(
          Math.sin(angle)
        );


      const cos =
        Math.abs(
          Math.cos(angle)
        );


      const newWidth =
        width * cos +
        height * sin;


      const newHeight =
        width * sin +
        height * cos;


      canvas.width =
        newWidth;


      canvas.height =
        newHeight;


      ctx.save();


      ctx.translate(

        canvas.width / 2,

        canvas.height / 2

      );


      ctx.rotate(angle);


      ctx.filter =
        currentFilter;


      ctx.drawImage(

        originalImage,

        -width / 2,

        -height / 2,

        width,

        height

      );


      ctx.restore();


      canvas.toBlob(

        function(blob) {

          resolve(blob);

        },

        "image/jpeg",

        0.92

      );

    }
  );

}


/* =========================
PUBLISH
========================= */

async function publishPost() {

  const text =
    document
      .getElementById(
        "postText"
      )
      .value
      .trim();


  const message =
    document.getElementById(
      "message"
    );


  if (
    text === "" &&
    !selectedMedia
  ) {

    message.textContent =
      "⚠️ Write a caption or select media.";

    return;

  }


  message.textContent =
    "⏳ Preparing post...";


  const posts =
    getPosts();


  const username =
    localStorage.getItem(
      "username"
    ) ||
    "You";


  const profileImage =
    localStorage.getItem(
      "profileImage"
    ) ||
    null;


  /* =========================
  SAVE SOUND
  ========================= */

  let soundData =
    null;


  if (selectedSound) {

    try {

      soundData =
        await fileToDataURL(
          selectedSound
        );

    } catch(error) {

      message.textContent =
        "⚠️ Could not save sound.";

      return;

    }

  }


  /* =========================
  TEXT ONLY
  ========================= */

  if (!selectedMedia) {

    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: null,

      mediaType: null,

      sound: soundData,

      soundType:
        selectedSound
          ? selectedSound.type
          : null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });


    savePosts(posts);

    finish();

    return;

  }


  /* =========================
  VIDEO
  ========================= */

  if (
    selectedMedia.type.startsWith(
      "video/"
    )
  ) {

    if (
      selectedMedia.size >
      20 * 1024 * 1024
    ) {

      message.textContent =
        "⚠️ Reel must be under 20 MB.";

      return;

    }


    try {

      const videoData =
        await fileToDataURL(
          selectedMedia
        );


      posts.unshift({

        id: Date.now(),

        username: username,

        profileImage: profileImage,

        text: text,

        media: videoData,

        mediaType:
          selectedMedia.type,

        sound: soundData,

        soundType:
          selectedSound
            ? selectedSound.type
            : null,

        liked: false,

        likeCount: 0,

        comments: [],

        createdAt: Date.now()

      });


      savePosts(posts);

      finish();

    } catch(error) {

      message.textContent =
        "⚠️ Could not save Reel.";

    }


    return;

  }


  /* =========================
  PHOTO
  ========================= */

  message.textContent =
    "⏳ Saving edited photo...";


  const editedBlob =
    await createEditedImage();


  if (!editedBlob) {

    message.textContent =
      "⚠️ Could not create edited photo.";

    return;

  }


  try {

    const photoData =
      await fileToDataURL(
        editedBlob
      );


    posts.unshift({

      id: Date.now(),

      username: username,

      profileImage: profileImage,

      text: text,

      media: photoData,

      mediaType: "image/jpeg",

      sound: soundData,

      soundType:
        selectedSound
          ? selectedSound.type
          : null,

      liked: false,

      likeCount: 0,

      comments: [],

      createdAt: Date.now()

    });


    savePosts(posts);

    finish();

  } catch(error) {

    message.textContent =
      "⚠️ Photo or sound is too large for browser storage.";

  }

}


/* =========================
FINISH
========================= */

function finish() {

  document.getElementById(
    "message"
  ).textContent =
    "✅ Published successfully!";


  setTimeout(

    function() {

      window.location.href =
        "index.html";

    },

    700

  );

}

</script></body>
  </html>
