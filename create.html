<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create - AI Social</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:30px;
}

header{
  background:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #ddd;
}

header button{
  border:none;
  background:none;
  font-size:28px;
}

header h1{
  font-size:20px;
}

.container{
  padding:18px;
}

textarea{
  width:100%;
  height:110px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:16px;
  resize:none;
  background:white;
}

/* FILE BUTTON */

.file-label{
  display:block;
  margin-top:15px;
  padding:16px;
  background:white;
  border:1px solid #ddd;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

#mediaInput,
#soundInput{
  display:none;
}

/* PREVIEW */

.preview-title{
  margin-top:18px;
  font-weight:bold;
  font-size:17px;
}

.preview-box{
  margin-top:10px;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  text-align:center;
  min-height:10px;
}

#preview{
  width:100%;
  max-height:600px;
  object-fit:contain;
  display:none;
}

#videoPreview{
  width:100%;
  max-height:600px;
  display:none;
}

/* SOUND */

.sound-box{
  margin-top:15px;
  background:white;
  padding:15px;
  border-radius:15px;
  display:none;
}

.sound-title{
  font-weight:bold;
  margin-bottom:10px;
}

#soundName{
  font-size:14px;
  color:#666;
  margin-bottom:10px;
  word-break:break-word;
}

#soundPreview{
  width:100%;
}

.remove-sound-button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:20px;
  background:white;
  color:red;
  font-weight:bold;
}

/* TOOLS */

.edit-tools,
.filters,
.crop-tools{
  display:none;
  margin-top:12px;
  gap:8px;
  flex-wrap:wrap;
}

.edit-tools button,
.filters button,
.crop-tools button{
  border:1px solid #ddd;
  background:white;
  padding:10px 13px;
  border-radius:20px;
  cursor:pointer;
}

.change-button{
  display:none;
  width:100%;
  margin-top:10px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  font-size:15px;
}

.post-button{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

/* FINAL PREVIEW */

.final-preview{
  display:none;
  margin-top:15px;
  background:white;
  padding:12px;
  border-radius:15px;
}

.final-preview-title{
  font-weight:bold;
  margin-bottom:10px;
}

#finalCanvas{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#000;
  border-radius:12px;
  display:block;
}

#editCanvas{
  display:none;
}
</style>
</head>

<body>

<header>
  <button onclick="goHome()">←</button>
  <h1>➕ Create Post</h1>
</header>

<div class="container">

<textarea
  id="postText"
  placeholder="Write a caption..."
></textarea>


<!-- PHOTO / VIDEO -->

<button
  type="button"
  class="file-label"
  onclick="document.getElementById('mediaInput').click()"
>
📸 Select Photo or 🎥 Reel
</button>

<input
  id="mediaInput"
  type="file"
  accept="image/*,video/*"
  style="display:none"
  onchange="selectMedia(event)"
>

<!-- SOUND -->

<button
  type="button"
  class="file-label"
  onclick="document.getElementById('soundInput').click()"
>
🎵 Add Sound / Music
</button>

<input
  id="soundInput"
  type="file"
  accept="audio/*"
  onchange="selectSound(event)"
>


<!-- SOUND PREVIEW -->

<div class="sound-box" id="soundBox">

  <div class="sound-title">
    🎵 Sound Preview
  </div>

  <div id="soundName"></div>

  <audio
    id="soundPreview"
    controls
  ></audio>

  <button
    class="remove-sound-button"
    onclick="removeSound()"
  >
    ❌ Remove Sound
  </button>

</div>


<!-- ORIGINAL / LIVE PREVIEW -->

<div class="preview-title" id="previewTitle" style="display:none;">
  👀 Preview
</div>

<div class="preview-box">

  <img
    id="preview"
    alt="Photo preview"
  >

  <video
    id="videoPreview"
    controls
    playsinline
  ></video>

</div>


<!-- EDIT TOOLS -->

<div class="edit-tools" id="editTools">

  <button onclick="rotatePhoto()">
    🔄 Rotate
  </button>

  <button onclick="zoomIn()">
    🔍 Zoom +
  </button>

  <button onclick="zoomOut()">
    🔎 Zoom -
  </button>

  <button onclick="startCrop()">
    ✂️ Crop
  </button>

  <button onclick="resetPhoto()">
    ↩️ Reset
  </button>

</div>


<!-- CROP -->

<div class="crop-tools" id="cropTools">

  <button onclick="cropPhoto(1)">
    🔲 Square
  </button>

  <button onclick="cropPhoto(0.8)">
    📱 Portrait
  </button>

  <button onclick="cropPhoto(16/9)">
    🖼️ Landscape
  </button>

  <button onclick="cancelCrop()">
    ❌ Cancel
  </button>

</div>


<!-- FILTERS -->

<div class="filters" id="filters">

  <button onclick="setFilter('none')">
    Normal
  </button>

  <button onclick="setFilter('grayscale(1)')">
    ⚫ B&W
  </button>

  <button onclick="setFilter('sepia(1)')">
    🟤 Sepia
  </button>

  <button onclick="setFilter('brightness(1.3)')">
    ☀️ Bright
  </button>

  <button onclick="setFilter('contrast(1.4)')">
    ✨ Contrast
  </button>

</div>


<!-- FINAL EDITED PREVIEW -->

<div
  class="final-preview"
  id="finalPreview"
>

  <div class="final-preview-title">
    ✅ Final Photo — This is what will be published
  </div>

  <canvas id="finalCanvas"></canvas>

</div>


<button
  class="change-button"
  id="changeButton"
  onclick="changeMedia()"
>
🔄 Change Photo / Video
</button>


<button
  class="post-button"
  onclick="publishPost()"
>
📤 Publish
</button>


<p id="message" class="message"></p>

<canvas id="editCanvas"></canvas>

</div>
