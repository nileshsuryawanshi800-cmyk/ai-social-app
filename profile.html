<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:21px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:50;
}

.profile{
  background:white;
  padding:25px 20px;
  text-align:center;
}

.profile-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.username{
  margin-top:12px;
  font-size:23px;
  font-weight:bold;
}

.bio{
  margin-top:8px;
  color:#666;
  font-size:15px;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
}

.stat span{
  color:#777;
  font-size:14px;
}

.profile-button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.edit-button{
  border:none;
  background:#111;
  color:white;
}

.account-button{
  border:1px solid #ddd;
  background:white;
  color:#111;
}

.posts-title{
  padding:20px;
  font-size:19px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-header{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  flex-shrink:0;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-name{
  font-size:18px;
  font-weight:bold;
}

.post-text{
  padding:0 15px 15px;
  font-size:17px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#000;
  display:block;
}

.sound-box{
  padding:12px 15px;
  border-top:1px solid #eee;
}

.sound-title{
  font-weight:bold;
  margin-bottom:7px;
}

.sound-box audio{
  width:100%;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.actions button{
  border:none;
  background:#f1f1f1;
  border-radius:25px;
  padding:14px 5px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.actions button:active{
  transform:scale(.96);
}

.comments{
  padding:0 15px 12px;
}

.comment{
  background:#f5f5f5;
  padding:9px 12px;
  border-radius:12px;
  margin-top:7px;
  word-break:break-word;
}

.delete-button{
  width:calc(100% - 24px);
  margin:0 12px 14px;
  border:1px solid #ffdddd;
  background:#fff5f5;
  color:red;
  border-radius:25px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 20px;
}

/* NAVIGATION */

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:500;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
  cursor:pointer;
}

/* ACCOUNT POPUP */

#accountBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:20px;
  overflow-y:auto;
}

.account-panel{
  background:white;
  border-radius:20px;
  padding:20px;
  max-width:500px;
  margin:50px auto;
}

.account-panel h2{
  margin-top:0;
  text-align:center;
}

.account-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid #eee;
  border-radius:15px;
  margin-top:10px;
  cursor:pointer;
}

.account-row.active{
  border:2px solid #111;
}

.account-photo{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.account-default{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex-shrink:0;
}

.account-name{
  font-weight:bold;
  font-size:17px;
}

.account-username{
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.active-label{
  margin-left:auto;
  font-size:12px;
  font-weight:bold;
}

.new-account{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.close-account{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
}

/* EDIT PROFILE */

#editBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:1500;
  padding:20px;
  overflow-y:auto;
}

.edit-panel{
  background:white;
  max-width:500px;
  margin:30px auto;
  padding:22px;
  border-radius:22px;
}

.edit-panel h2{
  margin-top:0;
  text-align:center;
}

.edit-photo-area{
  text-align:center;
  margin-bottom:20px;
}

.edit-photo-preview{
  width:150px;
  height:150px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  margin:15px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.edit-photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
}

.photo-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.photo-buttons button{
  border:none;
  background:#eee;
  padding:11px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.choose-photo{
  width:100%;
  padding:13px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-weight:bold;
  font-size:15px;
  margin-bottom:10px;
  cursor:pointer;
}

.edit-label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

.edit-input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.edit-textarea{
  width:100%;
  min-height:100px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  resize:vertical;
}

.save-edit{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancel-edit{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  font-size:15px;
  cursor:pointer;
}

.photo-status{
  font-size:13px;
  color:#777;
  margin-top:8px;
}

</style>
</head>

<body>

<header>
👤 Profile

AI Social User

Welcome to my AI Social profile 🚀
</div>

</div>

<div class="stat">
<strong>0</strong>

<div class="stat">

<span>Following</span>

</div>

<button
class="profile-button edit-button"
onclick="editProfile()">
✏️ Edit Profile

></textarea>

➕ Create New Account

</div>
</div>


<!-- NAVIGATION -->

<nav>

🏠<br>Home
</button>

🔍<br>Search
</button>

➕<br>Create
</button>

🤖<br>AI
</button>

👤<br>Profile
</button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}


/* =========================
ACCOUNTS
========================= */

function getAccounts(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem("accounts") || "[]"
      );

    return Array.isArray(data) ? data : [];

  }catch(error){

    return [];

  }

}

function saveAccounts(accounts){

  localStorage.setItem(
    "accounts",
    JSON.stringify(accounts)
  );

}


function getActiveAccount(){

  const accounts =
    getAccounts();

  if(accounts.length === 0){
    return null;
  }

  let activeId =
    localStorage.getItem("activeAccountId");

  let account =
    accounts.find(function(item){

      return String(item.id) ===
        String(activeId);

    });

  if(!account){

    account = accounts[0];

    localStorage.setItem(
      "activeAccountId",
      String(account.id)
    );

  }

  return account;

}


/* =========================
SYNC OLD STORAGE
========================= */

function syncLegacyData(account){

  if(!account){
    return;
  }

  localStorage.setItem(
    "username",
    account.username || ""
  );

  localStorage.setItem(
    "bio",
    account.bio || ""
  );

  localStorage.setItem(
    "profileImage",
    account.profileImage || ""
  );

  localStorage.setItem(
    "posts",
    JSON.stringify(
      Array.isArray(account.posts)
        ? account.posts
        : []
    )
  );

}


/* =========================
MIGRATE OLD POSTS
========================= */

function migrateOldPosts(account){

  if(!account){
    return;
  }

  if(!Array.isArray(account.posts)){
    account.posts=[];
  }

  /*
    If old create.html saved posts
    in localStorage["posts"], bring
    them into this account once.
  */

  let oldPosts=[];

  try{

    oldPosts =
      JSON.parse(
        localStorage.getItem("posts") || "[]"
      );

  }catch(error){

    oldPosts=[];

  }

  if(
    account.posts.length === 0 &&
    Array.isArray(oldPosts) &&
    oldPosts.length > 0
  ){

    account.posts =
      oldPosts.map(function(post){

        return {
          ...post,
          username:
            account.username ||
            post.username ||
            "AI Social User",

          profileImage:
            account.profileImage ||
            post.profileImage ||
            ""
        };

      });

    const accounts =
      getAccounts();

    const index =
      accounts.findIndex(function(item){

        return String(item.id) ===
          String(account.id);

      });

    if(index !== -1){

      accounts[index].posts =
        account.posts;

      saveAccounts(accounts);

    }

  }

}


/* =========================
PROFILE PHOTO
========================= */

function showProfilePhoto(){

  const account =
    getActiveAccount();

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("profileIcon");

  if(
    account &&
    account.profileImage
  ){

    image.src =
      account.profileImage;

    image.style.display =
      "block";

    icon.style.display =
      "none";

  }else{

    image.removeAttribute("src");

    image.style.display =
      "none";

    icon.style.display =
      "block";

  }

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile(){

  const account =
    getActiveAccount();

  if(!account){

    document.getElementById("username")
      .textContent="No Account";

    document.getElementById("bio")
      .textContent=
      "Create an account to get started.";

    document.getElementById("postCount")
      .textContent="0";

    document.getElementById("myPosts")
      .innerHTML=
      '<div class="empty">' +
      'No account yet.<br><br>' +
      'Tap Switch / New Account to create one 🚀' +
      '</div>';

    return;

  }

  migrateOldPosts(account);

  if(!Array.isArray(account.posts)){
    account.posts=[];
  }

  syncLegacyData(account);

  document.getElementById("username")
    .textContent=
    account.username || "AI Social User";

  document.getElementById("bio")
    .textContent=
    account.bio ||
    "Welcome to my AI Social profile 🚀";

  showProfilePhoto();

  document.getElementById("postCount")
    .textContent=
    account.posts.length;

  const box =
    document.getElementById("myPosts");

  box.innerHTML="";

  if(account.posts.length === 0){

    box.innerHTML=
      '<div class="empty">' +
      'No posts yet.<br><br>' +
      'Tap ➕ Create to make your first post 📸' +
      '</div>';

    return;

  }

  account.posts.forEach(
    function(postData,index){

      createPost(
        postData,
        index,
        account.posts,
        box
      );

    }
  );

}


/* =========================
CREATE POST
========================= */

function createPost(
  postData,
  index,
  posts,
  box
){

  const account =
    getActiveAccount();

  const post =
    document.createElement("div");

  post.className="post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className="post-header";


  const avatar =
    document.createElement("div");

  avatar.className="post-avatar";


  const photo =
    postData.profileImage ||
    account?.profileImage ||
    "";

  if(photo){

    const img =
      document.createElement("img");

    img.src=photo;

    avatar.appendChild(img);

  }else{

    avatar.textContent="👤";

  }


  const name =
    document.createElement("div");

  name.className="post-name";

  name.textContent =
    postData.username ||
    account?.username ||
    "AI Social User";


  header.appendChild(avatar);
  header.appendChild(name);

  post.appendChild(header);


  /* TEXT */

  if(postData.text){

    const text =
      document.createElement("div");

    text.className="post-text";

    text.textContent =
      postData.text;

    post.appendChild(text);

  }


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    const type =
      postData.mediaType.toLowerCase();


    if(type.startsWith("image/")){

      const image =
        document.createElement("img");

      image.className="post-media";

      image.src =
        postData.media;

      image.alt =
        "Published photo";

      post.appendChild(image);

    }


    if(type.startsWith("video/")){

      const video =
        document.createElement("video");

      video.className="post-media";

      video.src =
        postData.media;

      video.controls=true;
      video.playsInline=true;

      post.appendChild(video);

    }

  }


  /* SOUND */

  if(postData.sound){

    const soundBox =
      document.createElement("div");

    soundBox.className="sound-box";


    const title =
      document.createElement("div");

    title.className="sound-title";

    title.textContent="🎵 Sound";


    const audio =
      document.createElement("audio");

    audio.controls=true;

    audio.src =
      postData.sound;


    soundBox.appendChild(title);
    soundBox.appendChild(audio);

    post.appendChild(soundBox);

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className="actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");


  function updateLike(){

    const count =
      Number(postData.likeCount) || 0;

    likeButton.textContent =
      postData.liked
        ? "❤️ Liked " + count
        : "🤍 Like " + count;

  }

  updateLike();


  likeButton.onclick =
    function(){

      postData.liked =
        postData.liked !== true;

      if(postData.liked){

        postData.likeCount =
          (Number(postData.likeCount)||0)+1;

      }else{

        postData.likeCount =
          Math.max(
            0,
            (Number(postData.likeCount)||0)-1
          );

      }

      saveCurrentAccountPosts();

      updateLike();

    };


  /* COMMENT */

  const commentButton =
    document.createElement("button");

  commentButton.textContent=
    "💬 Comment";


  commentButton.onclick =
    function(){

      const comment =
        prompt("Write your comment:");

      if(
        comment === null ||
        comment.trim() === ""
      ){

        return;

      }

      if(!Array.isArray(postData.comments)){
        postData.comments=[];
      }

      postData.comments.push(
        comment.trim()
      );

      saveCurrentAccountPosts();

      loadProfile();

    };


  /* SHARE */

  const shareButton =
    document.createElement("button");

  shareButton.textContent=
    "↗️ Share";


  shareButton.onclick =
    function(){

      sharePost(postData);

    };


  actions.appendChild(likeButton);
  actions.appendChild(commentButton);
  actions.appendChild(shareButton);

  post.appendChild(actions);


  /* COMMENTS */

  const commentsBox =
    document.createElement("div");

  commentsBox.className="comments";


  if(Array.isArray(postData.comments)){

    postData.comments.forEach(
      function(comment){

        const item =
          document.createElement("div");

        item.className="comment";

        item.textContent=
          "💬 " + comment;

        commentsBox.appendChild(item);

      }
    );

  }

  post.appendChild(commentsBox);


  /* DELETE */

  const deleteButton =
    document.createElement("button");

  deleteButton.className=
    "delete-button";

  deleteButton.textContent=
    "🗑️ Delete Post";


  deleteButton.onclick =
    function(){

      if(!confirm(
        "Are you sure you want to delete this post?"
      )){

        return;

      }

      posts.splice(index,1);

      saveCurrentAccountPosts();

      loadProfile();

    };


  post.appendChild(deleteButton);

  box.appendChild(post);

}


/* =========================
SAVE POSTS
========================= */

function saveCurrentAccountPosts(){

  const account =
    getActiveAccount();

  if(!account){
    return;
  }

  const accounts =
    getAccounts();

  const index =
    accounts.findIndex(function(it
