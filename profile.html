<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

/* HEADER */

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:21px;
  font-weight:bold;
}

/* PROFILE */

.profile{
  background:white;
  padding:25px 20px;
  text-align:center;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.username{
  margin-top:12px;
  font-size:23px;
  font-weight:bold;
}

.bio{
  margin-top:8px;
  color:#666;
  font-size:15px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
}

.stat span{
  color:#777;
  font-size:14px;
}

/* BUTTONS */

.profile-button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.edit-button{
  border:none;
  background:#111;
  color:white;
}

.account-button{
  border:1px solid #ddd;
  background:white;
  color:#111;
}

/* POSTS */

.posts-title{
  padding:20px;
  font-size:19px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* POST HEADER */

.post-header{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  flex-shrink:0;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-name{
  font-size:18px;
  font-weight:bold;
}

/* TEXT */

.post-text{
  padding:0 15px 15px;
  font-size:17px;
  white-space:pre-wrap;
  word-break:break-word;
}

/* MEDIA */

.post-media{
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#000;
  display:block;
}

/* SOUND */

.sound-box{
  padding:12px 15px;
  border-top:1px solid #eee;
}

.sound-title{
  font-weight:bold;
  margin-bottom:7px;
}

.sound-box audio{
  width:100%;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.actions button{
  border:none;
  background:#f1f1f1;
  border-radius:25px;
  padding:14px 5px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.actions button:active{
  transform:scale(.96);
}

/* COMMENTS */

.comments{
  padding:0 15px 12px;
}

.comment{
  background:#f5f5f5;
  padding:9px 12px;
  border-radius:12px;
  margin-top:7px;
}

/* DELETE */

.delete-button{
  width:calc(100% - 24px);
  margin:0 12px 14px;
  border:1px solid #ffdddd;
  background:#fff5f5;
  color:red;
  border-radius:25px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#777;
  padding:35px 20px;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
  cursor:pointer;
}

/* ACCOUNT POPUP */

#accountBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:25px;
}

.account-panel{
  background:white;
  border-radius:20px;
  padding:20px;
  max-width:500px;
  margin:80px auto;
}

.account-panel h2{
  margin-top:0;
}

.account-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid #eee;
  border-radius:15px;
  margin-top:10px;
  cursor:pointer;
}

.account-photo{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.close-account{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
}

</style>

</head>

<body>

<header>
👤 Profile
</header>


<!-- PROFILE -->

<section class="profile">

<div class="profile-avatar">

<img
id="profileImage"
alt="Profile photo"
>

</div>


<div
class="username"
id="username">
astryx.soul12
</div>


<div
class="bio"
id="bio">
Welcome to my AI Social profile 🚀
</div>


<div class="stats">

<div class="stat">
<strong id="postCount">0</strong>
<span>Posts</span>
</div>

<div class="stat">
<strong>0</strong>
<span>Followers</span>
</div>

<div class="stat">
<strong>0</strong>
<span>Following</span>
</div>

</div>


<button
class="profile-button edit-button"
onclick="editProfile()">
✏️ Edit Profile
</button>


<button
class="profile-button account-button"
onclick="openAccounts()">
🔄 Switch / New Account
</button>

</section>


<div class="posts-title">
📸 My Posts
</div>


<div id="myPosts"></div>


<!-- ACCOUNT POPUP -->

<div id="accountBox">

<div class="account-panel">

<h2>👤 Accounts</h2>

<div id="accountList"></div>

<button
class="close-account"
onclick="closeAccounts()">
Close
</button>

</div>

</div>


<!-- NAVIGATION -->

<nav>

<button onclick="goHome()">
🏠<br>Home
</button>

<button onclick="goSearch()">
🔍<br>Search
</button>

<button onclick="goCreate()">
➕<br>Create
</button>

<button onclick="goAI()">
🤖<br>AI
</button>

<button onclick="goProfile()">
👤<br>Profile
</button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}


/* =========================
PROFILE PHOTO
========================= */

function showProfilePhoto(){

  const image =
    document.getElementById("profileImage");

  const saved =
    localStorage.getItem("profileImage");

  if(saved){

    image.src=saved;

  }else{

    image.removeAttribute("src");

  }

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile(){

  /*
    OLD PROFILE ID

    We display your original ID here.
    Your posts are NOT deleted.
  */

  const name =
    "astryx.soul12";


  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "username"
  ).textContent=name;


  document.getElementById(
    "bio"
  ).textContent=bio;


  showProfilePhoto();


  /* =========================
     GET EXISTING POSTS
  ========================= */

  let posts=[];

  try{

    posts=JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  }catch(error){

    posts=[];

  }


  document.getElementById(
    "postCount"
  ).textContent=posts.length;


  const box =
    document.getElementById("myPosts");

  box.innerHTML="";


  if(posts.length===0){

    box.innerHTML=
      '<div class="empty">'+
      'No posts yet.<br>'+
      'Create your first post 📸'+
      '</div>';

    return;

  }


  posts.forEach(
    function(postData,index){

      createPost(
        postData,
        index,
        posts,
        box
      );

    }
  );

}


/* =========================
CREATE POST
========================= */

function createPost(
  postData,
  index,
  posts,
  box
){

  const post =
    document.createElement("div");

  post.className="post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className="post-header";


  const avatar =
    document.createElement("div");

  avatar.className="post-avatar";


  const photo =
    postData.profileImage ||
    localStorage.getItem("profileImage") ||
    "";


  if(photo){

    const img =
      document.createElement("img");

    img.src=photo;

    avatar.appendChild(img);

  }else{

    avatar.textContent="👤";

  }


  const name =
    document.createElement("div");

  name.className="post-name";

  /*
    Use original username for
    old posts if they were created
    before the account change.
  */

  name.textContent =
    "astryx.soul12";


  header.appendChild(avatar);
  header.appendChild(name);

  post.appendChild(header);


  /* TEXT */

  if(postData.text){

    const text =
      document.createElement("div");

    text.className="post-text";

    text.textContent=
      postData.text;

    post.appendChild(text);

  }


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    const type =
      postData.mediaType.toLowerCase();


    if(type.startsWith("image/")){

      const image =
        document.createElement("img");

      image.className="post-media";

      image.src=
        postData.media;

      image.alt=
        "Published photo";

      post.appendChild(image);

    }


    if(type.startsWith("video/")){

      const video =
        document.createElement("video");

      video.className="post-media";

      video.src=
        postData.media;

      video.controls=true;

      video.playsInline=true;

      post.appendChild(video);

    }

  }


  /* SOUND */

  if(postData.sound){

    const soundBox =
      document.createElement("div");

    soundBox.className=
      "sound-box";


    const soundTitle =
      document.createElement("div");

    soundTitle.className=
      "sound-title";

    soundTitle.textContent=
      "🎵 Sound";


    const audio =
      document.createElement("audio");

    audio.controls=true;

    audio.src=
      postData.sound;


    soundBox.appendChild(
      soundTitle
    );

    soundBox.appendChild(
      audio
    );


    post.appendChild(
      soundBox
    );

  }


  /* =========================
     ACTIONS
  ========================= */

  const actions =
    document.createElement("div");

  actions.className="actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");


  function updateLike(){

    const count =
      Number(postData.likeCount)||0;


    likeButton.textContent =
      postData.liked
      ? "❤️ Liked " + count
      : "🤍 Like " + count;

  }


  updateLike();


  likeButton.onclick=function(){

    postData.liked =
      postData.liked !== true;


    if(postData.liked){

      postData.likeCount =
        (Number(postData.likeCount)||0)+1;

    }else{

      postData.likeCount =
        Math.max(
          0,
          (Number(postData.likeCount)||0)-1
        );

    }


    savePosts(posts);

    updateLike();

  };


  /* COMMENT */

  const commentButton =
    document.createElement("button");

  commentButton.textContent=
    "💬 Comment";


  commentButton.onclick=function(){

    const comment =
      prompt(
        "Write your comment:"
      );


    if(
      comment===null ||
      comment.trim()===""
    ){

      return;

    }


    if(
      !Array.isArray(
        postData.comments
      )
    ){

      postData.comments=[];

    }


    postData.comments.push(
      comment.trim()
    );


    savePosts(posts);

    loadProfile();

  };


  /* SHARE */

  const shareButton =
    document.createElement("button");

  shareButton.textContent=
    "↗️ Share";


  shareButton.onclick=function(){

    sharePost(postData);

  };


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );

  actions.appendChild(
    shareButton
  );


  post.appendChild(
    actions
  );


  /* =========================
     COMMENTS
  ========================= */

  const commentsBox =
    document.createElement("div");

  commentsBox.className=
    "comments";


  if(
    Array.isArray(
      postData.comments
    )
  ){

    postData.comments.forEach(
      function(comment){

        const item =
          document.createElement("div");

        item.className="comment";

        item.textContent=
          "💬 " + comment;

        commentsBox.appendChild(
          item
        );

      }
    );

  }


  post.appendChild(
    commentsBox
  );


  /* =========================
     DELETE
  ========================= */

  const deleteButton =
    document.createElement("button");

  deleteButton.className=
    "delete-button";

  deleteButton.textContent=
    "🗑️ Delete Post";


  deleteButton.onclick=function(){

    if(
      !confirm(
        "Are you sure you want to delete this post?"
      )
    ){

      return;

    }


    posts.splice(
      index,
      1
    );


    savePosts(posts);

    loadProfile();

  };


  post.appendChild(
    deleteButton
  );


  box.appendChild(
    post
  );

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts){

  /*
    IMPORTANT:
    Existing posts remain
    in localStorage.
  */

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
EDIT PROFILE
========================= */

function editProfile(){

  const oldName =
    "astryx.soul12";


  const oldBio =
    localStorage.getItem(
      "bio"
    ) ||
    "Welcome to my AI Social profile 🚀";


  const name =
    prompt(
      "Enter your username:",
      oldName
    );


  if(name===null)return;


  if(name.trim()===""){

    alert(
      "Username cannot be empty."
    );

    return;

  }


  const bio =
    prompt(
      "Enter your bio:",
      oldBio
    );


  if(bio===null)return;


  /*
    Keep your profile editable.
  */

  localStorage.setItem(
    "username",
    name.trim()
  );


  localStorage.setItem(
    "bio",
    bio.trim()
  );


  loadProfile();


  alert(
    "✅ Profile updated!"
  );

}


/* =========================
SHARE
========================= */

function sharePost(postData){

  const text =
    "astryx.soul12" +
    "\n\n" +
    (
      postData.text ||
      "Check out my post on AI Social!"
    );


  if(navigator.share){

    navigator.share({

      title:"AI Social",

      text:text,

      url:window.location.href

    });

    return;

  }


  if(navigator.clipboard){

    navigator.clipboard
      .writeText(text)
      .then(function(){

        alert(
          "✅ Post copied!"
        );

      });

    return;

  }


  alert(
    "Sharing is not supported."
  );

}


/* =========================
ACCOUNT LIST
========================= */

function getAccounts(){

  let accounts=[];

  try{

    accounts =
      JSON.parse(
        localStorage.getItem(
          "accounts"
        ) || "[]"
      );

  }catch(e){

    accounts=[];

  }


  return accounts;

}


/* =========================
OPEN ACCOUNTS
========================= */

function openAccounts(){

  const box =
    document.getElementById(
      "accountBox"
    );

  const list =
    document.getElementById(
      "accountList"
    );


  list.innerHTML="";


  /*
    Always show original account.
  */

  const oldRow =
    document.createElement(
      "div"
    );

  oldRow.className=
    "account-row";


  const oldImage =
    document.createElement(
      "img"
    );

  oldImage.className=
    "account-photo";


  const savedPhoto =
    localStorage.getItem(
      "profileImage"
    );


  if(savedPhoto){

    oldImage.src=
      savedPhoto;

  }


  const oldName =
    document.createElement(
      "strong"
    );

  oldName.textContent=
    "astryx.soul12";


  oldRow.appendChild(
    oldImage
  );

  oldRow.appendChild(
    oldName
  );


  oldRow.onclick=function(){

    localStorage.removeItem(
      "activeAccountId"
    );

    localStorage.setItem(
      "username",
      "astryx.soul12"
    );

    loadProfile();

    closeAccounts();

  };


  list.appendChild(
    oldRow
  );


  /* OTHER ACCOUNTS */

  const accounts =
    getAccounts();


  accounts.forEach(
    function(account){

      if(
        account.username ===
        "astryx.soul12"
      ){

        return;

      }


      const row =
        document.createElement(
          "div"
        );

      row.className=
        "account-row";


      const image =
        document.createElement(
          "img"
        );

      image.className=
        "account-photo";


      if(account.profileImage){

        image.src=
          account.profileImage;

      }


      const name =
        document.createElement(
          "strong"
        );

      name.textContent=
        account.username;


      row.appendChild(
        image
      );

      row.appendChild(
        name
      );


      row.onclick=function(){

        switchAccount(
          account
        );

      };


      list.appendChild(
        row
      );

    }
  );


  /* NEW ACCOUNT */

  const newButton =
    document.createElement(
      "button"
    );

  newButton.className=
    "profile-button account-button";

  newButton.textContent=
    "➕ Create New Account";


  newButton.onclick=function(){

    window.location.href=
      "signup.html";

  };


  list.appendChild(
    newButton
  );


  box.style.display=
    "block";

}


/* =========================
CLOSE ACCOUNTS
========================= */

function closeAccounts(){

  document.getElementById(
    "accountBox"
  ).style.display=
    "none";

}


/* =========================
SWITCH ACCOUNT
========================= */

function switchAccount(account){

  localStorage.setItem(
    "activeAccountId",
    String(account.id)
  );


  localStorage.setItem(
    "username",
    account.username
  );


  localStorage.setItem(
    "bio",
    account.bio || ""
  );


  localStorage.setItem(
    "profileImage",
    account.profileImage || ""
  );


  closeAccounts();

  loadProfile();

}


/* =========================
START
========================= */

loadProfile();

</script>

</body>

</html>
