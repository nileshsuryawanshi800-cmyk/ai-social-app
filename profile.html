/* =========================
   NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
   CHOOSE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


/* =========================
   PHOTO INPUT
========================= */

document
  .getElementById("photoInput")
  .addEventListener(
    "change",
    savePhoto
  );


/* =========================
   SAVE PHOTO
========================= */

function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert(
      "⚠️ Please select an image."
    );

    return;

  }


  /*
    Resize profile photos before saving.
    This prevents localStorage from filling
    too quickly.
  */

  const image =
    new Image();

  const url =
    URL.createObjectURL(file);


  image.onload =
    function() {

      const maxSize = 500;

      let width =
        image.naturalWidth;

      let height =
        image.naturalHeight;


      if (width > maxSize || height > maxSize) {

        const scale =
          Math.min(
            maxSize / width,
            maxSize / height
          );

        width =
          Math.round(width * scale);

        height =
          Math.round(height * scale);

      }


      const canvas =
        document.createElement("canvas");

      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      const imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.85
        );


      try {

        localStorage.setItem(
          "profileImage",
          imageData
        );

        showProfilePhoto(
          imageData
        );

      } catch(error) {

        alert(
          "⚠️ Profile photo is too large. Please choose a smaller image."
        );

      }


      URL.revokeObjectURL(url);

    };


  image.src = url;

}


/* =========================
   SHOW PROFILE PHOTO
========================= */

function showProfilePhoto(imageData) {

  const image =
    document.getElementById(
      "profileImage"
    );

  const icon =
    document.getElementById(
      "avatarIcon"
    );


  image.src =
    imageData;

  image.style.display =
    "block";

  icon.style.display =
    "none";

}


/* =========================
   EDIT PROFILE
========================= */

function editProfile() {

  const currentUsername =
    localStorage.getItem(
      "username"
    ) ||
    "AI Social User";


  const currentBio =
    localStorage.getItem(
      "bio"
    ) ||
    "Welcome to my AI Social profile 🚀";


  const username =
    prompt(
      "Enter your username:",
      currentUsername
    );


  if (username === null) {
    return;
  }


  if (
    username.trim() === ""
  ) {

    alert(
      "⚠️ Username cannot be empty."
    );

    return;

  }


  const bio =
    prompt(
      "Enter your bio:",
      currentBio
    );


  if (bio === null) {
    return;
  }


  localStorage.setItem(
    "username",
    username.trim()
  );


  localStorage.setItem(
    "bio",
    bio.trim()
  );


  loadProfile();


  alert(
    "✅ Profile updated!"
  );

}


/* =========================
   GET POSTS
========================= */

function getPosts() {

  try {

    const data =
      localStorage.getItem(
        "posts"
      );

    if (!data) {
      return [];
    }


    const posts =
      JSON.parse(data);


    return Array.isArray(posts)
      ? posts
      : [];

  } catch(error) {

    return [];

  }

}


/* =========================
   LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem(
      "username"
    ) ||
    "AI Social User";


  const bio =
    localStorage.getItem(
      "bio"
    ) ||
    "Welcome to my AI Social profile 🚀";


  document
    .getElementById("username")
    .textContent =
    username;


  document
    .getElementById("bio")
    .textContent =
    bio;


  const savedPosts =
    getPosts();


  /*
    Only show posts belonging
    to the current username.
  */

  const myPosts =
    savedPosts.filter(
      function(post) {

        return (
          (post.username || "You") ===
          username
        );

      }
    );


  document
    .getElementById("postCount")
    .textContent =
    myPosts.length;


  const postsBox =
    document.getElementById(
      "myPosts"
    );


  postsBox.innerHTML = "";


  if (myPosts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Tap ➕ Create to make your first post! 📸' +
      '</div>';

  }


  myPosts.forEach(
    function(savedPost) {

      const post =
        document.createElement("div");

      post.className =
        "post";


      /* HEADER */

      const postHeader =
        document.createElement("div");

      postHeader.className =
        "post-header";


      const avatar =
        document.createElement("div");

      avatar.className =
        "post-avatar";


      const savedProfileImage =
        localStorage.getItem(
          "profileImage"
        );


      if (savedProfileImage) {

        const img =
          document.createElement("img");

        img.src =
          savedProfileImage;

        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          "👤";

      }


      const name =
        document.createElement("div");

      name.className =
        "post-username";

      name.textContent =
        username;


      postHeader.appendChild(
        avatar
      );

      postHeader.appendChild(
        name
      );


      post.appendChild(
        postHeader
      );


      /* TEXT */

      if (savedPost.text) {

        const text =
          document.createElement("div");

        text.className =
          "post-text";

        text.textContent =
          savedPost.text;

        post.appendChild(
          text
        );

      }


      /* IMAGE */

      if (
        savedPost.media &&
        savedPost.mediaType &&
        savedPost.mediaType.startsWith(
          "image/"
        )
      ) {

        const image =
          document.createElement("img");

        image.className =
          "post-media";

        image.src =
          savedPost.media;

        image.alt =
          "Post image";

        post.appendChild(
          image
        );

      }


      /* VIDEO */

      if (
        savedPost.media &&
        savedPost.mediaType &&
        savedPost.mediaType.startsWith(
          "video/"
        )
      ) {

        const video =
          document.createElement("video");

        video.className =
          "post-media";

        video.src =
          savedPost.media;

        video.controls =
          true;

        video.playsInline =
          true;

        post.appendChild(
          video
        );

      }


      /* ACTION INFO */

      const actions =
        document.createElement("div");

      actions.className =
        "post-actions";

      actions.textContent =
        "❤️ " +
        (Number(savedPost.likeCount) || 0) +
        "    💬 " +
        (
          Array.isArray(
            savedPost.comments
          )
          ? savedPost.comments.length
          : 0
        );


      post.appendChild(
        actions
      );


      postsBox.appendChild(
        post
      );

    }
  );


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem(
      "profileImage"
    );


  if (savedImage) {

    showProfilePhoto(
      savedImage
    );

  }

}


/* =========================
   START
========================= */

loadProfile();

</script></body></html>
