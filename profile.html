<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - AI Social</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:21px;
  font-weight:bold;
}

.profile{
  background:white;
  padding:25px 20px;
  text-align:center;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.username{
  margin-top:12px;
  font-size:22px;
  font-weight:bold;
}

.bio{
  margin-top:8px;
  color:#666;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{color:#777;font-size:14px}

.edit-button{
  margin-top:20px;
  padding:12px 28px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:16px;
}

.posts-title{
  padding:20px;
  font-size:18px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-header{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.post-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-text{
  padding:0 15px 15px;
  font-size:17px;
  white-space:pre-wrap;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#000;
  display:block;
}

.post-info{
  padding:12px 15px;
  border-top:1px solid #eee;
  font-size:15px;
}

.delete-button{
  width:100%;
  border:none;
  background:white;
  color:red;
  padding:13px;
  font-size:15px;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
}
</style>
</head>

<body>

<header>👤 Profile</header>

<section class="profile">

<div class="profile-avatar">
  <img id="profileImage">
  <span id="avatarIcon">👤</span>
</div>

<div class="username" id="username">AI Social User</div>

<div class="bio" id="bio">
Welcome to my AI Social profile 🚀
</div>

<div class="stats">
  <div class="stat">
    <strong id="postCount">0</strong>
    <span>Posts</span>
  </div>

  <div class="stat">
    <strong>0</strong>
    <span>Followers</span>
  </div>

  <div class="stat">
    <strong>0</strong>
    <span>Following</span>
  </div>
</div>

<button class="edit-button" onclick="editProfile()">
✏️ Edit Profile
</button>

</section>

<div class="posts-title">📸 My Posts</div>

<div id="myPosts"></div>

<nav>
<button onclick="goHome()">🏠<br>Home</button>
<button onclick="goSearch()">🔍<br>Search</button>
<button onclick="goCreate()">➕<br>Create</button>
<button onclick="goAI()">🤖<br>AI</button>
<button onclick="goProfile()">👤<br>Profile</button>
</nav>

<script>

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}


/* EDIT PROFILE */

function editProfile(){

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const name =
    prompt("Enter your username:",oldName);

  if(name===null)return;

  if(name.trim()===""){
    alert("Username cannot be empty.");
    return;
  }

  const bio =
    prompt("Enter your bio:",oldBio);

  if(bio===null)return;

  localStorage.setItem(
    "username",
    name.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  loadProfile();

  alert("✅ Profile updated!");
}


/* PROFILE PHOTO */

function showProfilePhoto(){

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");

  const saved =
    localStorage.getItem("profileImage");

  if(saved){

    image.src=saved;
    image.style.display="block";
    icon.style.display="none";

  }else{

    image.style.display="none";
    icon.style.display="block";

  }
}


/* LOAD PROFILE */

function loadProfile(){

  const name =
    localStorage.getItem("username") ||
    "AI Social User";

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById("username").textContent=name;
  document.getElementById("bio").textContent=bio;

  showProfilePhoto();


  let posts=[];

  try{

    posts=JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  }catch(e){

    posts=[];

  }


  document.getElementById("postCount").textContent=
    posts.length;

  const box =
    document.getElementById("myPosts");

  box.innerHTML="";


  if(posts.length===0){

    box.innerHTML=
      '<div class="empty">No posts yet.<br>Create your first post 📸</div>';

    return;
  }


  posts.forEach(function(postData,index){

    const post =
      document.createElement("div");

    post.className="post";


    /* POST HEADER */

    const header =
      document.createElement("div");

    header.className="post-header";


    const avatar =
      document.createElement("div");

    avatar.className="post-avatar";


    if(postData.profileImage){

      const img =
        document.createElement("img");

      img.src=postData.profileImage;

      avatar.appendChild(img);

    }else{

      avatar.textContent="👤";

    }


    const name =
      document.createElement("span");

    name.textContent=
      postData.username || "You";


    header.appendChild(avatar);
    header.appendChild(name);

    post.appendChild(header);


    /* TEXT */

    if(postData.text){

      const text =
        document.createElement("div");

      text.className="post-text";

      text.textContent=postData.text;

      post.appendChild(text);

    }


    /* PHOTO */

    if(
      postData.media &&
      postData.mediaType &&
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ){

      const image =
        document.createElement("img");

      image.className="post-media";

      image.src=postData.media;

      image.alt="Published photo";

      post.appendChild(image);

    }


    /* VIDEO */

    if(
      postData.media &&
      postData.mediaType &&
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ){

      const video =
        document.createElement("video");

      video.className="post-media";

      video.src=postData.media;

      video.controls=true;
      video.playsInline=true;

      post.appendChild(video);

    }


    /* DETAILS */

    const info =
      document.createElement("div");

    info.className="post-info";

    const likes =
      Number(postData.likeCount)||0;

    const comments =
      Array.isArray(postData.comments)
      ? postData.comments.length
      : 0;

    info.textContent=
      "❤️ Like " + likes +
      "    💬 Comment " + comments +
      "    ↗️ Share";

    post.appendChild(info);


    /* DELETE */

    const del =
      document.createElement("button");

    del.className="delete-button";

    del.textContent="🗑️ Delete Post";

    del.onclick=function(){

      if(
        confirm("Delete this post?")
      ){

        posts.splice(index,1);

        localStorage.setItem(
          "posts",
          JSON.stringify(posts)
        );

        loadProfile();

      }

    };

    post.appendChild(del);

    box.appendChild(post);

  });

}

loadProfile();

</script>

</body>
</html>
