<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

/* HEADER */

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:21px;
  font-weight:bold;
}

/* PROFILE */

.profile{
  background:white;
  padding:25px 20px;
  text-align:center;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.username{
  margin-top:12px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.bio{
  margin-top:8px;
  color:#666;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#777;
  font-size:14px;
}

.edit-button{
  margin-top:20px;
  padding:12px 28px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */

.posts-title{
  padding:20px;
  font-size:18px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* POST HEADER */

.post-header{
  padding:15px;
}

.profile-link{
  display:flex;
  align-items:center;
  gap:12px;
  width:fit-content;
  cursor:pointer;
}

.post-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:28px;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-username{
  font-size:18px;
  font-weight:bold;
}

/* TEXT */

.post-content{
  padding:0 15px 15px;
  font-size:17px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
  cursor:pointer;
}

/* MEDIA */

.post-media{
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#000;
  display:block;
  cursor:pointer;
}

/* SOUND */

.post-sound{
  padding:12px 15px;
  background:#fafafa;
  border-top:1px solid #eee;
}

.post-sound-title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

.post-sound audio{
  width:100%;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.actions button{
  border:none;
  background:#f2f2f2;
  border-radius:25px;
  padding:13px 5px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.actions button:active{
  transform:scale(.96);
}

/* COMMENTS */

.comments{
  padding:0 15px 12px;
}

.comment{
  background:#f5f5f5;
  padding:9px 12px;
  border-radius:12px;
  margin-top:7px;
}

.comment-name{
  font-weight:bold;
}

/* DELETE */

.delete-button{
  width:calc(100% - 24px);
  margin:0 12px 14px;
  border:1px solid #ffdddd;
  background:#fff5f5;
  color:red;
  border-radius:25px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px 20px;
  color:#777;
}

/* NAVIGATION */

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:500;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
}

/* LARGE POST VIEW */

#postViewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:2000;
  overflow-y:auto;
  padding:20px 10px;
}

.viewer-box{
  max-width:700px;
  margin:45px auto 30px;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

.viewer-close{
  position:fixed;
  top:12px;
  right:12px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:white;
  font-size:25px;
  z-index:2001;
}

.viewer-profile{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
}

.viewer-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.viewer-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.viewer-media{
  width:100%;
  max-height:75vh;
  object-fit:contain;
  background:#000;
}

.viewer-content{
  padding:16px;
  font-size:17px;
  white-space:pre-wrap;
}

.viewer-sound{
  padding:12px 16px;
  background:#fafafa;
}

.viewer-sound audio{
  width:100%;
}

.viewer-info{
  padding:14px 16px;
  border-top:1px solid #eee;
  font-size:15px;
}

</style>
</head>

<body>

<header>
👤 Profile
</header>


<!-- PROFILE -->

<section class="profile">

<div class="profile-avatar">

<img
id="profileImage"
alt="Profile Picture"
>

<span id="avatarIcon">👤</span>

</div>


<div
class="username"
id="username"
onclick="openMyProfile()"
>
AI Social User
</div>


<div
class="bio"
id="bio"
>
Welcome to my AI Social profile 🚀
</div>


<div class="stats">

<div class="stat">

<strong id="postCount">
0
</strong>

<span>
Posts
</span>

</div>


<div class="stat">

<strong>
0
</strong>

<span>
Followers
</span>

</div>


<div class="stat">

<strong>
0
</strong>

<span>
Following
</span>

</div>

</div>


<button
class="edit-button"
onclick="editProfile()"
>
✏️ Edit Profile
</button>

</section>


<div class="posts-title">
📸 My Posts
</div>


<div id="myPosts"></div>


<!-- LARGE POST VIEW -->

<div id="postViewer">

<button
class="viewer-close"
onclick="closePost()"
>
✕
</button>

<div
class="viewer-box"
id="viewerBox"
>
</div>

</div>


<!-- NAV -->

<nav>

<button onclick="goHome()">
🏠<br>Home
</button>

<button onclick="goSearch()">
🔍<br>Search
</button>

<button onclick="goCreate()">
➕<br>Create
</button>

<button onclick="goAI()">
🤖<br>AI
</button>

<button onclick="goProfile()">
👤<br>Profile
</button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}

function openMyProfile(){
  window.location.href="profile.html";
}


/* =========================
PROFILE EDIT
========================= */

function editProfile(){

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  const name =
    prompt(
      "Enter your username:",
      oldName
    );

  if(name===null){
    return;
  }

  if(name.trim()===""){

    alert(
      "Username cannot be empty."
    );

    return;
  }


  const bio =
    prompt(
      "Enter your bio:",
      oldBio
    );

  if(bio===null){
    return;
  }


  localStorage.setItem(
    "username",
    name.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );


  loadProfile();

  alert(
    "✅ Profile updated!"
  );

}


/* =========================
PROFILE PHOTO
========================= */

function showProfilePhoto(){

  const image =
    document.getElementById(
      "profileImage"
    );

  const icon =
    document.getElementById(
      "avatarIcon"
    );


  const saved =
    localStorage.getItem(
      "profileImage"
    );


  if(saved){

    image.src=saved;

    image.style.display=
      "block";

    icon.style.display=
      "none";

  }else{

    image.style.display=
      "none";

    icon.style.display=
      "block";

  }

}


/* =========================
GET POSTS
========================= */

function getPosts(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "posts"
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts){

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
USERNAME
========================= */

function getUsername(post){

  return(
    post.username ||
    localStorage.getItem(
      "username"
    ) ||
    "AI Social User"
  );

}


/* =========================
PROFILE IMAGE
========================= */

function getProfileImage(post){

  return(
    post.profileImage ||
    localStorage.getItem(
      "profileImage"
    ) ||
    ""
  );

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile(){

  const name =
    localStorage.getItem(
      "username"
    ) ||
    "AI Social User";

  const bio =
    localStorage.getItem(
      "bio"
    ) ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "username"
  ).textContent=name;

  document.getElementById(
    "bio"
  ).textContent=bio;


  showProfilePhoto();


  const posts =
    getPosts();


  document.getElementById(
    "postCount"
  ).textContent=
    posts.length;


  const box =
    document.getElementById(
      "myPosts"
    );

  box.innerHTML="";


  if(posts.length===0){

    box.innerHTML=
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Create your first post 📸' +
      '</div>';

    return;
  }


  posts.forEach(
    function(postData,index){

      createProfilePost(
        postData,
        index,
        posts,
        box
      );

    }
  );

}


/* =========================
CREATE PROFILE POST
========================= */

function createProfilePost(
  postData,
  index,
  posts,
  box
){

  const post =
    document.createElement(
      "div"
    );

  post.className="post";


  /* HEADER */

  const postHeader =
    document.createElement(
      "div"
    );

  postHeader.className=
    "post-header";


  const profileLink =
    document.createElement(
      "div"
    );

  profileLink.className=
    "profile-link";


  profileLink.onclick=
    function(event){

      event.stopPropagation();

      window.location.href=
        "profile.html";

    };


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className=
    "post-avatar";


  const profileImage =
    getProfileImage(
      postData
    );


  if(profileImage){

    const img =
      document.createElement(
        "img"
      );

    img.src=
      profileImage;

    avatar.appendChild(
      img
    );

  }else{

    avatar.textContent=
      "👤";

  }


  const username =
    document.createElement(
      "div"
    );

  username.className=
    "post-username";

  username.textContent=
    getUsername(
      postData
    );


  profileLink.appendChild(
    avatar
  );

  profileLink.appendChild(
    username
  );

  postHeader.appendChild(
    profileLink
  );

  post.appendChild(
    postHeader
  );


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    let media=null;


    if(
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ){

      media=
        document.createElement(
          "img"
        );

      media.src=
        postData.media;

    }


    if(
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ){

      media=
        document.createElement(
          "video"
        );

      media.src=
        postData.media;

      media.controls=true;

      media.playsInline=true;

    }


    if(media){

      media.className=
        "post-media";


      media.onclick=
        function(event){

          event.stopPropagation();

          openPost(
            postData
          );

        };


      post.appendChild(
        media
      );

    }

  }


  /* TEXT */

  if(postData.text){

    const text =
      document.createElement(
        "div"
      );

    text.className=
      "post-content";

    text.textContent=
      postData.text;


    text.onclick=
      function(event){

        event.stopPropagation();

        openPost(
          postData
        );

      };


    post.appendChild(
      text
    );

  }


  /* SOUND */

  if(postData.sound){

    const soundBox =
      document.createElement(
        "div"
      );

    soundBox.className=
      "post-sound";


    const title =
      document.createElement(
        "div"
      );

    title.className=
      "post-sound-title";

    title.textContent=
      "🎵 Sound";


    const audio =
      document.createElement(
        "audio"
      );

    audio.controls=true;

    audio.src=
      postData.sound;


    soundBox.appendChild(
      title
    );

    soundBox.appendChild(
      audio
    );

    post.appendChild(
      soundBox
    );

  }


  /* ACTIONS */

  const actions =
    document.createElement(
      "div"
    );

  actions.className=
    "actions";


  /* LIKE */

  const likeButton =
    document.createElement(
      "button"
    );


  function updateLikeButton(){

    const count =
      Number(
        postData.likeCount
      ) || 0;


    /*
      Always show LIKE.
      Never show UNLIKE.
    */

    likeButton.textContent=
      "❤️ Like " + count;

  }


  updateLikeButton();


  likeButton.onclick=
    function(event){

      event.stopPropagation();


      postData.liked =
        postData.liked !== true;


      if(postData.liked){

        postData.likeCount=
          (
            Number(
              postData.likeCount
            ) || 0
          ) + 1;

      }else{

        postData.likeCount=
          Math.max(
            0,
            (
              Number(
                postData.likeCount
              ) || 0
            ) - 1
          );

      }


      savePosts(posts);

      updateLikeButton();

    };


  /* COMMENT */

  const commentButton =
    document.createElement(
      "button"
    );

  commentButton.textContent=
    "💬 Comment";


  commentButton.onclick=
    function(event){

      event.stopPropagation();


      const comment =
        prompt(
          "Write your comment:"
        );


      if(
        comment===null ||
        comment.trim()===""
      ){

        return;

      }


      if(
        !Array.isArray(
          postData.comments
        )
      ){

        postData.comments=[];

      }


      postData.comments.push(
        comment.trim()
      );


      savePosts(posts);

      loadProfile();

    };


  /* SHARE */

  const shareButton =
    document.createElement(
      "button"
    );

  shareButton.textContent=
    "↗️ Share";


  shareButton.onclick=
    function(event){

      event.stopPropagation();

      sharePost(
        postData
      );

    };


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );

  actions.appendChild(
    shareButton
  );


  post.appendChild(
    actions
  );


  /* COMMENTS */

  const commentsBox =
    document.createElement(
      "div"
    );

  commentsBox.className=
    "comments";


  if(
    Array.isArray(
      postData.comments
    )
  ){

    postData.comments.forEach(
      function(comment){

        const item =
          document.createElement(
            "div"
          );

        item.className=
          "comment";


        const name =
          document.createElement(
            "span"
          );

        name.className=
          "comment-name";

        name.textContent=
          getUsername(
            postData
          ) + ": ";


        item.appendChild(
          name
        );


        item.appendChild(
          document.createTextNode(
            comment
          )
        );


        commentsBox.appendChild(
          item
        );

      }
    );

  }


  post.appendChild(
    commentsBox
  );


  /* DELETE */

  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.className=
    "delete-button";

  deleteButton.textContent=
    "🗑️ Delete Post";


  deleteButton.onclick=
    function(event){

      event.stopPropagation();


      if(
        !confirm(
          "Are you sure you want to delete this post?"
        )
      ){

        return;

      }


      posts.splice(
        index,
        1
      );


      savePosts(
        posts
      );

      loadProfile();

    };


  post.appendChild(
    deleteButton
  );


  box.appendChild(
    post
  );

}


/* =========================
OPEN LARGE POST
========================= */

function openPost(postData){

  const viewer =
    document.getElementById(
      "postViewer"
    );

  const box =
    document.getElementById(
      "viewerBox"
    );


  box.innerHTML="";


  /* PROFILE */

  const profile =
    document.createElement(
      "div"
    );

  profile.className=
    "viewer-profile";


  profile.onclick=
    function(){

      window.location.href=
        "profile.html";

    };


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className=
    "viewer-avatar";


  const image =
    getProfileImage(
      postData
    );


  if(image){

    const img =
      document.createElement(
        "img"
      );

    img.src=image;

    avatar.appendChild(
      img
    );

  }else{

    avatar.textContent=
      "👤";

  }


  const name =
    document.createElement(
      "span"
    );

  name.textContent=
    getUsername(
      postData
    );


  profile.appendChild(
    avatar
  );

  profile.appendChild(
    name
  );


  box.appendChild(
    profile
  );


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    let media=null;


    if(
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ){

      media=
        document.createElement(
          "img"
        );

      media.src=
        postData.media;

    }


    if(
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ){

      media=
        document.createElement(
          "video"
        );

      media.src=
        postData.media;

      media.controls=true;

      media.autoplay=true;

      media.playsInline=true;

    }


    if(media){

      media.className=
        "viewer-media";

      box.appendChild(
        media
      );

    }

  }


  /* CAPTION */

  if(postData.text){

    const text =
      document.createElement(
        "div"
      );

    text.className=
      "viewer-content";

    text.textContent=
      postData.text;

    box.appendChild(
      text
    );

  }


  /* SOUND */

  if(postData.sound){

    const soundBox =
      document.createElement(
        "div"
      );

    soundBox.className=
      "viewer-sound";


    const title =
      document.createElement(
        "div"
      );

    title.textContent=
      "🎵 Sound";


    const audio =
      document.createElement(
        "audio"
      );

    audio.controls=true;

    audio.src=
      postData.sound;


    soundBox.appendChild(
      title
    );

    soundBox.appendChild(
      audio
    );


    box.appendChild(
      soundBox
    );

  }


  /* INFO */

  const info =
    document.createElement(
      "div"
    );

  info.className=
    "viewer-info";


  info.textContent=
    "❤️ " +
    (
      Number(
        postData.likeCount
      ) || 0
    ) +
    "    💬 " +
    (
      Array.isArray(
        postData.comments
      )
      ? postData.comments.length
      : 0
    );


  box.appendChild(
    info
  );


  viewer.style.display=
    "block";

}


/* =========================
CLOSE POST
========================= */

function closePost(){

  document.getElementById(
    "postViewer"
  ).style.display=
    "none";

}


/* =========================
SHARE
========================= */

function sharePost(postData){

  const shareText=
