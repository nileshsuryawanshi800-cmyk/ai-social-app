<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

/* PROFILE */

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin: auto;
  overflow: hidden;
  cursor: pointer;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.username {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat {
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

.edit-button {
  margin-top: 20px;
  padding: 11px 25px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: white;
  font-size: 15px;
}

/* POSTS */

.posts-title {
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* POST HEADER */

.post-header {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  flex-shrink: 0;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-name {
  font-weight: bold;
  font-size: 16px;
}

/* TEXT */

.post-text {
  padding: 0 15px 15px;
  font-size: 17px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  display: block;
  background: #000;
  cursor: pointer;
}

/* ACTIONS */

.actions {
  display: flex;
  gap: 10px;
  padding: 12px 15px;
  border-top: 1px solid #eee;
  flex-wrap: wrap;
}

.actions button {
  border: none;
  background: #f5f5f5;
  padding: 11px 15px;
  border-radius: 20px;
  font-size: 15px;
  cursor: pointer;
}

.actions button:active {
  transform: scale(0.96);
}

/* COMMENTS */

.comments {
  padding: 0 15px 10px;
}

.comment {
  padding: 6px 0;
  font-size: 14px;
}

/* DELETE */

.delete-button {
  width: calc(100% - 30px);
  margin: 0 15px 15px;
  padding: 11px;
  border: none;
  border-radius: 20px;
  background: #fff0f0;
  color: red;
  font-size: 14px;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  padding: 5px;
}

/* BIG POST VIEW */

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-box {
  max-width: 700px;
  margin: 40px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: black;
}

.viewer-close {
  position: fixed;
  right: 15px;
  top: 15px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 24px;
  z-index: 1001;
}

</style>
</head>

<body>

<header>
  👤 Profile
</header>


<section class="profile">

  <div
    class="profile-avatar"
    onclick="choosePhoto()"
  >

    <img
      id="profileImage"
      alt="Profile"
      style="display:none"
    >

    <span id="avatarIcon">👤</span>

  </div>


  <input
    type="file"
    id="photoInput"
    accept="image/*"
    style="display:none"
    onchange="savePhoto(event)"
  >


  <div
    class="username"
    id="username"
  >
    AI Social User
  </div>


  <div
    class="bio"
    id="bio"
  >
    Welcome to my AI Social profile 🚀
  </div>


  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Following</span>
    </div>

  </div>


  <button
    class="edit-button"
    onclick="editProfile()"
  >
    ✏️ Edit Profile
  </button>

</section>


<div class="posts-title">
  📸 My Posts
</div>


<div id="myPosts"></div>


<!-- BIG POST VIEW -->

<div id="viewer">

  <button
    class="viewer-close"
    onclick="closeViewer()"
  >
    ✕
  </button>

  <div
    id="viewerBox"
    class="viewer-box"
  ></div>

</div>


<!-- NAVIGATION -->

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile() {

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  const username =
    prompt(
      "Enter your username:",
      oldName
    );

  if (username === null) return;

  if (username.trim() === "") {

    alert("⚠️ Username cannot be empty.");

    return;
  }


  const bio =
    prompt(
      "Enter your bio:",
      oldBio
    );

  if (bio === null) return;


  localStorage.setItem(
    "username",
    username.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );


  loadProfile();

  alert("✅ Profile updated!");

}


/* =========================
PROFILE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert("⚠️ Please select an image.");

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      localStorage.setItem(
        "profileImage",
        e.target.result
      );

      showProfilePhoto(
        e.target.result
      );

    };


  reader.readAsDataURL(file);

}


function showProfilePhoto(imageData) {

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");


  if (!imageData) {

    image.style.display = "none";

    icon.style.display = "block";

    return;
  }


  image.src =
    imageData;

  image.style.display =
    "block";

  icon.style.display =
    "none";

}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch(error) {

    return [];

  }

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem("username") ||
    "AI Social User";


  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "username"
  ).textContent =
    username;


  document.getElementById(
    "bio"
  ).textContent =
    bio;


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem("profileImage");


  if (savedImage) {

    showProfilePhoto(
      savedImage
    );

  }


  /* POSTS */

  const posts =
    getPosts();


  const postsBox =
    document.getElementById("myPosts");


  postsBox.innerHTML = "";


  document.getElementById(
    "postCount"
  ).textContent =
    posts.length;


  if (posts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Create your first post 📸' +
      '</div>';

    return;
  }


  posts.forEach(
    function(postData, index) {

      createPost(
        postData,
        index,
        posts
      );

    }
  );

}


/* =========================
CREATE PROFILE POST
========================= */

function createPost(
  postData,
  index,
  posts
) {

  const post =
    document.createElement("div");

  post.className =
    "post";


  /* POST HEADER */

  const header =
    document.createElement("div");

  header.className =
    "post-header";


  const avatar =
    document.createElement("div");

  avatar.className =
    "post-avatar";


  const profileImage =
    localStorage.getItem(
      "profileImage"
    );


  if (profileImage) {

    const img =
      document.createElement("img");

    img.src =
      profileImage;

    avatar.appendChild(img);

  } else {

    avatar.textContent =
      "👤";

  }


  const name =
    document.createElement("div");

  name.className =
    "post-name";

  name.textContent =
    postData.username ||
    localStorage.getItem("username") ||
    "You";


  header.appendChild(
    avatar
  );

  header.appendChild(
    name
  );


  post.appendChild(
    header
  );


  /* TEXT */

  if (postData.text) {

    const text =
      document.createElement("div");

    text.className =
      "post-text";

    text.textContent =
      postData.text;


    post.appendChild(
      text
    );

  }


  /* MEDIA */

  if (
    postData.media &&
    postData.mediaType
  ) {

    let media = null;


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ) {

      media =
        document.createElement("img");

      media.src =
        postData.media;

    }


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ) {

      media =
        document.createElement("video");

      media.src =
        postData.media;

      media.controls =
        true;

      media.playsInline =
        true;

    }


    if (media) {

      media.className =
        "post-media";


      media.onclick =
        function() {

          openViewer(
            postData
          );

        };


      post.appendChild(
        media
      );

    }

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");


  function updateLike() {

    /*
      IMPORTANT:
      Button always says LIKE.
      It will NOT change to UNLIKE.
    */

    likeButton.textContent =
      "❤️ Like " +
      (
        Number(
          postData.likeCount
        ) || 0
      );

  }


  updateLike();


  likeButton.onclick =
    function(event) {

      event.stopPropagation();


      /*
        Toggle the like state
      */

      postData.liked =
        postData.liked !== true;


      if (postData.liked) {

        postData.likeCount =
          (
            Number(
              postData.likeCount
            ) || 0
          ) + 1;

      } else {

        postData.likeCount =
          Math.max(
            0,
            (
              Number(
                postData.likeCount
              ) || 0
            ) - 1
          );

      }


      savePosts(posts);

      updateLike();

    };


  /* COMMENT */

  const commentButton =
    document.createElement("button");


  commentButton.textContent =
    "💬 Comment " +
    (
      Array.isArray(
        postData.comments
      )
      ? postData.comments.length
      : 0
    );


  commentButton.onclick =
    function(event) {

      event.stopPropagation();


      const comment =
        prompt(
          "💬 Write your comment:"
        );


      if (
        !comment ||
        comment.trim() === ""
      ) {

        return;

      }


      if (
        !Array.isArray(
          postData.comments
        )
      ) {

        postData.comments = [];

      }


      postData.comments.push(
        comment.trim()
      );


      savePosts(posts);

      loadProfile();

    };


  /* SHARE */

  const shareButton =
    document.createElement("button");


  shareButton.textContent =
    "↗️ Share";


  shareButton.onclick =
    function(event) {

      event.stopPropagation();


      const text =
        postData.text ||
        "Check out my post on AI Social!";


      if (
        navigator.share
      ) {

        navigator.share({

          title:
            "AI Social",

          text:
            text,

          url:
            window.location.href

        });

      }

      else if (
        navigator.clipboard
      ) {

        navigator.clipboard
          .writeText(text)
          .then(
            function() {

              alert(
                "✅ Post copied!"
              );

            }
          );

      }

    };


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );

  actions.appendChild(
    shareButton
  );


  post.appendChild(
    actions
  );


  /* COMMENTS */

  if (
    Array.isArray(
      postData.comments
    ) &&
    postData.comments.length > 0
  ) {

    const comments =
      document.createElement("div");

    comments.className =
      "comments";


    postData.comments.forEach(
      function(comment) {

        const item =
          document.createElement("div");

        item.className =
          "comment";

        item.textContent =
          "💬 " +
          comment;

        comments.appendChild(
          item
        );

      }
    );


    post.appendChild(
      comments
    );

  }


  /* DELETE */

  const deleteButton =
    document.createElement("button");


  deleteButton.className =
    "delete-button";


  deleteButton.textContent =
    "🗑️ Delete Post";


  deleteButton.onclick =
    function(event) {

      event.stopPropagation();


      const answer =
        confirm(
          "🗑️ Delete this post?"
        );


      if (!answer) return;


      posts.splice(
        index,
        1
      );


      savePosts(posts);

      loadProfile();

    };


  post.appendChild(
    deleteButton
  );


  document
    .getElementById("myPosts")
    .appendChild(post);

}


/* =========================
BIG POST VIEW
========================= */

function openViewer(postData) {

  const viewer =
    document.getElementById(
