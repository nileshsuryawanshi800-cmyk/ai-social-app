<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:21px;
  font-weight:bold;
}

.profile{
  background:white;
  padding:25px 20px;
  text-align:center;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.username{
  margin-top:12px;
  font-size:23px;
  font-weight:bold;
}

.bio{
  margin-top:8px;
  color:#666;
  font-size:15px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
}

.stat span{
  color:#777;
  font-size:14px;
}

.profile-button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.edit-button{
  border:none;
  background:#111;
  color:white;
}

.account-button{
  border:1px solid #ddd;
  background:white;
  color:#111;
}

.posts-title{
  padding:20px;
  font-size:19px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post-header{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  flex-shrink:0;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-name{
  font-size:18px;
  font-weight:bold;
}

.post-text{
  padding:0 15px 15px;
  font-size:17px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#000;
  display:block;
}

.sound-box{
  padding:12px 15px;
  border-top:1px solid #eee;
}

.sound-title{
  font-weight:bold;
  margin-bottom:7px;
}

.sound-box audio{
  width:100%;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.actions button{
  border:none;
  background:#f1f1f1;
  border-radius:25px;
  padding:14px 5px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.actions button:active{
  transform:scale(.96);
}

.comments{
  padding:0 15px 12px;
}

.comment{
  background:#f5f5f5;
  padding:9px 12px;
  border-radius:12px;
  margin-top:7px;
}

.delete-button{
  width:calc(100% - 24px);
  margin:0 12px 14px;
  border:1px solid #ffdddd;
  background:#fff5f5;
  color:red;
  border-radius:25px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 20px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
  cursor:pointer;
}

#accountBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:25px;
}

.account-panel{
  background:white;
  border-radius:20px;
  padding:20px;
  max-width:500px;
  margin:80px auto;
}

.account-panel h2{
  margin-top:0;
}

.account-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid #eee;
  border-radius:15px;
  margin-top:10px;
  cursor:pointer;
}

.account-photo{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.close-account{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
}

/* EDIT PROFILE */

#editBox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:1500;
  padding:20px;
  overflow-y:auto;
}

.edit-panel{
  background:white;
  max-width:500px;
  margin:30px auto;
  padding:22px;
  border-radius:22px;
}

.edit-panel h2{
  margin-top:0;
  text-align:center;
}

.edit-photo-area{
  text-align:center;
  margin-bottom:20px;
}

.edit-photo-preview{
  width:150px;
  height:150px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  margin:15px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.edit-photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
}

.photo-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.photo-buttons button{
  border:none;
  background:#eee;
  padding:11px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.choose-photo{
  width:100%;
  padding:13px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-weight:bold;
  font-size:15px;
  margin-bottom:10px;
  cursor:pointer;
}

.edit-label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

.edit-input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.edit-textarea{
  width:100%;
  min-height:100px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  resize:vertical;
}

.save-edit{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancel-edit{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  font-size:15px;
  cursor:pointer;
}

.photo-status{
  font-size:13px;
  color:#777;
  margin-top:8px;
}

</style>

</head>

<script>

/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}


/* =========================
PROFILE PHOTO
========================= */

function showProfilePhoto(){

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("profileIcon");

  const saved =
    localStorage.getItem("profileImage");

  if(saved){

    image.src=saved;
    image.style.display="block";
    icon.style.display="none";

  }else{

    image.removeAttribute("src");
    image.style.display="none";
    icon.style.display="block";

  }

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile(){

  const name =
    localStorage.getItem("username") ||
    "astryx.soul12";

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById(
    "username"
  ).textContent=name;

  document.getElementById(
    "bio"
  ).textContent=bio;

  showProfilePhoto();


  let posts=[];

  try{

    posts=JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

    if(!Array.isArray(posts)){
      posts=[];
    }

  }catch(error){

    posts=[];

  }


  document.getElementById(
    "postCount"
  ).textContent=posts.length;


  const box =
    document.getElementById("myPosts");

  box.innerHTML="";


  if(posts.length===0){

    box.innerHTML=
      '<div class="empty">'+
      'No posts yet.<br>'+
      'Create your first post 📸'+
      '</div>';

    return;

  }


  posts.forEach(function(postData,index){

    createPost(
      postData,
      index,
      posts,
      box
    );

  });

}


/* =========================
CREATE POST
========================= */

function createPost(
  postData,
  index,
  posts,
  box
){

  const post =
    document.createElement("div");

  post.className="post";


  const header =
    document.createElement("div");

  header.className="post-header";


  const avatar =
    document.createElement("div");

  avatar.className="post-avatar";


  const photo =
    postData.profileImage ||
    localStorage.getItem("profileImage") ||
    "";


  if(photo){

    const img =
      document.createElement("img");

    img.src=photo;

    avatar.appendChild(img);

  }else{

    avatar.textContent="👤";

  }


  const name =
    document.createElement("div");

  name.className="post-name";

  name.textContent =
    postData.username ||
    localStorage.getItem("username") ||
    "astryx.soul12";


  header.appendChild(avatar);
  header.appendChild(name);

  post.appendChild(header);


  /* TEXT */

  if(postData.text){

    const text =
      document.createElement("div");

    text.className="post-text";

    text.textContent=
      postData.text;

    post.appendChild(text);

  }


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    const type =
      postData.mediaType.toLowerCase();


    if(type.startsWith("image/")){

      const image =
        document.createElement("img");

      image.className="post-media";

      image.src=
        postData.media;

      image.alt=
        "Published photo";

      post.appendChild(image);

    }


    if(type.startsWith("video/")){

      const video =
        document.createElement("video");

      video.className="post-media";

      video.src=
        postData.media;

      video.controls=true;

      video.playsInline=true;

      post.appendChild(video);

    }

  }


  /* SOUND */

  if(postData.sound){

    const soundBox =
      document.createElement("div");

    soundBox.className="sound-box";


    const soundTitle =
      document.createElement("div");

    soundTitle.className="sound-title";

    soundTitle.textContent="🎵 Sound";


    const audio =
      document.createElement("audio");

    audio.controls=true;

    audio.src=
      postData.sound;


    soundBox.appendChild(soundTitle);
    soundBox.appendChild(audio);

    post.appendChild(soundBox);

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className="actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");


  function updateLike(){

    const count =
      Number(postData.likeCount)||0;

    likeButton.textContent =
      postData.liked
      ? "❤️ Liked " + count
      : "🤍 Like " + count;

  }


  updateLike();


  likeButton.onclick=function(){

    postData.liked =
      postData.liked !== true;


    if(postData.liked){

      postData.likeCount =
        (Number(postData.likeCount)||0)+1;

    }else{

      postData.likeCount =
        Math.max(
          0,
          (Number(postData.likeCount)||0)-1
        );

    }


    savePosts(posts);

    updateLike();

  };


  /* COMMENT */

  const commentButton =
    document.createElement("button");

  commentButton.textContent=
    "💬 Comment";


  commentButton.onclick=function(){

    const comment =
      prompt("Write your comment:");


    if(
      comment===null ||
      comment.trim()===""
    ){

      return;

    }


    if(!Array.isArray(postData.comments)){

      postData.comments=[];

    }


    postData.comments.push(
      comment.trim()
    );


    savePosts(posts);

    loadProfile();

  };


  /* SHARE */

  const shareButton =
    document.createElement("button");

  shareButton.textContent=
    "↗️ Share";


  shareButton.onclick=function(){

    sharePost(postData);

  };


  actions.appendChild(likeButton);
  actions.appendChild(commentButton);
  actions.appendChild(shareButton);

  post.appendChild(actions);


  /* COMMENTS */

  const commentsBox =
    document.createElement("div");

  commentsBox.className="comments";


  if(Array.isArray(postData.comments)){

    postData.comments.forEach(function(comment){

      const item =
        document.createElement("div");

      item.className="comment";

      item.textContent=
        "💬 " + comment;

      commentsBox.appendChild(item);

    });

  }


  post.appendChild(commentsBox);


  /* DELETE */

  const deleteButton =
    document.createElement("button");

  deleteButton.className=
    "delete-button";

  deleteButton.textContent=
    "🗑️ Delete Post";


  deleteButton.onclick=function(){

    if(!confirm(
      "Are you sure you want to delete this post?"
    )){

      return;

    }


    posts.splice(index,1);

    savePosts(posts);

    loadProfile();

  };


  post.appendChild(deleteButton);

  box.appendChild(post);

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts){

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
EDIT PROFILE VARIABLES
========================= */

let editingPhoto="";
let photoRotation=0;
let photoZoom=1;
let photoFilter="";


/* =========================
OPEN EDIT PROFILE
========================= */

function editProfile(){

  const oldName =
    localStorage.getItem("username") ||
    "astryx.soul12";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "editUsername"
  ).value=oldName;


  document.getElementById(
    "editBio"
  ).value=oldBio;


  editingPhoto =
    localStorage.getItem("profileImage") || "";


  photoRotation=0;
  photoZoom=1;
  photoFilter="";


  const preview =
    document.getElementById(
      "editPhotoPreview"
    );

  const icon =
    document.getElementById(
      "editPhotoIcon"
    );


  if(editingPhoto){

    preview.src=editingPhoto;

    preview.style.display="block";

    icon.style.display="none";

    document.getElementById(
      "photoStatus"
    ).textContent="Current profile photo";

  }else{

    preview.removeAttribute("src");

    preview.style.display="none";

    icon.style.display="block";

    document.getElementById(
      "photoStatus"
    ).textContent=
      "Choose a photo to edit it.";

  }


  updatePhotoPreview();


  document.getElementById(
    "editBox"
  ).style.display="block";

}


/* =========================
SELECT PROFILE PHOTO
========================= */

function selectProfilePhoto(event){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(){

    editingPhoto=
      reader.result;

    photoRotation=0;
    photoZoom=1;
    photoFilter="";


    const preview =
      document.getElementById(
        "editPhotoPreview"
      );

    const icon =
      document.getElementById(
        "editPhotoIcon"
      );


    preview.src=editingPhoto;

    preview.style.display="block";

    icon.style.display="none";


    document.getElementById(
      "photoStatus"
    ).textContent=
      "Photo selected ✅";


    updatePhotoPreview();

  };


  reader.readAsDataURL(file);

}


/* =========================
UPDATE PHOTO PREVIEW
========================= */

function updatePhotoPreview(){

  const preview =
    document.getElementById(
      "editPhotoPreview"
    );


  if(!editingPhoto){

    return;

  }


  preview.style.transform=
    "rotate(" +
    photoRotation +
    "deg) scale(" +
    photoZoom +
    ")";


  preview.style.filter=
    photoFilter;

}


/* =========================
ROTATE
========================= */

function rotatePhoto(){

  if(!editingPhoto){

    alert("Please choose a photo first.");

    return;

  }


  photoRotation += 90;


  if(photoRotation>=360){

    photoRotation=0;

  }


  updatePhotoPreview();

}


/* =========================
ZOOM IN
========================= */

function zoomIn(){

  if(!editingPhoto){

    alert("Please choose a photo first.");

    return;

  }


  photoZoom=
    Math.min(2,photoZoom+0.1);


  updatePhotoPreview();

}


/* =========================
ZOOM OUT
========================= */

function zoomOut(){

  if(!editingPhoto){

    alert("Please choose a photo first.");

    return;

  }


  photoZoom=
    Math.max(1,photoZoom-0.1);


  updatePhotoPreview();

}


/* =========================
BLACK & WHITE
========================= */

function blackWhite(){

  if(!editingPhoto){

    alert("Please choose a photo first.");

    return;

  }


  if(photoFilter==="grayscale(100%)"){

    photoFilter="";

  }else{

    photoFilter=
      "grayscale(100%)";

  }


  updatePhotoPreview();

}


/* =========================
SEPIA
========================= */

function sepiaPhoto(){

  if(!editingPhoto){

    alert("Please choose a photo first.");

    return;

  }


  if(photoFilter==="sepia(100%)"){

    photoFilter="";

  }else{

    photoFilter=
      "sepia(100%)";

  }


  updatePhotoPreview();

}

/*=========================
RESET PHOTO
========================= */

function resetPhoto(){

  if(!editingPhoto){
    return;
  }

  photoRotation=0;
  photoZoom=1;
  photoFilter="";

  updatePhotoPreview();

  document.getElementById(
    "photoStatus"
  ).textContent="Photo reset ✅";

}


/* =========================
SAVE EDITED PROFILE
========================= */

function saveEditedProfile(){

  const usernameInput =
    document.getElementById("editUsername");

  const bioInput =
    document.getElementById("editBio");


  const newUsername =
    usernameInput.value.trim();

  const newBio =
    bioInput.value.trim();


  if(newUsername===""){

    alert("Username cannot be empty.");

    return;

  }


  /* SAVE USERNAME */

  localStorage.setItem(
    "username",
    newUsername
  );


  /* SAVE BIO */

  localStorage.setItem(
    "bio",
    newBio
  );


  /*
    SAVE PROFILE PHOTO

    The edited preview is saved
    as the profile photo.
  */

  if(editingPhoto){

    saveEditedPhoto(function(){

      localStorage.setItem(
        "profileImage",
        editingPhoto
      );

      finishProfileSave(
        newUsername,
        newBio
      );

    });

  }else{

    finishProfileSave(
      newUsername,
      newBio
    );

  }

}


/* =========================
SAVE EDITED PHOTO
========================= */

function saveEditedPhoto(callback){

  if(!editingPhoto){

    callback();

    return;

  }


  const image =
    new Image();


  image.onload=function(){

    const canvas =
      document.createElement("canvas");

    const size=600;

    canvas.width=size;
    canvas.height=size;


    const ctx =
      canvas.getContext("2d");


    /*
      Make a square image.
      This keeps the profile photo
      properly cropped.
    */

    const scale =
      Math.max(
        size / image.width,
        size / image.height
      );


    const width =
      image.width * scale;

    const height =
      image.height * scale;


    const x =
      (size-width)/2;

    const y =
      (size-height)/2;


    ctx.save();


    /*
      Move to center so rotation
      works correctly.
    */

    ctx.translate(
      size/2,
      size/2
    );


    ctx.rotate(
      photoRotation *
      Math.PI / 180
    );


    ctx.scale(
      photoZoom,
      photoZoom
    );


    /*
      Apply filter
    */

    if(photoFilter){

      ctx.filter=photoFilter;

    }


    ctx.drawImage(
      image,
      -width/2,
      -height/2,
      width,
      height
    );


    ctx.restore();


    /*
      Convert edited image to
      smaller JPEG for localStorage.
    */

    editingPhoto =
      canvas.toDataURL(
        "image/jpeg",
        0.88
      );


    callback();

  };


  image.onerror=function(){

    alert(
      "Could not process this photo."
    );

  };


  image.src=editingPhoto;

}


/* =========================
FINISH PROFILE SAVE
========================= */

function finishProfileSave(
  username,
  bio
){

  /*
    Update existing posts so
    profile name/photo also
    appear correctly.
  */

  let posts=[];


  try{

    posts=JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

    if(!Array.isArray(posts)){
      posts=[];
    }

  }catch(error){

    posts=[];

  }


  posts.forEach(function(post){

    /*
      Only update the post if it
      doesn't have its own saved
      profile information.
    */

    post.username=username;


    if(editingPhoto){

      post.profileImage=
        editingPhoto;

    }

  });


  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );


  /*
    Close popup
  */

  closeEditProfile();


  /*
    Reload profile
  */

  loadProfile();


  alert(
    "✅ Profile updated successfully!"
  );

}

/* =========================
SHARE POST
========================= */

function sharePost(postData){

  const username =
    localStorage.getItem("username") ||
    "astryx.soul12";


  const text =
    username +
    "\n\n" +
    (
      postData.text ||
      "Check out my post on AI Social!"
    );


  if(
    navigator.share
  ){

    navigator.share({

      title:"AI Social",

      text:text,

      url:window.location.href

    }).catch(function(){

      /* User cancelled sharing */

    });

    return;

  }


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(text)
      .then(function(){

        alert(
          "✅ Post copied!"
        );

      })
      .catch(function(){

        alert(
          "Sharing is not supported."
        );

      });

    return;

  }


  alert(
    "Sharing is not supported."
  );

}


/* =========================
ACCOUNTS
========================= */

function getAccounts(){

  let accounts=[];


  try{

    accounts=JSON.parse(
      localStorage.getItem("accounts") || "[]"
    );


    if(!Array.isArray(accounts)){
      accounts=[];
    }

  }catch(error){

    accounts=[];

  }


  return accounts;

}


/* =========================
OPEN ACCOUNTS
========================= */

function openAccounts(){

  const box =
    document.getElementById(
      "accountBox"
    );


  const list =
    document.getElementById(
      "accountList"
    );


  list.innerHTML="";


  /* CURRENT ACCOUNT */

  const currentRow =
    document.createElement("div");

  currentRow.className=
    "account-row";


  const currentImage =
    document.createElement("img");

  currentImage.className=
    "account-photo";


  const savedPhoto =
    localStorage.getItem(
      "profileImage"
    );


  if(savedPhoto){

    currentImage.src=
      savedPhoto;

  }


  const currentName =
    document.createElement("strong");

  currentName.textContent=
    localStorage.getItem(
      "username"
    ) || "astryx.soul12";


  currentRow.appendChild(
    currentImage
  );

  currentRow.appendChild(
    currentName
  );


  currentRow.onclick=function(){

    closeAccounts();

    loadProfile();

  };


  list.appendChild(
    currentRow
  );


  /* SAVED ACCOUNTS */

  const accounts =
    getAccounts();


  accounts.forEach(function(account){

    if(
      account.username ===
      currentName.textContent
    ){

      return;

    }


    const row =
      document.createElement("div");

    row.className=
      "account-row";


    const image =
      document.createElement("img");

    image.className=
      "account-photo";


    if(account.profileImage){

      image.src=
        account.profileImage;

    }


    const name =
      document.createElement("strong");

    name.textContent=
      account.username ||
      "Account";


    row.appendChild(image);
    row.appendChild(name);


    row.onclick=function(){

      switchAccount(account);

    };


    list.appendChild(row);

  });


  /* NEW ACCOUNT */

  const newButton =
    document.createElement("button");

  newButton.className=
    "profile-button account-button";

  newButton.textContent=
    "➕ Create New Account";


  newButton.onclick=function(){

    window.location.href=
      "signup.html";

  };


  list.appendChild(
    newButton
  );


  box.style.display=
    "block";

}


/* =========================
CLOSE ACCOUNTS
========================= */

function closeAccounts(){

  document.getElementById(
    "accountBox"
  ).style.display=
    "none";

}


/* =========================
SWITCH ACCOUNT
========================= */

function switchAccount(account){

  if(!account){
    return;
  }


  localStorage.setItem(
    "activeAccountId",
    String(account.id || "")
  );


  localStorage.setItem(
    "username",
    account.username ||
    "astryx.soul12"
  );


  localStorage.setItem(
    "bio",
    account.bio || ""
  );


  localStorage.setItem(
    "profileImage",
    account.profileImage || ""
  );


  closeAccounts();

  loadProfile();

}
