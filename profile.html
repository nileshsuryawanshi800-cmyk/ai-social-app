<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Profile - AI Social</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

/* PROFILE */

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: #ddd;
  margin: auto;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  cursor: pointer;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.username {
  margin-top: 12px;
  font-size: 23px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat {
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 21px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

/* EDIT */

.edit-button {
  margin-top: 20px;
  padding: 12px 30px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* POSTS */

.posts-title {
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* POST HEADER */

.post-header {
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #ddd;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  cursor: pointer;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

/* CAPTION */

.post-text {
  padding: 0 15px 15px;
  font-size: 17px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  background: #000;
  display: block;
  cursor: pointer;
}

/* ACTIONS */

.actions {
  display: flex;
  gap: 10px;
  padding: 12px 15px;
  border-top: 1px solid #eee;
  flex-wrap: wrap;
}

.actions button {
  border: none;
  background: #f3f3f3;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 15px;
  cursor: pointer;
}

.actions button:active {
  transform: scale(0.95);
}

/* COMMENTS */

.comments {
  padding: 0 15px 10px;
}

.comment {
  padding: 5px 0;
}

.comment-name {
  font-weight: bold;
}

/* DELETE */

.delete-button {
  margin: 5px 15px 15px;
  padding: 10px 15px;
  border: none;
  border-radius: 20px;
  background: #ffe5e5;
  color: red;
  font-size: 14px;
  cursor: pointer;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #777;
  padding: 35px;
}

/* BIG POST VIEW */

#postViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-close {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 25px;
  z-index: 1001;
}

.viewer-box {
  max-width: 700px;
  margin: 50px auto 20px;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: black;
}

.viewer-text {
  padding: 15px;
  font-size: 18px;
  white-space: pre-wrap;
}

/* NAV */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 900;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  padding: 5px;
  cursor: pointer;
}

</style>

</head>

<body>

<header>
  👤 Profile
</header>


<!-- PROFILE -->

<section class="profile">

  <div
    class="profile-avatar"
    onclick="choosePhoto()"
  >

    <img
      id="profileImage"
      alt="Profile photo"
    >

    <span id="avatarIcon">👤</span>

  </div>


  <input
    type="file"
    id="photoInput"
    accept="image/*"
    style="display:none"
    onchange="savePhoto(event)"
  >


  <div
    class="username"
    id="username"
  >
    AI Social User
  </div>


  <div
    class="bio"
    id="bio"
  >
    Welcome to my AI Social profile 🚀
  </div>


  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Following</span>
    </div>

  </div>


  <button
    class="edit-button"
    onclick="editProfile()"
  >
    ✏️ Edit Profile
  </button>

</section>


<div class="posts-title">
  📸 My Posts
</div>


<div id="myPosts"></div>


<!-- BIG POST VIEW -->

<div id="postViewer">

  <button
    class="viewer-close"
    onclick="closePost()"
  >
    ✕
  </button>

  <div
    class="viewer-box"
    id="viewerBox"
  ></div>

</div>


<!-- NAVIGATION -->

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile() {

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  const newName =
    prompt(
      "Enter your username:",
      oldName
    );


  if (newName === null) {
    return;
  }


  if (newName.trim() === "") {

    alert("⚠️ Username cannot be empty.");

    return;

  }


  const newBio =
    prompt(
      "Enter your bio:",
      oldBio
    );


  if (newBio === null) {
    return;
  }


  localStorage.setItem(
    "username",
    newName.trim()
  );

  localStorage.setItem(
    "bio",
    newBio.trim()
  );


  loadProfile();

  alert("✅ Profile updated!");

}


/* =========================
PROFILE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  if (!file.type.startsWith("image/")) {

    alert("⚠️ Please select an image.");

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      const imageData =
        e.target.result;

      localStorage.setItem(
        "profileImage",
        imageData
      );

      showProfilePhoto(imageData);

    };


  reader.readAsDataURL(file);

}


function showProfilePhoto(imageData) {

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");


  if (!imageData) {

    image.style.display = "none";

    icon.style.display = "block";

    return;

  }


  image.src = imageData;

  image.style.display = "block";

  icon.style.display = "none";

}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem("posts") || "[]"
      );

    if (!Array.isArray(data)) {
      return [];
    }

    return data;

  } catch(error) {

    console.log(error);

    return [];

  }

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  /* USER */

  const username =
    localStorage.getItem("username") ||
    "AI Social User";


  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "username"
  ).textContent =
    username;


  document.getElementById(
    "bio"
  ).textContent =
    bio;


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem("profileImage");


  if (savedImage) {

    showProfilePhoto(savedImage);

  }


  /* POSTS
