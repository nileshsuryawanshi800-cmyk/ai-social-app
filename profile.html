<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* HEADER */

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

/* PROFILE */

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin: auto;
  overflow: hidden;
  cursor: pointer;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.username {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat {
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

.edit-button {
  margin-top: 20px;
  padding: 12px 28px;
  border: none;
  border-radius: 22px;
  background: #111;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

/* POSTS TITLE */

.posts-title {
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

/* POST */

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* POST HEADER */

.post-header {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-header-click {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.post-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ddd;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 25px;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-size: 17px;
  font-weight: bold;
}

/* TEXT */

.post-text {
  padding: 0 15px 15px;
  font-size: 17px;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: pointer;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  display: block;
  background: #000;
  cursor: pointer;
}

/* ACTIONS */

.actions {
  display: flex;
  gap: 10px;
  padding: 12px 10px;
  border-top: 1px solid #eee;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
  min-width: 85px;
  padding: 12px 8px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 22px;
  font-size: 14px;
  cursor: pointer;
}

.actions button:active {
  transform: scale(0.96);
}

/* COMMENTS */

.comments {
  padding: 0 15px 12px;
}

.comment {
  margin-top: 8px;
  padding: 8px;
  background: #f5f5f5;
  border-radius: 10px;
}

.comment-name {
  font-weight: bold;
}

/* DELETE */

.delete-button {
  width: calc(100% - 30px);
  margin: 0 15px 15px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 22px;
  background: white;
  color: red;
  font-size: 14px;
  cursor: pointer;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  cursor: pointer;
  padding: 5px;
}

/* LARGE POST VIEW */

#postViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-box {
  max-width: 700px;
  margin: 35px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.viewer-close {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 25px;
  cursor: pointer;
  z-index: 1001;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: #000;
}

.viewer-text {
  padding: 15px;
  font-size: 17px;
  white-space: pre-wrap;
}

.viewer-actions {
  display: flex;
  gap: 10px;
  padding: 15px;
}

.viewer-actions button {
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: white;
}

</style>
</head>

<body>

<header>
  👤 Profile
</header>

<!-- PROFILE -->

<section class="profile">

  <div class="profile-avatar" onclick="choosePhoto()">

    <img id="profileImage" alt="Profile Picture">

    <span id="avatarIcon">👤</span>

  </div>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    style="display:none"
    onchange="savePhoto(event)"
  >

  <div class="username" id="username">
    AI Social User
  </div>

  <div class="bio" id="bio">
    Welcome to my AI Social profile 🚀
  </div>

  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong id="likeTotal">0</strong>
      <span>Likes</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Followers</span>
    </div>

  </div>

  <button
    class="edit-button"
    onclick="editProfile()"
  >
    ✏️ Edit Profile
  </button>

</section>

<div class="posts-title">
  📸 My Posts
</div>

<div id="myPosts"></div>


<!-- LARGE POST VIEW -->

<div id="postViewer">

  <button
    class="viewer-close"
    onclick="closePost()"
  >
    ✕
  </button>

  <div
    class="viewer-box"
    id="viewerBox"
  ></div>

</div>


<!-- NAVIGATION -->

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile() {

  const currentUsername =
    localStorage.getItem("username") ||
    "AI Social User";

  const currentBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const username = prompt(
    "Enter your username:",
    currentUsername
  );

  if (username === null) return;

  if (username.trim() === "") {
    alert("⚠️ Username cannot be empty.");
    return;
  }

  const bio = prompt(
    "Enter your bio:",
    currentBio
  );

  if (bio === null) return;

  localStorage.setItem(
    "username",
    username.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  loadProfile();

  alert("✅ Profile updated!");
}


/* =========================
PROFILE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("⚠️ Please select an image.");

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    localStorage.setItem(
      "profileImage",
      e.target.result
    );

    showProfilePhoto(
      e.target.result
    );

    /* Update profile image in existing posts */

    updatePostProfileInfo();

  };

  reader.readAsDataURL(file);
}


function showProfilePhoto(imageData) {

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");

  if (!imageData) {

    image.style.display = "none";
    icon.style.display = "block";

    return;
  }

  image.src = imageData;

  image.style.display = "block";

  icon.style.display = "none";
}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch(error) {

    return [];

  }
}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );
}


/* =========================
UPDATE PROFILE INFO
========================= */

function updatePostProfileInfo() {

  const posts = getPosts();

  const username =
    localStorage.getItem("username") ||
    "AI Social User";

  const profileImage =
    localStorage.getItem("profileImage") ||
    null;

  posts.forEach(function(post) {

    post.username =
      username;

    post.profileImage =
      profileImage;

  });

  savePosts(posts);
}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem("username") ||
    "AI Social User";

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById(
    "username"
  ).textContent =
    username;

  document.getElementById(
    "bio"
  ).textContent =
    bio;


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem("profileImage");

  if (savedImage) {

    showProfilePhoto(
      savedImage
    );

  } else {

    showProfilePhoto(null);

  }


  /* POSTS */

  const postsBox =
    document.getElementById("myPosts");

  postsBox.innerHTML = "";

  const savedPosts =
    getPosts();


  /* POST COUNT */

  document.getElementById(
    "postCount"
  ).textContent =
    savedPosts.length;


  /* TOTAL LIKES */

  let totalLikes = 0;

  savedPosts.forEach(function(post) {

    totalLikes +=
      Number(post.likeCount) || 0;

  });

  document.getElementById(
    "likeTotal"
  ).textContent =
    totalLikes;


  if (savedPosts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Create your first post 📸' +
      '</div>';

    return;
  }


  /* CREATE POSTS */

  savedPosts.forEach(function(postData, index) {

    const post =
      document.createElement("div");

    post.className =
      "post";


    /* =========================
    POST HEADER
    ========================= */

    const postHeader =
      document.createElement("div");

    postHeader.className =
      "post-header";


    const headerClickable =
      document.createElement("div");

    headerClickable.className =
      "post-header-click";


    headerClickable.onclick =
      function(event) {

        event.stopPropagation();

        window.location.href =
          "profile.html";

      };


    const avatar =
      document.createElement("div");

    avatar.className =
      "post-avatar";


    if (postData.profileImage) {

      const image =
        document.createElement("img");

      image.src =
        postData.profileImage;

      avatar.appendChild(image);

    } else {

      avatar.textContent =
        "👤";

    }


    const name =
      document.createElement("div");

    name.className =
      "post-username";

    name.textContent =
      postData.username ||
      username;


    headerClickable.appendChild(
      avatar
    );

    headerClickable.appendChild(
      name
    );

    postHeader.appendChild(
      headerClickable
    );

    post.appendChild(
      postHeader
    );


    /* =========================
    TEXT
    ========================= */

    if (postData.text) {

      const text =
        document.createElement("div");

      text.className =
        "post-text";

      text.textContent =
        postData.text;

      text.onclick =
        function() {

          openPost(postData);

        };

      post.appendChild(text);

    }


    /* =========================
    MEDIA
    ========================= */

    if (
      postData.media &&
      typeof postData.media === "string"
    ) {

      let media = null;


      if (
        postData.mediaType &&
        postData.mediaType
          .toLowerCase()
          .startsWith("image/")
      ) {

        media =
          document.createElement("img");

        media.src =
          postData.media;

        media.alt =
          "Published edited photo";

      }


      if (
        postData.mediaType &&
        postData.mediaType
          .toLowerCase()
          .startsWith("video/")
      ) {

        media =
          document.createElement("video");

        media.src =
          postData.media;

        media.controls =
          true;

        media.playsInline =
          true;

      }


      if (media) {

        media.className =
          "post-media";

        media.onclick =
          function(event) {

            event.stopPropagation();

            openPost(postData);

          };

        post.appendChild(
          media
        );

      }

    }


    /* =========================
    ACTIONS
    ========================= */

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    /* LIKE */

    const likeButton =
      document.createElement("button");


    function updateLikeButton() {

      const count =
        Number(postData.likeCount) || 0;

      likeButton.textContent =
        postData.liked === true
        ? "❤️ Unlike " + count
        : "🤍 Like " + count;

    }


    updateLikeButton();


    likeButton.onclick =
      function(event) {

        event.stopPropagation();

        postData.liked =
          postData.liked !== true;


        if (postData.liked) {

          postData.likeCount =
            (Number(postData.likeCount) || 0) + 1;

        } else {

          postData.likeCount =
            Math.max(
              0,
              (Number(postData.likeCount) || 0) - 1
            );

        }


        savePosts(savedPosts);

        loadProfile();

      };


    /* COMMENT */

    const commentButton =
      document.createElement("button");

    commentButton.textContent =
      "💬 Comment";


    commentButton.onclick =
      function(event) {

        event.stopPropagation();

        const comment =
          prompt(
            "💬 Write your comment:"
          );


        if (
          !comment ||
          comment.trim() === ""
        ) {

          return;

        }


        if (
          !Array.isArray(
            postData.comments
          )
        ) {

          postData.comments = [];

        }


        postData.comments.push(
          comment.trim()
        );


        savePosts(savedPosts);

        loadProfile();

      };


    /* SHARE */

    const shareButton =
      document.createElement("button");

    shareButton.textContent =
      "↗️ Share";


    shareButton.onclick =
      function(event) {

        event.stopPropagation();

        sharePost(postData);

      };


    actions.appendChild(
      likeButton
    );

    actions.appendChild(
      commentButton
    );

    actions.appendChild(
      shareButton
    );


    post.appendChild(
      actions
    );


    /* =========================
    COMMENTS
    ========================= */

    const commentsBox =
      document.createElement("div");

    commentsBox.className =
      "comments";


    if (
      Array.isArray(postData.comments) &&
      postData.comments.length > 0
    ) {

      const title =
        document.createElement("strong");

      title.textContent =
        "💬 Comments";

      commentsBox.appendChild(
        title
      );


      postData.comments.forEach(
        function(comment) {

          const item =
            document.createElement("div");

          item.className =
            "comment";


          const commentName =
            document.createElement("span");

          commentName.className =
            "comment-name";

          commentName.textContent =
            username + ": ";


          item.appendChild(
            commentName
          );

          item.appendChild(
            document.createTextNode(
              comment
            )
          );


          commentsBox.appendChild(
            item
          );

        }
      );

    }


    post.appendChild(
      commentsBox
    );


    /* =========================
    DELETE
    ========================= */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Delete Post";


    deleteButton.onclick =
      function(event) {

        event.stopPropagation();

        const answer =
          confirm(
            "🗑️ Are you sure you want to delete this post?"
          );


        if (!answer) return;


        savedPosts.splice(
          index,
          1
        );


        savePosts(
          savedPosts
        );

        loadProfile();

      };


    post.appendChild(
      deleteButton
    );


    postsBox.appendChild(
      post
    );

  });

}

OPEN LARGE POST
========================= */
