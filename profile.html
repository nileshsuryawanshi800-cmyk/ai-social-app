<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin: auto;
  overflow: hidden;
  cursor: pointer;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.username {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat {
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

.edit-button {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: white;
  font-size: 15px;
}

.posts-title {
  padding: 20px;
  font-size: 18px;
  font-weight: bold;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.post-text {
  padding: 15px;
  font-size: 17px;
  white-space: pre-wrap;
  word-break: break-word;
}

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  display: block;
  background: #000;
}

.post-info {
  padding: 12px 15px;
  border-top: 1px solid #eee;
  color: #666;
  font-size: 14px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  padding: 5px;
}

</style>
</head>

<body>

<header>
  👤 Profile
</header>

<section class="profile">

  <div class="profile-avatar" onclick="choosePhoto()">

    <img id="profileImage" alt="Profile Picture">

    <span id="avatarIcon">👤</span>

  </div>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    style="display:none"
    onchange="savePhoto(event)"
  >

  <div class="username" id="username">
    AI Social User
  </div>

  <div class="bio" id="bio">
    Welcome to my AI Social profile 🚀
  </div>

  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Following</span>
    </div>

  </div>

  <button class="edit-button" onclick="editProfile()">
    ✏️ Edit Profile
  </button>

</section>

<div class="posts-title">
  📸 My Posts
</div>

<div id="myPosts"></div>

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>

<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile() {

  const currentUsername =
    localStorage.getItem("username") ||
    "AI Social User";

  const currentBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const username = prompt(
    "Enter your username:",
    currentUsername
  );

  if (username === null) return;

  if (username.trim() === "") {
    alert("⚠️ Username cannot be empty.");
    return;
  }

  const bio = prompt(
    "Enter your bio:",
    currentBio
  );

  if (bio === null) return;

  localStorage.setItem(
    "username",
    username.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  loadProfile();

  alert("✅ Profile updated!");

}


/* =========================
PROFILE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("⚠️ Please select an image.");

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    localStorage.setItem(
      "profileImage",
      e.target.result
    );

    showProfilePhoto(
      e.target.result
    );

  };

  reader.readAsDataURL(file);

}


function showProfilePhoto(imageData) {

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");

  if (!imageData) {

    image.style.display = "none";
    icon.style.display = "block";

    return;

  }

  image.src = imageData;

  image.style.display = "block";

  icon.style.display = "none";

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem("username") ||
    "AI Social User";

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById(
    "username"
  ).textContent = username;

  document.getElementById(
    "bio"
  ).textContent = bio;


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem("profileImage");

  if (savedImage) {

    showProfilePhoto(savedImage);

  }


  /* POSTS */

  const postsBox =
    document.getElementById("myPosts");

  postsBox.innerHTML = "";


  let savedPosts = [];

  try {

    savedPosts =
      JSON.parse(
        localStorage.getItem("posts") || "[]"
      );

  } catch(error) {

    savedPosts = [];

  }


  document.getElementById(
    "postCount"
  ).textContent =
    savedPosts.length;


  if (savedPosts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">No posts yet.<br>Create your first post 📸</div>';

    return;

  }


  savedPosts.forEach(function(savedPost) {

    const post =
      document.createElement("div");

    post.className = "post";


    /* =========================
    TEXT
    ========================= */

    if (savedPost.text) {

      const text =
        document.createElement("div");

      text.className =
        "post-text";

      text.textContent =
        savedPost.text;

      post.appendChild(text);

    }


    /* =========================
    PHOTO
    ========================= */

    if (
      savedPost.media &&
      typeof savedPost.media === "string" &&
      savedPost.mediaType &&
      savedPost.mediaType
        .toLowerCase()
        .startsWith("image/")
    ) {

      const image =
        document.createElement("img");

      image.className =
        "post-media";

      image.src =
        savedPost.media;

      image.alt =
        "Published photo";

      image.onload = function() {

        console.log(
          "✅ Profile photo loaded"
        );

      };

      image.onerror = function() {

        console.log(
          "❌ Profile photo failed to load"
        );

      };

      post.appendChild(image);

    }


    /* =========================
    VIDEO / REEL
    ========================= */

    if (
      savedPost.media &&
      typeof savedPost.media === "string" &&
      savedPost.mediaType &&
      savedPost.mediaType
        .toLowerCase()
        .startsWith("video/")
    ) {

      const video =
        document.createElement("video");

      video.className =
        "post-media";

      video.src =
        savedPost.media;

      video.controls = true;

      video.playsInline = true;

      post.appendChild(video);

    }


    /* =========================
    POST INFO
    ========================= */

    const info =
      document.createElement("div");

    info.className =
      "post-info";

    info.textContent =
      "❤️ " +
      (Number(savedPost.likeCount) || 0) +
      "   💬 " +
      (
        Array.isArray(savedPost.comments)
        ? savedPost.comments.length
        : 0
      ) +
      "   ↗️ Share";

    post.appendChild(info);


    postsBox.appendChild(post);

  });

}


/* =========================
START
========================= */

loadProfile();

</script>

</body>

</html>
