<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

/* PROFILE HEADER */

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

/* PROFILE */

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: #ddd;
  margin: auto;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.username {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

.edit-button {
  margin-top: 20px;
  padding: 12px 28px;
  border: none;
  border-radius: 22px;
  background: #111;
  color: white;
  font-size: 15px;
}

/* POSTS */

.posts-title {
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* POST USER */

.post-header {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ddd;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-weight: bold;
  font-size: 17px;
}

/* CAPTION */

.post-text {
  padding: 0 15px 15px;
  font-size: 17px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* MEDIA */

.post-media {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  background: #000;
  display: block;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}

.actions button {
  flex: 1;
  padding: 12px 5px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 22px;
  font-size: 14px;
}

.delete-button {
  width: calc(100% - 24px);
  margin: 0 12px 15px;
  padding: 12px;
  border: 1px solid #ddd;
  background: white;
  color: red;
  border-radius: 22px;
  font-size: 14px;
}

.comments {
  padding: 0 15px 12px;
}

.comment {
  background: #f5f5f5;
  padding: 8px;
  border-radius: 10px;
  margin-top: 7px;
}

.comment-name {
  font-weight: bold;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #777;
}

/* NAV */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
  padding: 5px;
}

/* LARGE POST */

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-box {
  max-width: 700px;
  margin: 30px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.close {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 25px;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: black;
}

.viewer-text {
  padding: 15px;
  font-size: 17px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
👤 Profile
</header>

<section class="profile">

  <div class="profile-avatar">

    <img id="profileImage">

    <span id="avatarIcon">👤</span>

  </div>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="savePhoto(event)"
  >

  <div
    class="username"
    id="username"
  >
    AI Social User
  </div>

  <div
    class="bio"
    id="bio"
  >
    Welcome to my AI Social profile 🚀
  </div>

  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong id="likeCount">0</strong>
      <span>Likes</span>
    </div>

    <div class="stat">
      <strong>0</strong>
      <span>Followers</span>
    </div>

  </div>

  <button
    class="edit-button"
    onclick="editProfile()"
  >
    ✏️ Edit Profile
  </button>

</section>

<div class="posts-title">
📸 My Posts
</div>

<div id="myPosts"></div>


<!-- LARGE POST -->

<div id="viewer">

  <button
    class="close"
    onclick="closeViewer()"
  >
    ✕
  </button>

  <div
    class="viewer-box"
    id="viewerBox"
  ></div>

</div>


<!-- NAVIGATION -->

<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>


<script>

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
PROFILE EDIT
========================= */

function editProfile() {

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const name =
    prompt(
      "Enter your username:",
      oldName
    );

  if (name === null) return;

  if (name.trim() === "") {

    alert("Username cannot be empty.");

    return;
  }

  const bio =
    prompt(
      "Enter your bio:",
      oldBio
    );

  if (bio === null) return;

  localStorage.setItem(
    "username",
    name.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  loadProfile();

}


/* =========================
PROFILE PHOTO
========================= */

document
  .querySelector(".profile-avatar")
  .onclick = function() {

    document
      .getElementById("photoInput")
      .click();

  };


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("Please select an image.");

    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      localStorage.setItem(
        "profileImage",
        e.target.result
      );

      showProfilePhoto(
        e.target.result
      );

      /*
       IMPORTANT:
       Update profile information
       in every existing post.
      */

      const posts =
        getPosts();

      const username =
        localStorage.getItem(
          "username"
        ) ||
        "AI Social User";

      posts.forEach(
        function(post) {

          post.username =
            username;

          post.profileImage =
            e.target.result;

        }
      );

      savePosts(posts);

      loadProfile();

    };

  reader.readAsDataURL(file);

}


function showProfilePhoto(data) {

  const img =
    document.getElementById(
      "profileImage"
    );

  const icon =
    document.getElementById(
      "avatarIcon"
    );

  if (!data) {

    img.style.display =
      "none";

    icon.style.display =
      "block";

    return;

  }

  img.src = data;

  img.style.display =
    "block";

  icon.style.display =
    "none";

}


/* =========================
GET POSTS
========================= */

function getPosts() {

  try {

    const data =
      localStorage.getItem(
        "posts"
      );

    if (!data) {
      return [];
    }

    const posts =
      JSON.parse(data);

    if (!Array.isArray(posts)) {
      return [];
    }

    return posts;

  } catch(error) {

    console.log(
      "Post loading error:",
      error
    );

    return [];

  }

}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem(
      "username"
    ) ||
    "AI Social User";

  const bio =
    localStorage.getItem(
      "bio"
    ) ||
    "Welcome to my AI Social profile 🚀";


  document.getElementById(
    "username"
  ).textContent =
    username;


  document.getElementById(
    "bio"
  ).textContent =
    bio;


  /* PHOTO */

  const profileImage =
    localStorage.getItem(
      "profileImage"
    );

  showProfilePhoto(
    profileImage
  );


  /* POSTS */

  const posts =
    getPosts();


  document.getElementById(
    "postCount"
  ).textContent =
    posts.length;


  let likes = 0;

  posts.forEach(
    function(post) {

      likes +=
        Number(
          post.likeCount
        ) || 0;

    }
  );


  document.getElementById(
    "likeCount"
  ).textContent =
    likes;


  const box =
    document.getElementById(
      "myPosts"
    );

  box.innerHTML = "";


  if (posts.length === 0) {

    box.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br>' +
      'Create your first post 📸' +
      '</div>';

    return;

  }


  /* DISPLAY EVERY POST */

  posts.forEach(
    function(postData, index) {

      createPostElement(
        postData,
        index,
        posts,
        box
      );

    }
  );

}


/* =========================
CREATE POST ELEMENT
========================= */

function createPostElement(
  postData,
  index,
  posts,
  box
) {

  const post =
    document.createElement("div");

  post.className =
    "post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className =
    "post-header";


  const avatar =
    document.createElement("div");

  avatar.className =
    "post-avatar";


  if (postData.profileImage) {

    const img =
      document.createElement("img");

    img.src =
      postData.profileImage;

    avatar.appendChild(img);

  } else {

    avatar.textContent =
      "👤";

  }


  const name =
    document.createElement("div");

  name.className =
    "post-username";

  name.textContent =
    postData.username ||
    localStorage.getItem(
      "username"
    ) ||
    "You";


  header.appendChild(
    avatar
  );

  header.appendChild(
    name
  );


  /*
   Clicking username/photo
   opens profile.
  */

  header.onclick =
    function(event) {

      event.stopPropagation();

      window.location.href =
        "profile.html";

    };


  post.appendChild(
    header
  );


  /* CAPTION */

  if (postData.text) {

    const text =
      document.createElement("div");

    text.className =
      "post-text";

    text.textContent =
      postData.text;

    text.onclick =
      function() {

        openViewer(
          postData
        );

      };

    post.appendChild(
      text
    );

  }


  /* MEDIA */

  if (
    postData.media &&
    postData.mediaType
  ) {

    let media = null;


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith(
          "image/"
        )
    ) {

      media =
        document.createElement(
          "img"
        );

      media.src =
        postData.media;

      media.alt =
        "Published photo";

    }


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith(
          "video/"
        )
    ) {

      media =
        document.createElement(
          "video"
        );

      media.src =
        postData.media;

      media.controls =
        true;

      media.playsInline =
        true;

    }


    if (media) {

      media.className =
        "post-media";

      media.onclick =
        function(event) {

          event.stopPropagation();

          openViewer(
            postData
          );

        };

      post.appendChild(
        media
      );

    }

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");


  function updateLike() {

    likeButton.textContent =
      postData.liked === true

      ? "❤️ Unlike " +
        (Number(
          postData.likeCount
        ) || 0)

      : "🤍 Like " +
        (Number(
          postData.likeCount
        ) || 0);

  }


  updateLike();


  likeButton.onclick =
    function(event) {

      event.stopPropagation();


      postData.liked =
        postData.liked !== true;


      if (
        postData.liked
      ) {

        postData.likeCount =
          (
            Number(
              postData.likeCount
            ) || 0
          ) + 1;

      } else {

        postData.likeCount =
          Math.max(
            0,
            (
              Number(
                postData.likeCount
              ) || 0
            ) - 1
          );

      }


      savePosts(
        posts
      );

      loadProfile();

    };


  /* COMMENT */

  const commentButton =
    document.createElement("button");

  commentButton.textContent =
    "💬 Comment";


  commentButton.onclick =
    function(event) {

      event.stopPropagation();


      const comment =
        prompt(
          "💬 Write your comment:"
        );


      if (
        !comment ||
        comment.trim() === ""
      ) {

        return;

      }


      if (
        !Array.isArray(
          postData.comments
        )
      ) {

        postData.comments =
          [];

      }


      postData.comments.push(
        comment.trim()
      );


      savePosts(
        posts
      );

      loadProfile();

    };


  /* SHARE */

  const shareButton =
    document.createElement("button");

  shareButton.textContent =
    "↗️ Share";


  shareButton.onclick =
    function(event) {

      event.stopPropagation();

      sharePost(
        postData
      );

    };


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );

  actions.appendChild(
    shareButton
  );


  post.appendChild(
    actions
  );


  /* COMMENTS */

  if (
    Array.isArray(
      postData.comments
    ) &&
    postData.comments.length > 0
  ) {

    const comments =
      document.createElement(
        "div"
      );

    comments.className =
      "comments";


    postData.comments.forEach(
      function(comment) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "comment";


        const cname =
          document.createElement(
            "span"
          );

        cname.className =
          "comment-name";

        cname.textContent =
          (
            postData.username ||
            "You"
          ) +
          ": ";


        item.appendChild(
          cname
        );

        item.appendChild(
          document.createTextNode(
            comment
          )
        );


        comments.appendChild(
          item
        );

      }
    );


    post.appendChild(
      comments
    );

  }


  /* DELETE */

  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.className =
    "delete-button";

  deleteButton.textContent =
    "🗑️ Delete Post";


  deleteButton.onclick =
    function(event) {

      event.stopPropagation();


      if (
        !confirm(
          "Delete this post?"
        )
      ) {

        return;

      }


      posts.splice(
        index,
        1
      );


      savePosts(
        posts
      );

      loadProfile();

    };


  post.appendChild(
    deleteButton
  );


  box.appendChild(
    post
  );

}


/* =========================
LARGE POST
========================= */

function openViewer(postData) {

  const viewer =
    document.getElementById(
      "viewer"
    );

  const box =
    document.getElementById(
      "viewerBox"
    );

  box.innerHTML = "";


  const user =
    document.createElement(
      "div"
    );

  user.style.padding =
    "15px";

  user.style.fontWeight =
    "bold";

  user.textContent =
    "👤 " +
    (
      postData.username ||
      "You"
    );


  box.appendChild(
    user
  );


  if (
    postData.media &&
    postData.mediaType
  ) {

    let media = null;


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("image/")
    ) {

      media =
        document.createElement(
          "img"
        );

      media.src =
        postData.media;

    }


    if (
      postData.mediaType
        .toLowerCase()
        .startsWith("video/")
    ) {

      media =
        document.createElement(
          "video"
        );

      media.src =
        postData.media;

      media.controls =
        true;

      media.playsInline =
        true;

    }


    if (media) {

      media.className =
        "viewer-media";

      box.appendChild(
        media
      );

    }

  }


  if (postData.text) {

    const text =
      document.createElement(
        "div"
      );

    text.className =
      "viewer-text";

    text.textContent =
      postData.text;

    box.appendChild(
      text
    );

  }


  viewer.style.display =
    "block";

}


function closeViewer() {

  document.getElementById(
    "viewer"
  ).style.display =
    "none";

}


/* =========================
SHARE
========================= */

function sharePost(postData) {

  const text =
    postData.text ||
    "Check out my post on AI Social!";


  if (
    navigator.share
  ) {

    navigator.share({

      title:
        "AI Social",

      text:
        text,

      url:
        window.location.href

    }).catch(
      function(error) {

        console.log(error);

      }
    );

  } else {

    alert(
      "Share is not supported on this device."
    );

  }

}


/* =========================
START
========================= */

loadProfile();

</script>

</body>
</html>
