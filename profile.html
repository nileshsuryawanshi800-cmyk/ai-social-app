<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - AI Social</title><style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  padding-bottom:90px;
}

/* HEADER */
header{
  background:white;
  padding:18px;
  border-bottom:1px solid #ddd;
  font-size:22px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

/* PROFILE */
.profile{
  background:white;
  padding:25px 15px;
  text-align:center;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ddd;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.username{
  margin-top:12px;
  font-size:23px;
  font-weight:bold;
}

.bio{
  margin-top:8px;
  color:#666;
  font-size:15px;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
}

.stat span{
  color:#777;
  font-size:14px;
}

/* EDIT */
.edit-button{
  margin-top:20px;
  padding:13px 30px;
  border:none;
  border-radius:25px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */
.posts-title{
  padding:20px 15px;
  font-size:20px;
  font-weight:bold;
}

.post{
  background:white;
  margin:12px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* POST HEADER */
.post-header{
  padding:15px;
}

.profile-link{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.post-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ddd;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-username{
  font-size:18px;
  font-weight:bold;
}

/* TEXT */
.post-text{
  padding:0 15px 15px;
  font-size:17px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

/* MEDIA */
.post-media{
  width:100%;
  max-height:650px;
  object-fit:contain;
  display:block;
  background:#000;
  cursor:pointer;
}

/* ACTIONS */
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.actions button{
  border:none;
  background:#f2f2f2;
  border-radius:25px;
  padding:14px 4px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.actions button:active{
  transform:scale(.96);
}

/* COMMENTS */
.comments{
  padding:0 15px 12px;
}

.comment{
  background:#f5f5f5;
  padding:9px 12px;
  border-radius:12px;
  margin-top:7px;
}

.comment-name{
  font-weight:bold;
}

/* DELETE */
.delete-button{
  width:calc(100% - 24px);
  margin:0 12px 15px;
  border:1px solid #ffdddd;
  background:#fff5f5;
  color:red;
  border-radius:25px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#777;
  padding:40px 20px;
}

/* NAV */
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

nav button{
  border:none;
  background:none;
  font-size:14px;
  padding:5px;
}

/* FULL POST */
#postViewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:2000;
  overflow-y:auto;
  padding:20px 10px;
}

.viewer-box{
  max-width:700px;
  margin:45px auto 30px;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

.viewer-close{
  position:fixed;
  top:12px;
  right:12px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:white;
  font-size:25px;
  z-index:2001;
}

.viewer-profile{
  padding:15px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
}

.viewer-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  overflow:hidden;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.viewer-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.viewer-media{
  width:100%;
  max-height:75vh;
  object-fit:contain;
  background:#000;
}

.viewer-content{
  padding:16px;
  font-size:17px;
  white-space:pre-wrap;
}

.viewer-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.viewer-actions button{
  border:none;
  background:#f2f2f2;
  border-radius:25px;
  padding:13px 4px;
  font-weight:bold;
}

.viewer-info{
  padding:10px 15px 15px;
  color:#555;
}
</style></head><body><header>
👤 My Profile
</header><section class="profile">  <div class="profile-avatar">
    <img id="profileImage" alt="Profile photo">
    <span id="avatarIcon">👤</span>
  </div>  <div class="username" id="username">
    AI Social User
  </div>  <div class="bio" id="bio">
    Welcome to my AI Social profile 🚀
  </div>  <div class="stats"><div class="stat">
  <strong id="postCount">0</strong>
  <span>Posts</span>
</div>

<div class="stat">
  <strong>0</strong>
  <span>Followers</span>
</div>

<div class="stat">
  <strong>0</strong>
  <span>Following</span>
</div>

  </div>  <button class="edit-button" onclick="editProfile()">
    ✏️ Edit Profile
  </button></section><div class="posts-title">
  📸 My Posts
</div><div id="myPosts"></div><!-- FULL POST VIEW --><div id="postViewer">  <button class="viewer-close" onclick="closePost()">
    ✕
  </button>  <div class="viewer-box" id="viewerBox"></div></div><!-- NAVIGATION --><nav>  <button onclick="goHome()">
    🏠<br>Home
  </button>  <button onclick="goSearch()">
    🔍<br>Search
  </button>  <button onclick="goCreate()">
    ➕<br>Create
  </button>  <button onclick="goAI()">
    🤖<br>AI
  </button>  <button onclick="goProfile()">
    👤<br>Profile
  </button></nav><script>

/* =========================
NAVIGATION
========================= */

function goHome(){
  window.location.href="index.html";
}

function goSearch(){
  window.location.href="search.html";
}

function goCreate(){
  window.location.href="create.html";
}

function goAI(){
  window.location.href="chat.html";
}

function goProfile(){
  window.location.href="profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile(){

  const oldName =
    localStorage.getItem("username") ||
    "AI Social User";

  const oldBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const name =
    prompt(
      "Enter your username:",
      oldName
    );

  if(name === null){
    return;
  }

  if(name.trim() === ""){
    alert("Username cannot be empty.");
    return;
  }

  const bio =
    prompt(
      "Enter your bio:",
      oldBio
    );

  if(bio === null){
    return;
  }

  localStorage.setItem(
    "username",
    name.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  loadProfile();

  alert("✅ Profile updated!");
}


/* =========================
PROFILE PHOTO
========================= */

function loadProfilePhoto(){

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");

  const saved =
    localStorage.getItem("profileImage");

  if(saved){

    image.src = saved;
    image.style.display = "block";
    icon.style.display = "none";

  }else{

    image.style.display = "none";
    icon.style.display = "block";

  }
}


/* =========================
GET POSTS
========================= */

function getPosts(){

  try{

    const saved =
      localStorage.getItem("posts");

    if(!saved){
      return [];
    }

    const posts =
      JSON.parse(saved);

    return Array.isArray(posts)
      ? posts
      : [];

  }catch(error){

    console.log(error);
    return [];

  }
}


/* =========================
SAVE POSTS
========================= */

function savePosts(posts){

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
PROFILE LOAD
========================= */

function loadProfile(){

  /* NAME */

  const name =
    localStorage.getItem("username") ||
    "AI Social User";

  document.getElementById(
    "username"
  ).textContent = name;


  /* BIO */

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById(
    "bio"
  ).textContent = bio;


  /* PHOTO */

  loadProfilePhoto();


  /* POSTS */

  const posts =
    getPosts();

  const box =
    document.getElementById("myPosts");

  box.innerHTML = "";

  document.getElementById(
    "postCount"
  ).textContent = posts.length;


  if(posts.length === 0){

    box.innerHTML =
      '<div class="empty">' +
      'No posts yet.<br><br>' +
      'Go to ➕ Create and publish your first post 📸' +
      '</div>';

    return;

  }


  posts.forEach(function(postData,index){

    createPostElement(
      postData,
      index,
      posts,
      box
    );

  });

}


/* =========================
CREATE PROFILE POST
========================= */

function createPostElement(
  postData,
  index,
  posts,
  box
){

  const post =
    document.createElement("div");

  post.className = "post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className = "post-header";


  const profileLink =
    document.createElement("div");

  profileLink.className =
    "profile-link";


  profileLink.onclick =
    function(){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };


  const avatar =
    document.createElement("div");

  avatar.className =
    "post-avatar";


  if(postData.profileImage){

    const img =
      document.createElement("img");

    img.src =
      postData.profileImage;

    avatar.appendChild(img);

  }else{

    avatar.textContent =
      "👤";

  }


  const name =
    document.createElement("div");

  name.className =
    "post-username";

  name.textContent =
    postData.username ||
    localStorage.getItem("username") ||
    "You";


  profileLink.appendChild(avatar);
  profileLink.appendChild(name);

  header.appendChild(profileLink);

  post.appendChild(header);


  /* TEXT */

  if(postData.text){

    const text =
      document.createElement("div");

    text.className =
      "post-text";

    text.textContent =
      postData.text;

    text.onclick =
      function(){

        openPost(postData);

      };

    post.appendChild(text);

  }


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    const type =
      postData.mediaType.toLowerCase();

    if(type.startsWith("image/")){

      const image =
        document.createElement("img");

      image.className =
        "post-media";

      image.src =
        postData.media;

      image.alt =
        "Published photo";

      image.onclick =
        function(){

          openPost(postData);

        };

      post.appendChild(image);

    }


    if(type.startsWith("video/")){

      const video =
        document.createElement("video");

      video.className =
        "post-media";

      video.src =
        postData.media;

      video.controls = true;
      video.playsInline = true;

      video.onclick =
        function(event){

          event.stopPropagation();

          openPost(postData);

        };

      post.appendChild(video);

    }

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* LIKE */

  const likeButton =
    document.createElement("button");

  function updateLike(){

    likeButton.textContent =
      "❤️ Like " +
      (Number(postData.likeCount) || 0);

  }

  updateLike();


  likeButton.onclick =
    function(event){

      event.stopPropagation();

      postData.liked =
        postData.liked !== true;

      if(postData.liked){

        postData.likeCount =
          (Number(postData.likeCount) || 0) + 1;

      }else{

        postData.likeCount =
          Math.max(
            0,
            (Number(postData.likeCount) || 0) - 1
          );

      }

      savePosts(posts);

      updateLike();

    };


  /* COMMENT */

  const commentButton =
    document.createElement("button");

  commentButton.textContent =
    "💬 Comment";


  commentButton.onclick =
    function(event){

      event.stopPropagation();

      const comment =
        prompt("Write your comment:");

      if(
        comment === null ||
        comment.trim() === ""
      ){
        return;
      }

      if(
        !Array.isArray(postData.comments)
      ){

        postData.comments = [];

      }

      postData.comments.push(
        comment.trim()
      );

      savePosts(posts);

      loadProfile();

    };


  /* SHARE */

  const shareButton =
    document.createElement("button");

  shareButton.textContent =
    "↗️ Share";


  shareButton.onclick =
    function(event){

      event.stopPropagation();

      sharePost(postData);

    };


  actions.appendChild(likeButton);
  actions.appendChild(commentButton);
  actions.appendChild(shareButton);

  post.appendChild(actions);


  /* COMMENTS */

  const commentsBox =
    document.createElement("div");

  commentsBox.className =
    "comments";


  if(
    Array.isArray(postData.comments)
  ){

    postData.comments.forEach(
      function(comment){

        const item =
          document.createElement("div");

        item.className =
          "comment";

        const commentName =
          document.createElement("span");

        commentName.className =
          "comment-name";

        commentName.textContent =
          (postData.username || "You") +
          ": ";

        item.appendChild(
          commentName
        );

        item.appendChild(
          document.createTextNode(comment)
        );

        commentsBox.appendChild(item);

      }
    );

  }

  post.appendChild(commentsBox);


  /* DELETE */

  const deleteButton =
    document.createElement("button");

  deleteButton.className =
    "delete-button";

  deleteButton.textContent =
    "🗑️ Delete Post";


  deleteButton.onclick =
    function(event){

      event.stopPropagation();

      if(
        !confirm(
          "Are you sure you want to delete this post?"
        )
      ){

        return;

      }

      posts.splice(index,1);

      savePosts(posts);

      loadProfile();

    };


  post.appendChild(deleteButton);

  box.appendChild(post);

}


/* =========================
OPEN POST LARGE
========================= */

function openPost(postData){

  const viewer =
    document.getElementById(
      "postViewer"
    );

  const box =
    document.getElementById(
      "viewerBox"
    );

  box.innerHTML = "";


  /* PROFILE */

  const profile =
    document.createElement("div");

  profile.className =
    "viewer-profile";


  const avatar =
    document.createElement("div");

  avatar.className =
    "viewer-avatar";


  const profileImage =
    postData.profileImage ||
    localStorage.getItem("profileImage") ||
    "";


  if(profileImage){

    const img =
      document.createElement("img");

    img.src =
      profileImage;

    avatar.appendChild(img);

  }else{

    avatar.textContent =
      "👤";

  }


  const name =
    document.createElement("span");

  name.textContent =
    postData.username ||
    localStorage.getItem("username") ||
    "You";


  profile.appendChild(avatar);
  profile.appendChild(name);


  profile.onclick =
    function(){

      closePost();

    };


  box.appendChild(profile);


  /* MEDIA */

  if(
    postData.media &&
    postData.mediaType
  ){

    const type =
      postData.mediaType.toLowerCase();

    if(type.startsWith("image/")){

      const image =
        document.createElement("img");

      image.className =
        "viewer-media";

      image.src =
        postData.media;

      box.appendChild(image);

    }

    if(type.startsWith("video/")){

      const video =
        document.createElement("video");

      video.className =
        "viewer-media";

      video.src =
        postData.media;

      video.controls = true;
      video.playsInline = true;

      box.appendChild(video);

    }

  }


  /* CAPTION */

  if(postData.text){

    const text =
      document.createElement("div");

    text.className =
      "viewer-content";

    text.textContent =
      postData.text;

    box.appendChild(text);

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "viewer-actions";


  const like =
    document.createElement("button");

  like.textContent =
    "❤️ Like " +
    (Number(postData.likeCount) || 0);


  like.onclick =
    function(){

      postData.liked =
        postData.liked !== true;

      if(postData.liked){

        postData.likeCount =
          (Number(postData.likeCount) || 0) + 1;

      }else{

        postData.likeCount =
          Math.max(
            0,
            (Number(postData.likeCount) || 0) - 1
          );

      }

      savePosts(getPosts());

      like.textContent =
        "❤️ Like " +
        (Number(postData.likeCount) || 0);

    };


  const comment =
    document.createElement("button");

  comment.textContent =
    "💬 Comment";


  comment.onclick =
    function(){

      const text =
        prompt("Write your comment:");

      if(
        text &&
        text.trim()
      ){

        if(
          !Array.isArray(postData.comments)
        ){

          postData.comments = [];

        }

        postData.comments.push(
          text.trim()
        );

        savePosts(getPosts());

        openPost(postData);

      }

    };


  const share =
    document.createElement("button");

  share.textContent =
    "↗️ Share";

  share.onclick =
    function(){

      sharePost(postData);

    };


  actions.appendChild(like);
  actions.appendChild(comment);
  actions.appendChild(share);

  box.appendChild(actions);


  /* INFO */

  const info =
    document.createElement("div");

  info.className =
    "viewer-info";

  info.textContent =
    "❤️ " +
    (Number(postData.likeCount) || 0) +
    "    💬 " +
    (
      Array.isArray(postData.comments)
      ? postData.comments.length
      : 0
    ) +
    " comments";


  box.appendChild(info);

  viewer.style.display =
    "block";

}


/* =========================
CLOSE POST
========================= */

function closePost(){

  document.getElementById(
    "postViewer"
  ).style.display =
    "none";

}


/* =========================
SHARE
========================= */

function sharePost(postData){

  const text =
    (
      postData.username ||
      "You"
    ) +
    "\n\n" +
    (
      postData.text ||
      "Check out my post on AI Social!"
    );


  if(navigator.share){

    navigator.share({
      title:"AI Social",
      text:text,
      url:window.location.href
    });

    return;

  }


  if(navigator.clipboard){

    navigator.clipboard.writeText(text)
      .then(function(){

        alert("✅ Post copied!");

      });

    return;

  }


  alert("Sharing is not supported on this device.");

}


/* =========================
START
========================= */

loadProfile();

</script></body>
</html>
