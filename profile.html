<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - AI Social</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 80px;
}

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #ddd;
  font-size: 21px;
  font-weight: bold;
}

.profile {
  background: white;
  padding: 25px 20px;
  text-align: center;
}

.profile-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  margin: auto;
  overflow: hidden;
  cursor: pointer;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.username {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

.bio {
  margin-top: 8px;
  color: #666;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  color: #777;
  font-size: 14px;
}

.edit-button {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: white;
  cursor: pointer;
}

.posts-title {
  padding: 20px;
  font-size: 18px;
  font-weight: bold;
}

.post {
  background: white;
  margin: 12px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.post-header {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 24px;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-username {
  font-weight: bold;
}

.post-text {
  padding: 0 15px 15px;
  font-size: 17px;
  white-space: pre-wrap;
}

.post-media {
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  background: black;
  display: block;
  cursor: pointer;
}

.actions {
  display: flex;
  gap: 12px;
  padding: 12px 15px;
  border-top: 1px solid #eee;
}

.actions button {
  border: none;
  background: none;
  font-size: 15px;
  cursor: pointer;
}

.comments {
  padding: 0 15px 10px;
}

.comment {
  margin-top: 8px;
}

.delete-button,
.edit-post-button {
  border: none;
  background: none;
  padding: 10px 15px;
  cursor: pointer;
}

.delete-button {
  color: red;
}

.edit-post-button {
  color: #111;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  font-size: 14px;
}

#postViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}

.viewer-box {
  max-width: 700px;
  margin: 40px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

.viewer-close {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  font-size: 24px;
}

.viewer-media {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: black;
}

.viewer-text {
  padding: 15px;
  font-size: 18px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}
</style>
</head>

<body>

<header>👤 Profile</header>

<section class="profile">

  <div class="profile-avatar" onclick="choosePhoto()">
    <img id="profileImage" style="display:none;">
    <span id="avatarIcon">👤</span>
  </div>
