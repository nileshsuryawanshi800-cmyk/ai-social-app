.post-text {

  width: 100%;
  max-height: 600px;
  object-fit: contain;

}

.comments {
  padding: 0 15px 10px;
}

}

  border: none;
  background: none;
  color: red;
  padding: 10px 15px 15px;
  cursor: pointer;
  font-size: 14px;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;

  background: white;

/* FULL POST VIEW */

#postViewer {
  display: none;

  border: none;

}

.viewer-sound {
  width: calc(100% - 30px);

}

/* =========================
NAVIGATION
========================= */

function goHome() {
  window.location.href = "index.html";
}

function goSearch() {
  window.location.href = "search.html";
}

function goCreate() {
  window.location.href = "create.html";
}

function goAI() {
  window.location.href = "chat.html";
}

function goProfile() {
  window.location.href = "profile.html";
}


/* =========================
EDIT PROFILE
========================= */

function editProfile() {

  const currentUsername =
    localStorage.getItem("username") ||
    "AI Social User";

  const currentBio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  const username = prompt(
    "Enter your username:",
    currentUsername
  );

  if (username === null) return;

  if (username.trim() === "") {

    alert("⚠️ Username cannot be empty.");

    return;
  }

  const bio = prompt(
    "Enter your bio:",
    currentBio
  );

  if (bio === null) return;

  localStorage.setItem(
    "username",
    username.trim()
  );

  localStorage.setItem(
    "bio",
    bio.trim()
  );

  /* UPDATE USERNAME INSIDE EXISTING POSTS */

  let posts = getPosts();

  posts.forEach(function(post) {

    post.username =
      username.trim();

    post.profileImage =
      localStorage.getItem("profileImage") || null;

  });

  savePosts(posts);

  loadProfile();

  alert("✅ Profile updated!");

}


/* =========================
PROFILE PHOTO
========================= */

function choosePhoto() {

  document
    .getElementById("photoInput")
    .click();

}


function savePhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("⚠️ Please select an image.");

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    const imageData =
      e.target.result;

    localStorage.setItem(
      "profileImage",
      imageData
    );

    /* UPDATE PHOTO IN POSTS */

    let posts = getPosts();

    posts.forEach(function(post) {

      post.profileImage =
        imageData;

    });

    savePosts(posts);

    showProfilePhoto(imageData);

    loadProfile();

  };

  reader.readAsDataURL(file);

}


function showProfilePhoto(imageData) {

  const image =
    document.getElementById("profileImage");

  const icon =
    document.getElementById("avatarIcon");

  if (!imageData) {

    image.style.display = "none";

    icon.style.display = "block";

    return;
  }

  image.src =
    imageData;

  image.style.display =
    "block";

  icon.style.display =
    "none";

}


/* =========================
POST STORAGE
========================= */

function getPosts() {

  try {

    return JSON.parse(
      localStorage.getItem("posts") || "[]"
    );

  } catch(error) {

    return [];

  }

}


function savePosts(posts) {

  localStorage.setItem(
    "posts",
    JSON.stringify(posts)
  );

}


/* =========================
LOAD PROFILE
========================= */

function loadProfile() {

  const username =
    localStorage.getItem("username") ||
    "AI Social User";

  const bio =
    localStorage.getItem("bio") ||
    "Welcome to my AI Social profile 🚀";

  document.getElementById(
    "username"
  ).textContent =
    username;

  document.getElementById(
    "bio"
  ).textContent =
    bio;


  /* PROFILE PHOTO */

  const savedImage =
    localStorage.getItem("profileImage");

  showProfilePhoto(savedImage);


  /* POSTS */

  const postsBox =
    document.getElementById("myPosts");

  postsBox.innerHTML = "";


  const savedPosts =
    getPosts();


  document.getElementById(
    "postCount"
  ).textContent =
    savedPosts.length;


  if (savedPosts.length === 0) {

    postsBox.innerHTML =
      '<div class="empty">No posts yet.<br>Create your first post 📸</div>';

    return;
  }


  savedPosts.forEach(
    function(savedPost, index) {

      const post =
        document.createElement("div");

      post.className =
        "post";


      /* =========================
      POST HEADER
      ========================= */

      const postHeader =
        document.createElement("div");

      postHeader.className =
        "post-header";

      postHeader.onclick =
        function(event) {

          event.stopPropagation();

          openPost(savedPost);

        };


      const avatar =
        document.createElement("div");

      avatar.className =
        "post-avatar";


      if (savedPost.profileImage) {

        const img =
          document.createElement("img");

        img.src =
          savedPost.profileImage;

        avatar.appendChild(img);

      } else {

        avatar.textContent =
          "👤";

      }


      const name =
        document.createElement("div");

      name.className =
        "post-username";

      name.textContent =
        savedPost.username ||
        username;


      /* NAME OPENS PROFILE */

      name.onclick =
        function(event) {

          event.stopPropagation();

          window.location.href =
            "profile.html";

        };


      avatar.onclick =
        function(event) {

          event.stopPropagation();

          window.location.href =
            "profile.html";

        };


      postHeader.appendChild(
        avatar
      );

      postHeader.appendChild(
        name
      );


      post.appendChild(
        postHeader
      );


      /* =========================
      TEXT
      ========================= */

      if (savedPost.text) {

        const text =
          document.createElement("div");

        text.className =
          "post-text";

        text.textContent =
          savedPost.text;

        text.onclick =
          function() {

            openPost(savedPost);

          };

        post.appendChild(text);

      }


      /* =========================
      MEDIA
      ========================= */

      if (
        savedPost.media &&
        savedPost.mediaType
      ) {

        let media = null;


        if (
          savedPost.mediaType
            .toLowerCase()
            .startsWith("image/")
        ) {

          media =
            document.createElement("img");

          media.src =
            savedPost.media;

        }


        if (
          savedPost.mediaType
            .toLowerCase()
            .startsWith("video/")
        ) {

          media =
            document.createElement("video");

          media.src =
            savedPost.media;

          media.controls =
            true;

          media.playsInline =
            true;

        }


        if (media) {

          media.className =
            "post-media";

          media.onclick =
            function(event) {

              event.stopPropagation();

              openPost(savedPost);

            };

          post.appendChild(
            media
          );

        }

      }


      /* =========================
      SOUND
      ========================= */

      if (savedPost.sound) {

        const audio =
          document.createElement("audio");

        audio.className =
          "sound-player";

        audio.controls =
          true;

        audio.src =
          savedPost.sound;

        audio.onclick =
          function(event) {

            event.stopPropagation();

          };

        post.appendChild(
          audio
        );

      }


      /* =========================
      ACTIONS
      ========================= */

      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      /* LIKE */

      const likeButton =
        document.createElement("button");

      function updateLikeButton() {

        const count =
          Number(savedPost.likeCount) || 0;

        /* ALWAYS SAY LIKE */

        likeButton.textContent =
          "❤️ Like " +
          count;

      }

      updateLikeButton();


      likeButton.onclick =
        function(event) {

          event.stopPropagation();

          savedPost.liked =
            savedPost.liked !== true;

          if (savedPost.liked) {

            savedPost.likeCount =
              (Number(savedPost.likeCount) || 0) + 1;

          } else {

            savedPost.likeCount =
              Math.max(
                0,
                (Number(savedPost.likeCount) || 0) - 1
              );

          }

          savePosts(savedPosts);

          updateLikeButton();

        };


      /* COMMENT */

      const commentButton =
        document.createElement("button");

      commentButton.textContent =
        "💬 Comment";


      commentButton.onclick =
        function(event) {

          event.stopPropagation();

          const comment =
            prompt(
              "💬 Write your comment:"
            );

          if (
            !comment ||
            comment.trim() === ""
          ) {

            return;

          }

          if (
            !Array.isArray(
              savedPost.comments
            )
          ) {

            savedPost.comments = [];

          }

          savedPost.comments.push(
            comment.trim()
          );

          savePosts(savedPosts);

          loadProfile();

        };


      /* SHARE */

      const shareButton =
        document.createElement("button");

      shareButton.textContent =
        "↗️ Share";


      shareButton.onclick =
        function(event) {

          event.stopPropagation();

          sharePost(savedPost);

        };


      actions.appendChild(
        likeButton
      );

      actions.appendChild(
        commentButton
      );

      actions.appendChild(
        shareButton
      );

      post.appendChild(
        actions
      );


      /* =========================
      COMMENTS
      ========================= */

      const commentsBox =
        document.createElement("div");

      commentsBox.className =
        "comments";


      if (
        Array.isArray(savedPost.comments) &&
        savedPost.comments.length > 0
      ) {

        const title =
          document.createElement("strong");

        title.textContent =
          "💬 Comments";

        commentsBox.appendChild(
          title
        );


        savedPost.comments.forEach(
          function(comment) {

            const item =
              document.createElement("div");

            item.className =
              "comment";

            const commentName =
              document.createElement("span");

            commentName.className =
              "comment-name";

            commentName.textContent =
              username + ": ";

            item.appendChild(
              commentName
            );

            item.appendChild(
              document.createTextNode(
                comment
              )
            );

            commentsBox.appendChild(
              item
            );

          }
        );

      }

      post.appendChild(
        commentsBox
      );


      /* =========================
      DELETE
      ========================= */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "🗑️ Delete Post";


      deleteButton.onclick =
        function(event) {

          event.stopPropagation();

          const answer =
            confirm(
              "🗑️ Are you sure you want to delete this post?"
            );

          if (!answer) return;


          savedPosts.splice(
            index,
            1
          );

          savePosts(
            savedPosts
          );

          loadProfile();

        };


      post.appendChild(
        deleteButton
      );


      postsBox.appendChild(
        post
      );

    }
  );

}


/* =========================
SHARE
========================= */

function sharePost(postData) {

  const text =
    postData.text ||
    "Check out my post on AI Social!";


  if (navigator.share) {

    navigator.share({

      title: "AI Social",

      text: text,

      url: window.location.href

    }).catch(function(error) {

      console.log(error);

    });

  } else if (navigator.clipboard) {

    navigator.clipboard.writeText(
      text +
      "\n\nShared from AI Social"
    ).then(function() {

      alert("✅ Post copied!");

    });

  } else {

    alert(
      "📋 Sharing is not supported on this device."
    );

  }

}
