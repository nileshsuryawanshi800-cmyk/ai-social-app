<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Search - AI Social</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    header {
      background: white;
      padding: 18px;
      border-bottom: 1px solid #ddd;
      font-size: 21px;
      font-weight: bold;
    }

    .search-box {
      padding: 20px;
      background: white;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
    }

    #results {
      padding: 15px;
    }

    .result {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .result:active {
      transform: scale(0.98);
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-photo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .default-photo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .result strong {
      font-size: 18px;
    }

    .result p {
      margin: 8px 0 0;
      color: #555;
    }

    .result-type {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    nav button {
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
      padding: 5px;
    }

  </style>

</head>

<body>

<header>
  🔍 Search
</header>


<div class="search-box">

  <input
    id="searchInput"
    type="text"
    placeholder="Search users, posts or comments..."
    oninput="search()"
  >

</div>


<div id="results">

  <div class="empty">
    Type something to search 🔍
  </div>

</div>


<nav>

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goSearch()">
    🔍<br>Search
  </button>

  <button onclick="goCreate()">
    ➕<br>Create
  </button>

  <button onclick="goAI()">
    🤖<br>AI
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

</nav>


<script>


function goHome() {

  window.location.href = "index.html";

}


function goSearch() {

  window.location.href = "search.html";

}


function goCreate() {

  window.location.href = "create.html";

}


function goAI() {

  window.location.href = "chat.html";

}


function goProfile() {

  window.location.href = "profile.html";

}



function search() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const results =
    document.getElementById("results");


  results.innerHTML = "";


  if (!query) {

    results.innerHTML =
      '<div class="empty">' +
      'Type something to search 🔍' +
      '</div>';

    return;

  }


  const username =
    localStorage.getItem("username") ||
    "You";


  const post =
    localStorage.getItem("newPost") ||
    "";


  const profileImage =
    localStorage.getItem("profileImage") ||
    "";


  let comments = [];


  try {

    comments =
      JSON.parse(
        localStorage.getItem("comments") ||
        "[]"
      );

  } catch (error) {

    comments = [];

  }


  let found = false;



  /* =========================
     SEARCH PROFILE
  ========================= */

  if (
    username
      .toLowerCase()
      .includes(query)
  ) {

    const result =
      document.createElement("div");


    result.className = "result";


    let photoHTML;


    if (profileImage) {

      photoHTML =
        '<img class="profile-photo" ' +
        'src="' +
        profileImage +
        '" ' +
        'alt="Profile photo">';

    } else {

      photoHTML =
        '<div class="default-photo">' +
        '👤' +
        '</div>';

    }


    result.innerHTML =

      '<div class="profile-row">' +

      photoHTML +

      '<div>' +

      '<strong>' +
      username +
      '</strong>' +

      '<div class="result-type">' +
      '👤 Profile' +
      '</div>' +

      '</div>' +

      '</div>';


    result.onclick = function() {

      window.location.href =
        "profile.html";

    };


    results.appendChild(result);

    found = true;

  }



  /* =========================
     SEARCH POST
  ========================= */

  if (
    post &&
    post
      .toLowerCase()
      .includes(query)
  ) {

    const result =
      document.createElement("div");


    result.className = "result";


    let photoHTML;


    if (profileImage) {

      photoHTML =
        '<img class="profile-photo" ' +
        'src="' +
        profileImage +
        '" ' +
        'alt="Profile photo">';

    } else {

      photoHTML =
        '<div class="default-photo">' +
        '👤' +
        '</div>';

    }


    result.innerHTML =

      '<div class="profile-row">' +

      photoHTML +

      '<div>' +

      '<strong>' +
      username +
      '</strong>' +

      '<div class="result-type">' +
      '📸 Post' +
      '</div>' +

      '</div>' +

      '</div>' +

      '<p>' +
      escapeHTML(post) +
      '</p>';


    result.onclick = function() {

      window.location.href =
        "index.html";

    };


    results.appendChild(result);

    found = true;

  }



  /* =========================
     SEARCH COMMENTS
  ========================= */

  comments.forEach(function(comment) {


    let commentText = "";


    /*
      Supports both:
      "Hello"
      and future comment objects
    */

    if (typeof comment === "string") {

      commentText = comment;

    } else if (
      comment &&
      typeof comment.text === "string"
    ) {

      commentText = comment.text;

    }


    if (!commentText) {

      return;

    }


    if (
      commentText
        .toLowerCase()
        .includes(query)
    ) {


      const result =
        document.createElement("div");


      result.className = "result";


      let photoHTML;


      if (profileImage) {

        photoHTML =
          '<img class="profile-photo" ' +
          'src="' +
          profileImage +
          '" ' +
          'alt="Profile photo">';

      } else {

        photoHTML =
          '<div class="default-photo">' +
          '👤' +
          '</div>';

      }


      result.innerHTML =

        '<div class="profile-row">' +

        photoHTML +

        '<div>' +

        '<strong>' +
        username +
        '</strong>' +

        '<div class="result-type">' +
        '💬 Comment' +
        '</div>' +

        '</div>' +

        '</div>' +

        '<p>' +
        escapeHTML(commentText) +
        '</p>';


      result.onclick = function() {

        window.location.href =
          "profile.html";

      };


      results.appendChild(result);

      found = true;

    }

  });



  /* =========================
     NO RESULTS
  ========================= */

  if (!found) {

    results.innerHTML =
      '<div class="empty">' +
      'No results found 🔍' +
      '</div>';

  }

}



/* =========================
   SAFE TEXT
========================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


</script>

</body>

</html>
